<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>탭 공유 실험</title>
  </head>
  <body>
    <button id="share">화면 공유</button>
    <pre id="result">대기 중</pre>
    <video id="video" muted playsinline></video>
    <script>
      const result = document.getElementById('result');
      const video = document.getElementById('video');

      // 공유한 탭의 한 프레임을 캡처해 크기와 왼쪽 위(빨간 상자 자리) 픽셀 색을 확인한다
      async function captureFrame(stream) {
        video.srcObject = stream;
        await video.play();
        await new Promise((r) => setTimeout(r, 500));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const [r, g, b] = ctx.getImageData(Math.floor(canvas.width / 4), Math.floor(canvas.height / 4), 1, 1).data;
        return { width: canvas.width, height: canvas.height, topLeftPixel: [r, g, b] };
      }

      document.getElementById('share').addEventListener('click', async () => {
        result.textContent = '요청 중';
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          const track = stream.getVideoTracks()[0];
          const frame = await captureFrame(stream);
          result.textContent = JSON.stringify({
            status: 'SHARED',
            label: track.label,
            displaySurface: track.getSettings().displaySurface,
            ...frame,
          });
          track.stop();
        } catch (e) {
          result.textContent = JSON.stringify({ status: 'FAILED', name: e.name, message: e.message });
        }
      });
    </script>
  </body>
</html>
