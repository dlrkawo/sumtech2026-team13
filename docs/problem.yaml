    output: 계정이 만들어지고 설정 창과 '도움 시작하기' 버튼이 보인다. 같은 이메일로 다시 가입하거나 비밀번호가 짧으면 이유가 화면에 보인다
    done: "'가입'을 누르면 설정 창이 열리고 '도움 시작하기' 버튼이 보인다 (S1)"
