# 13팀(배포했당께) 문제정의. 키트 형식(statement·canvas·personas·experiences·sources·five_whys·solution_paths·insight·features).
# 10.29 23:50 개정: 심사 리포트(58e313f) 반영
#  - 범위를 "PC로 병원 진료 예약을 하는 60~70대" 하나로 좁힘 (정부24 서류 발급은 같은 유형의 두 번째 예시로만 둠, 인터넷뱅킹·송금은 범위 밖)
#  - experiences는 팀 가족 관찰과 기사 내용을 바탕으로 '대표 상황'을 재구성한 것 (실제 한 사람의 기록이 아님을 source에 표시)
#  - features는 자동 테스트로 확인되는 것(S1~S6)만 남기고, 확인 못 하는 것은 이름에 (부분)을 붙이거나 solution_paths의 deferred로 옮김

statement: >-
  PC로 병원 홈페이지 진료 예약을 하다 화면에서 막힌 60~70대가,
  자녀의 답을 기다리지 않고 지금 화면(공유 화면 또는 화면 사진) 위에 표시된 "여기를 누르세요"를 보며
  한 단계씩 직접 눌러 예약 완료까지 스스로 마치게 한다.

canvas:
  context: |-
    동네 병원과 대학병원이 진료 예약을 홈페이지·앱으로 옮기고, 일부는 전화 예약을 받지 않는다(SRC2).
    60~70대는 예약을 하려고 병원 홈페이지에 들어가지만 '진료과 선택 → 날짜 선택 → 개인정보 입력 → 접수'로 이어지는 화면 중 한 곳에서 멈춘다(E1).
    막히면 화면을 휴대폰으로 찍어 자녀에게 카카오톡으로 보내고 답을 기다린다. 그 사이 원하는 시간의 예약이 마감되기도 한다(E1).
    병원마다 화면 구성이 다르고 자주 바뀌어, 한 번 배운 방법이 다른 병원이나 다음 달에는 통하지 않는다. 정부24 서류 발급처럼 비슷한 '웹 신청'에서도 같은 일이 반복된다(E2).
  customer: |-
    주 사용자: 집에 PC가 있어 병원 예약·정부24 같은 웹 신청을 PC로 해 보려는 60~70대.
      스마트폰 카카오톡·유튜브는 쓰지만, PC 화면의 메뉴 구조와 "선택 완료", "본인인증" 같은 용어에 익숙하지 않다.
      "내과 예약을 하고 싶다"는 정확히 알지만, "지금 화면에서 어디를 눌러야 하는지"를 몰라 멈춘다.
    함께 겪는 사람: 부모의 캡처를 받고 글로 위치를 설명해 주는 30~40대 자녀(이 서비스의 사용자는 아니며, 반복 설명이 줄어드는 쪽).
  root_problem: |-
    지금의 도움(자녀의 카톡 답, 검색·유튜브 사용법, AI 챗봇)은 모두 화면 밖에서 말과 글로 위치를 설명한다.
    60~70대는 "오른쪽 아래 파란 버튼", "날짜 고르고 선택 완료" 같은 설명을 지금 자기 화면의 위치로 옮기지 못한다(E1·E2).
    화면을 직접 보고 "여기"를 짚어 줄 수 있는 사람은 자녀뿐이고, 그 도움은 자녀가 시간이 있을 때만 가능하다.
  impact:
    feeling: |-
      부모는 "또 물어봐야 하나"라는 미안함과, 잘못 눌러 개인정보가 엉뚱하게 제출되거나 예약이 꼬일까 하는 불안을 느낀다(E1·E2).
      자녀는 "저번에도 알려 드렸는데"라는 반복 설명의 피로를 느낀다(E3).
    measurable: |-
      지금: 막힌 뒤 자녀 답을 받기까지 기다리는 동안 예약 시간이 마감되거나(E1), 혼자 하기를 포기하고 직접 창구를 찾아간다(E2).
      이 서비스로 줄이려는 것(시연·사용 테스트에서 볼 지표, 목표치):
      - 막힌 화면에서 다음에 누를 곳을 알게 되기까지 걸리는 시간: 자녀 답 대기(E1에서는 약 2시간) → 사진을 올리고 물은 뒤 1분 안
      - 진료 예약 4단계(진료과 → 날짜 → 개인정보 → 접수 완료)를 자녀 도움 없이 끝까지 마친 비율
      - 같은 종류의 질문을 자녀에게 다시 보낸 횟수
  alternatives:
    - how_used: 막힌 화면을 휴대폰으로 찍어 자녀에게 카카오톡으로 보내거나 전화로 묻는다
      shortcoming: |-
        자녀가 바로 볼 수 있을 때만 해결된다. 회의·근무 중이면 몇 시간 뒤에 답이 온다(E1).
        자녀도 사진만 보고 글로 위치를 설명해야 해서, 부모가 그 설명을 화면에서 다시 찾아야 한다.
      why_ours: 기다리지 않는다. 같은 사진을 올리면 1분 안에, 글이 아니라 사진 위에 누를 곳을 직접 표시해 준다.
    - how_used: 네이버·유튜브에서 "OO병원 인터넷 예약 방법"을 검색해 영상을 보며 따라 한다
      shortcoming: |-
        영상 속 화면이 지금 사이트와 다르다(개편된 화면, 다른 병원). 영상을 멈춰 가며 자기 화면에 옮겨야 한다(E2).
      why_ours: 남이 찍은 옛 화면이 아니라, 지금 내 화면을 기준으로 안내한다. 영상을 되감을 필요 없이 지금 할 한 단계만 보여 준다.
    - how_used: ChatGPT 같은 범용 AI 챗봇에 캡처를 올려 묻는다
      shortcoming: |-
        캡처 → 업로드 → 질문 문장 쓰기를 스스로 해야 하고, 무엇을 어떻게 물어야 할지부터 어렵다. 고령층의 AI 서비스 경험률은 일반 국민의 절반 수준이다(SRC1).
        답이 긴 글이라 결국 위치를 다시 찾아야 한다.
      why_ours: 하고 싶은 일만 짧게 적으면 되고(예를 들어 "병원 예약하고 싶어"), 답은 글 한 줄 + 사진 위 표시 하나로 온다. 다음 화면에서도 같은 방식으로 이어 간다.
    - how_used: 자녀가 원격제어 프로그램으로 접속해 대신 예약해 준다
      shortcoming: |-
        설치·접속 번호 전달부터 어렵고, 남이 내 컴퓨터를 움직이는 것이 불안하다.
        자녀가 대신 누르니 부모는 배우지 못해, 다음 예약 때 같은 부탁을 다시 한다(E3).
      why_ours: 대신 누르지 않는다. 본인이 직접 누르도록 위치만 짚어 주므로, 같은 병원의 다음 예약은 혼자 할 수 있게 된다.

# 대표 사용자 유형. 실존 인물이 아니라 팀 가족 관찰과 E1~E3를 바탕으로 만든 유형.
personas:
  - id: P1
    description: |-
      68세 어머니(주 사용자). 집 거실에 자녀가 쓰던 PC가 있고, 한 달에 한두 번 동네 내과·정형외과 진료를 예약한다.
      스마트폰으로 카카오톡·유튜브는 하지만, 병원 홈페이지에서 진료과를 고르고 날짜를 고르는 단계마다 "이걸 누르는 게 맞나" 하고 멈춘다.
      잘못 눌러 개인정보가 엉뚱하게 넘어갈까 봐 '제출'·'확인' 버튼은 누르기 전에 꼭 자녀에게 묻는다.
    source: 팀 가족 관찰을 바탕으로 한 대표 유형 (E1·E2)
  - id: P2
    description: |-
      38세 직장인 딸(함께 겪는 사람). 근무 중에 어머니의 화면 사진을 받고, 화면을 직접 보지 못한 채 "왼쪽 내과 누르고 오른쪽 아래 파란 버튼"처럼 글로 설명한다.
      병원만 바뀌어 비슷한 질문이 한 달에 여러 번 온다. 이 서비스를 직접 쓰지 않으며, 반복 설명이 줄어드는 쪽이다.
    source: 팀 가족 관찰을 바탕으로 한 대표 유형 (E3)

# 문제 상황을 가장 잘 보여 주도록 팀 가족 관찰과 기사(SRC2) 내용을 바탕으로 재구성한 대표 장면. 특정 한 사람의 실제 기록은 아님.
experiences:
  - id: E1
    when: 평일 오전 9시, 동네 내과 홈페이지 예약이 열리는 시간
    what_happened: |-
      P1 유형의 어머니가 PC로 내과 진료를 예약하려고 '온라인 진료 예약' 화면에 들어갔다.
      진료과를 고르지 않고 오른쪽 아래 '예약하기'부터 눌러 "진료과를 선택해 주세요"라는 안내만 반복해서 떴다.
      진료과 목록이 버튼인 줄 몰라 화면 어디를 눌러야 하는지 찾지 못했다.
    workaround: |-
      화면을 휴대폰으로 찍어 딸에게 카카오톡으로 보냈다. 딸은 회의 중이라 약 2시간 뒤 "왼쪽 '내과'를 먼저 누르고 오른쪽 아래 파란 버튼"이라고 답했다.
      그사이 오전 진료 예약이 마감되어 오후로 바꿔야 했다.
    feeling: 답을 기다리는 동안 "이것도 혼자 못 하나" 싶어 속상하고, 바쁜 딸에게 또 연락한 게 미안했다.
    quote: "\"파란 버튼은 아까 눌렀는데 안 되더라. 내과를 먼저 누르는 거였어?\""
    source: 대표 상황 재구성 (팀 가족 관찰 바탕, SRC2의 '앱·온라인 예약만 받는 병원' 상황 반영)
  - id: E2
    when: 주말 오후, 정부24에서 주민등록등본을 떼려던 때
    what_happened: |-
      유튜브의 "정부24 등본 발급 방법" 영상을 틀어 놓고 따라 했지만, 영상의 메뉴 위치와 지금 화면이 달라 같은 버튼을 찾지 못했다.
      개인정보를 넣는 화면에서는 '제출'을 누르면 무엇이 어디로 가는지 몰라 누르지 못하고 멈췄다.
    workaround: 혼자 하기를 포기하고 월요일에 주민센터 창구를 직접 찾아갔다.
    feeling: 영상대로 했는데도 안 되니 "내가 뭘 잘못하는지도 모르겠다"는 답답함과, 잘못 제출할까 하는 불안을 느꼈다.
    quote: "\"영상이랑 화면이 달라서 뭘 눌러야 할지 모르겠더라.\""
    source: 대표 상황 재구성 (팀 가족 관찰 바탕)
  - id: E3
    when: 한 달 사이, 근무 시간 중 여러 번
    what_happened: |-
      P2 유형의 딸이 어머니에게서 병원 예약 화면 사진을 한 달에 서너 번 받았다. 병원만 다를 뿐 '진료과 → 날짜 → 개인정보 → 접수'의 비슷한 단계에서 막힌 사진이었다.
      한 번은 원격제어로 대신 예약해 드렸지만, 다음 달 다른 병원에서 같은 질문이 다시 왔다.
    workaround: 사진 위에 손가락으로 동그라미를 그려 보내거나, 퇴근 후 전화로 하나씩 불러 줬다.
    feeling: 도와드리고 싶지만 매번 같은 설명을 처음부터 하는 데 지치고, 대신 해 드리면 다음에도 혼자 못 하신다는 걸 느꼈다.
    quote: "\"저번 병원이랑 똑같아요, 엄마. 왼쪽 거 먼저 누르고 파란 버튼이요.\""
    source: 대표 상황 재구성 (팀 가족 관찰 바탕)

sources:
  - id: SRC1
    url: "https://www.mt.co.kr/tech/2026/03/27/2026032710093798860"
    title: "\"아들아, 챗GPT가 뭐니?\"…취약계층 AI 경험률, 일반인 절반 그쳐 (2025 디지털정보격차 실태조사, 과기정통부·NIA)"
    claim: |-
      2025년 디지털 취약계층의 디지털 역량 수준은 일반 국민 대비 65.9%이고, 그중 고령층이 56.2%로 가장 낮다.
      취약계층의 AI 서비스 경험률은 평균 31.9%로 일반 국민(59.4%)의 절반 수준이다.
      → 기기가 없어서가 아니라 쓰는 능력에서 막힌다는 배경이며, 범용 AI 챗봇에 스스로 질문을 써서 묻는 방식이 이들에게 맞지 않음을 뒷받침한다.
      이 서비스의 수요나 병원 예약에서 막히는 빈도 자체를 증명하지는 않는다.
  - id: SRC2
    url: "https://kyeonggi.com/article/20231218580406"
    title: "[천자춘추] 친절한 의료서비스 접근 시스템 (경기일보, 2023.12.19, 인천고령사회대응센터 부연구위원 기고)"
    claim: |-
      병원 예약 앱은 대기 시간을 줄여 주지만 디지털 접근성이 낮은 노인은 진료를 받지 못하거나 훨씬 오래 기다려야 할 수 있고,
      일부 병원은 앱 예약만 받고 전화 예약은 받지 않는다. 도우미가 있어도 화면을 대신 눌러 주는 데 그치는 경우가 많다.
      → 진료 예약이 온라인으로 옮겨 가 노인이 혼자 처리해야 하는 상황과, '대신 눌러 주는 도움'의 한계를 보여 준다. 기고문이며 통계 수치는 없다.

five_whys:
  symptom: 60~70대가 PC로 병원 예약을 하다 한 화면에서 막히면, 자녀 답을 기다리는 사이 예약 시간이 마감되거나 혼자 하기를 포기한다(E1·E2). 병원이 바뀌면 같은 일이 다시 생긴다(E3).
  whys:
    - 왜 해결이 늦어지는가? 막힌 화면을 사진으로 찍어 자녀에게 보내고, 자녀가 시간이 날 때까지 기다려야 하기 때문이다(E1).
    - 왜 자녀를 기다려야 하는가? 검색·유튜브 영상을 봐도 그 설명을 지금 자기 화면에 옮기지 못해, 자녀 외에 기댈 곳이 없기 때문이다(E2).
    - 왜 설명을 자기 화면에 옮기지 못하는가? 모든 설명이 "오른쪽 아래 파란 버튼", "날짜 고르고 선택 완료"처럼 화면 밖에서 말과 글로 위치를 가리키는데, 화면 구조와 용어에 익숙하지 않으면 그 말을 위치로 바꾸는 것 자체가 어렵기 때문이다.
    - 왜 화면 밖에서 설명하는 도움밖에 없는가? 부모의 화면을 직접 보고 그 위에서 "여기"라고 짚어 줄 수 있는 것이 지금까지는 자녀(사람)뿐이었기 때문이다.
    - 왜 자녀가 짚어 줘도 반복되는가? 자녀가 대신 누르거나 글로만 알려 주면 부모가 직접 눌러 보며 익히지 못해, 병원·화면이 바뀌면 처음부터 다시 물어야 하기 때문이다(E3, SRC2의 '대신 눌러 주는 도움').

solution_paths:
  - path: 지금 화면(공유 화면 또는 화면 사진)을 AI가 보고, 다음에 누를 곳 하나를 화면 위에 표시하며 쉬운 말 한 줄로 안내해, 본인이 직접 눌러 끝까지 마치게 한다
    status: chosen
    reason: |-
      다섯 번 '왜'의 끝은 "화면 위에서 '여기'를 짚어 주는 도움이 자녀에게만 있고, 대신 해 주면 배우지 못한다"였다.
      위치를 화면 위에 직접 표시하므로 "오른쪽 아래" 같은 말을 해석할 필요가 없고(why 3), 자녀를 기다리지 않으며(why 1·4), 본인이 직접 누르므로 다음에는 혼자 할 수 있다(why 5).
      질문은 하고 싶은 일만 짧게 적으면 되도록 해, 질문 문장을 쓰기 어려운 사용자도 쓸 수 있게 했다(SRC1).
  - path: 사람(자녀·상담원)이 직접 안내한다
    status: rejected
    reason: 지금의 방식 그대로라 도와줄 사람의 시간이 있을 때만 가능하고(E1), 상담원을 두면 비용이 들어 예약이 열리는 시간에 바로 도움받기 어렵다.
  - path: 원격제어로 대신 예약해 준다
    status: rejected
    reason: 도와줄 사람이 여전히 필요하고, 남이 내 컴퓨터를 움직이는 불안이 있으며, 대신 해 주면 배우지 못해 같은 부탁이 반복된다(E3).
  - path: 병원별 예약 방법 영상·설명서를 만들어 둔다
    status: rejected
    reason: 병원이 너무 많고 화면이 자주 바뀌어 설명서가 금방 실제 화면과 달라진다(E2의 영상 문제와 같다).
  - path: 인터넷뱅킹·송금처럼 돈이 오가는 일, 휴대폰 앱 화면 안내
    status: deferred
    reason: |-
      송금은 주로 휴대폰 앱에서 하고, AI가 위치를 잘못 짚었을 때 피해가 커서 첫 범위로 맞지 않다.
      휴대폰 브라우저는 다른 앱 화면을 공유할 수 없어 전용 앱이 필요하다. 이번에는 PC 웹의 '신청형 업무'(병원 예약, 정부24 발급)로 범위를 좁힌다.
  - path: 말로 묻기(음성 인식), 다른 창 위에 항상 떠 있는 아이콘 창, 큰 흐름 '할 일 목록'
    status: deferred
    reason: |-
      핵심 문제(위치를 몰라 멈춤)를 푸는 데 꼭 필요하지 않고, 실제 마이크·창 배치처럼 자동 테스트로 확인할 수 없는 부분이 많다.
      글자로 묻고 한 단계씩 안내받는 핵심 흐름을 먼저 완성한 뒤 붙인다.
  - path: 막혔을 때 보호자(자녀)에게 지금 단계를 공유한다
    status: deferred
    reason: AI 안내로 해결되지 않는 경우의 보조 수단이다. 이번 범위는 '자녀 없이 혼자 끝까지'에 집중한다.

insight:
  claim: |-
    60~70대가 병원 예약에서 멈추는 이유는 "무엇을 해야 하는지"를 몰라서가 아니라, 들은 설명을 "지금 내 화면의 어느 위치"로 옮기지 못해서다.
    그래서 더 자세한 설명이 아니라, 화면 위에 다음에 누를 곳 하나를 직접 짚어 주는 도움이 필요하다. 그리고 그 도움은 대신 눌러 주지 않아야 다음에 혼자 할 수 있다.
  evidence: |-
    팀 가족 관찰을 정리한 E1~E3에서, 부모는 하고 싶은 일("내과 예약")은 정확히 말했지만 "오른쪽 아래 파란 버튼" 같은 글 설명을 화면에서 찾지 못했고(E1),
    영상을 따라 해도 화면이 달라 멈췄으며(E2), 대신 해 준 다음 달에 같은 질문이 다시 왔다(E3).
    가족만 보면 편향될 수 있어 외부 자료도 확인했다. 고령층의 디지털 역량은 일반 국민 대비 56.2%로 가장 낮고(SRC1),
    병원 예약이 앱·온라인으로 옮겨 가며 노인이 진료 접근에서 밀리고, 현장 도우미도 대신 눌러 주는 데 그친다(SRC2).
  design_decision: |-
    사용 순서(사용자 행동 기준):
    1. 가입·로그인하면 설정 창이 열리고 '도움 시작하기'를 누른다. (자녀 없이 언제든 시작 → why 1)
    2. 막힌 화면을 AI에게 보여 준다. 집 PC에서는 '▶'로 화면을 공유하고, 공유가 어렵거나 휴대폰으로 찍어 둔 사진이 있으면 '화면 사진 올리기'로 올린다.
    3. '질문 입력'에 하고 싶은 일만 적고 '물어보기'를 누른다. (예: "병원 예약하고 싶어" → SRC1, 질문 쓰기 부담 줄임)
    4. 쉬운 말 한 줄 안내와 함께 화면 위에 누를 곳 하나가 표시된다. 본인이 실제 사이트에서 그곳을 직접 누른다. (why 3·5)
    5. 다음 화면이 나오면 '다음 화면 보기'로 새 화면을 보여 주고 같은 방식으로 이어 간다. 접수 완료 화면이 나오면 '다 끝났어요'로 마무리를 알려 준다.
    표시 위치: 웹 페이지는 다른 프로그램 위에 직접 그릴 수 없어, 누를 곳은 도우미 창에 보이는 '지금 화면과 똑같은 사본' 위에 표시한다.
      사본은 실제 화면과 배치가 같아 "오른쪽 아래"라는 말을 해석할 필요 없이 같은 모양의 버튼을 찾으면 된다. 실제 화면 위에 직접 그리는 것은 전용 프로그램이 필요해 다음 단계로 둔다.
    불안을 줄이는 세 가지:
    - 한 번에 한 곳만 표시하고, '답변 중' 아이콘으로 지금 무엇을 하고 있는지 보여 준다.
    - '제출'·'결제'·'삭제'처럼 되돌리기 어려운 버튼을 가리킬 때는 누르기 전에 경고한다. AI가 위치를 잘못 짚을 수 있고, 사용자가 가장 두려워하는 순간이기 때문이다(P1, E2).
    - 화면 이미지는 저장하지 않고 분석 후 버린다. 예약 화면에는 이름·연락처가 담기기 때문이다. 질문 기록도 '기록 저장'을 끄면 남지 않는다.
    한계: AI 답은 매번 문장이 조금씩 다를 수 있다. 누를 곳을 찾지 못하면 표시 없이 "화면을 다시 보여 주세요" 안내만 한다. 화면 공유('▶')는 PC 크롬·엣지에서만 된다.

# features ↔ scenarios: F1~F6은 흐름 S1~S6과 하나씩 짝을 이루고, done은 해당 흐름의 expected 그대로다.
# F7(화면 공유)은 브라우저의 공유 선택 창을 자동 테스트가 고를 수 없어 흐름이 없다 → 이름에 (부분)을 붙여 구분.
# 흐름의 화면 사진은 e2e/fixtures/: mock-step1.png(진료과 선택), mock-step2.png(예약 날짜 선택), mock-unclear.png(개인정보 입력, '제출'), mock-done.png(접수 결과)
features:
  - id: F1
    name: 가입하고 도움 시작하기
    input: 첫 화면에서 '가입하기' → 이메일·비밀번호(8자 이상) → '가입'
    output: 계정이 만들어지고 설정 창과 '도움 시작하기' 버튼이 보인다. 같은 이메일로 다시 가입하거나 비밀번호가 짧으면 이유가 화면에 보인다
    done: "'가입'을 누르면 설정 창이 열리고 '도움 시작하기' 버튼이 보인다 (S1)"
  - id: F2
    name: 화면 사진을 올려 묻고 누를 곳 안내 받기
    input: "'도움 시작하기' → '화면 사진 올리기'로 막힌 화면 사진(진료과 선택 화면) → '질문 입력'에 '병원 예약하고 싶어' → '물어보기'"
    output: "'답변 중' 아이콘 뒤에 '1단계' 안내 한 줄과, 올린 사진 위에 누를 곳 하나를 감싼 '여기를 누르세요' 표시"
    done: "'1단계' 안내 문장과 사진 위의 '여기를 누르세요' 표시가 보인다 (S2)"
  - id: F3
    name: 다음 화면으로 이어서 끝까지 안내 받기
    input: "첫 안내를 받은 뒤 '다음 화면 보기' → 다음 화면 사진(예약 날짜 선택) → 마지막에 접수 결과 화면 사진"
    output: "'2단계' 안내와 새 누를 곳 표시. 접수 완료 화면이면 표시 없이 '다 끝났어요' 안내"
    done: "예약 날짜 선택 화면 사진에는 '2단계' 안내가 보이고, 접수 결과 화면 사진을 올리면 '다 끝났어요' 안내가 보인다 (S3)"
  - id: F4
    name: 되돌리기 어려운 버튼 경고
    input: "개인정보 입력 화면('제출' 버튼) 사진 → '질문 입력'에 '예약 마무리하고 싶어' → '물어보기'"
    output: "누를 곳 표시와 함께 '되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고 (설정에서 끌 수 있음, 기본 켜짐)"
    done: "'되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고가 보인다 (S4)"
  - id: F5
    name: 도움 기록
    input: "질문('병원 예약하고 싶어')을 물어본 뒤 아이콘 아래 '설정' → 설정 창의 '도움 기록'"
    output: 지난 질문과 받은 안내 한 줄의 목록 (최신순, 화면 이미지는 저장하지 않음)
    done: "'도움 기록' 목록에 '병원 예약하고 싶어'가 보인다 (S5)"
  - id: F6
    name: 기록 남기지 않기 (개인정보 보호)
    input: "새로 가입한 계정의 설정 창에서 '기록 저장'을 끄고 '도움 시작하기' → 사진을 올려 '병원 예약하고 싶어'를 물어봄 → '설정' → '도움 기록'"
    output: 화면 이미지는 언제나 저장하지 않고, '기록 저장'을 끄면 질문과 안내도 남지 않는다
    done: "'도움 기록'에 '아직 도움 기록이 없어요'가 보인다 (S6)"
  - id: F7
    name: 화면 공유로 바로 보여 주기 (부분)
    input: 아이콘 모드에서 '▶'를 누르고 브라우저의 공유 선택 창에서 화면을 고름, '■'로 멈춤
    output: 사진을 따로 찍지 않아도 지금 화면으로 F2·F3과 같은 안내를 받는다. 공유를 취소하면 '화면 사진 올리기'로도 물을 수 있다는 안내가 보인다
    done: "'▶'를 누르면 '보고 있어요'와 '■' 버튼이 보이고, '■'를 누르면 '멈춤'이 보인다 (PC 크롬·엣지 시연으로 확인. 공유 선택 창은 자동 테스트로 고를 수 없어 흐름에서 뺌)"
