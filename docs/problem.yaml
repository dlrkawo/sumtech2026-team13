# 13팀(배포했당께) 문제정의. 종이 캔버스(10.29)와 팀 정리본을 키트 형식으로 옮기고, 심사 기준에 맞춰 다듬음(10.29 22시).
# 수치는 sources에 링크한 기사 원문에서 직접 확인한 값만 씀.
# features는 docs/scenarios.yaml의 S1~S8과 e2e/scenarios/S1~S8.spec.ts의 화면 이름·확인 내용을 기준으로 맞춤.

statement: >-
  PC로 병원 예약·공공서비스 신청 같은 웹 업무를 하다 막힌 디지털 취약 부모님이,
  자녀를 기다리지 않고 지금 보고 있는 화면 위에서 "여기를 누르세요"라는 안내를 받아 스스로 끝까지 해결하게 한다.

canvas:
  context: |-
    디지털 취약계층 부모님이 PC 웹사이트로 병원 예약, 공공서비스 신청, 인터넷뱅킹 같은 일을 처리할 때 생긴다.
    원하는 메뉴를 찾지 못하거나 처음 보는 화면이 나오면 거기서 멈추고, 화면을 캡처해 자녀에게 카카오톡으로 보내 도움을 기다린다.
    은행 점포처럼 대면 창구는 줄고(SRC2) 일은 온라인으로 옮겨 가는데, 사이트마다 화면이 다르고 자주 바뀌어 같은 막힘이 계속 반복된다.
  customer: |-
    주 사용자: PC로 웹 업무를 해야 하지만 화면 구조와 용어에 익숙하지 않은 50~70대 부모님.
      "무엇을 하고 싶은지"는 알지만 "지금 화면에서 어디를 눌러야 하는지"를 몰라 멈춘다.
    함께 겪는 사람: 같은 설명을 반복해서 해 주는 자녀.
      바쁜 시간에 도움 요청을 받고, 캡처 화면만 보고 글로 위치를 설명해야 해서 시간이 오래 걸린다.
  root_problem: |-
    기존 도움(검색, 사용법 글, AI 챗봇, 자녀의 카톡 답변)은 모두 화면 밖에서 말과 글로 위치를 설명한다.
    부모님은 "우측 상단", "톱니바퀴", "더보기" 같은 설명을 지금 자기 화면의 위치로 옮기지 못한다.
    지금 이 화면 위에서 "여기"를 직접 짚어 주는 도움은 자녀 한 사람의 시간에만 묶여 있어서, 부모님은 그 자리에서 스스로 해결할 수단이 없다.
  impact:
    feeling: |-
      부모님은 "또 물어봐야 하나?"라는 미안함과, 잘못 눌러 돈이 나가거나 일을 망칠까 하는 불안을 느낀다.
      자녀는 "저번에도 알려줬는데 또?"라는 반복 설명의 피로를 느낀다.
    measurable: |-
      부모님은 막힌 일을 포기하거나, 자녀 답을 기다리느라 해결까지 몇 시간씩 걸린다(five_whys 증상).
      이 서비스로 줄이려는 것과 시연에서 볼 지표:
      - 막힌 순간부터 다음 행동까지 걸리는 시간 (자녀 답 기다림 몇 시간 → 질문 후 안내까지 1분 안)
      - 자녀에게 묻지 않고 혼자 끝까지 마친 일의 비율
      - 같은 질문을 자녀에게 반복한 횟수
  alternatives:
    - how_used: 자녀에게 카카오톡 화면공유 통화를 하거나, 화면을 캡처해 문제점과 함께 보내거나, 전화로 물어본다
      shortcoming: |-
        자녀가 그 시간에 여유가 있어야 가능하다. 자녀가 바쁘면 바로 해결하기 어렵다.
        캡처만 보고 글로 위치를 설명해야 해서 서로 오래 걸리고, 같은 설명이 반복된다.
      why_ours: 자녀를 기다리지 않고 언제든 바로 물을 수 있고, 글이 아니라 화면 위에 누를 곳을 표시해 준다.
    - how_used: 네이버·유튜브에서 사용법을 검색한다
      shortcoming: |-
        검색 결과와 실제 화면이 다를 수 있다(사이트 개편, 다른 기기).
        여러 단계의 설명을 직접 자기 화면에 옮겨 따라 해야 한다.
      why_ours: 남의 화면이 아니라 지금 내 화면을 기준으로, 한 번에 한 단계씩 안내한다.
    - how_used: ChatGPT·Gemini 등 범용 AI 챗봇에 질문한다
      shortcoming: |-
        캡처 → 업로드 → 프롬프트 입력을 사용자가 매번 해야 하고, 무엇을 어떻게 물어야 하는지부터 어렵다.
        답이 글이라 위치를 직접 찾아야 한다. 취약계층의 AI 서비스 경험률은 일반 국민의 절반 수준이다(SRC1).
      why_ours: 하고 싶은 일만 적으면 지금 화면을 보고 누를 곳을 표시해 주므로, 프롬프트를 쓸 줄 몰라도 된다.
    - how_used: 원격제어로 연결해 도움을 받는다
      shortcoming: |-
        다른 사람이 접속해 대신 조작해야 하고, 설치·권한·접속 코드 전달이 어렵다.
        남이 내 컴퓨터를 조작하는 데 대한 불안이 있고, 대신 해 주니 다음에도 혼자 하지 못한다.
      why_ours: 남이 대신 누르지 않고 본인이 직접 누르게 안내해서, 원격 접속 불안 없이 다음에는 혼자 할 수 있게 된다.

# 팀 가족 관찰(insight)을 바탕으로 정리한 대표 사용자. 실존 인물이 아닌 대표 유형임.
personas:
  - id: P1
    description: |-
      60대 후반 어머니. 스마트폰 카카오톡과 유튜브는 쓰지만, PC로 병원 예약이나 정부24 서류 발급을 하려면 메뉴를 찾지 못해 멈춘다.
      막히면 화면을 사진으로 찍어 자녀에게 보내고 답을 기다린다. 잘못 눌러 결제가 될까 봐 낯선 버튼은 누르지 않는다.
    source: 팀원 가족 관찰(insight)
  - id: P2
    description: |-
      30대 직장인 자녀. 근무 중에 부모님 카톡 캡처를 받고, 화면을 직접 보지 못한 채 "오른쪽 위 파란 버튼"처럼 글로 설명한다.
      비슷한 질문이 사이트만 바뀌어 계속 반복되어 피로를 느낀다.
    source: 팀원 가족 관찰(insight)

# 팀원이 실제로 겪은 장면을 적는 칸. 실제 사례만 적는다(지어낸 사례는 심사 질의응답에서 근거가 되지 못함).
# 채울 것: 언제(when), 무슨 일(what_happened), 어떻게 넘겼나(workaround), 그때 기분(feeling), 실제로 들은 말(quote)
experiences: []

sources:
  - id: SRC1
    url: "https://www.mt.co.kr/tech/2026/03/27/2026032710093798860"
    title: "\"아들아, 챗GPT가 뭐니?\"…취약계층 AI 경험률, 일반인 절반 그쳐 (2025 디지털정보격차 실태조사, 과기정통부·NIA)"
    claim: |-
      2025년 디지털 취약계층의 디지털 역량 수준은 일반 국민 대비 65.9%이고, 그중 고령층이 56.2%로 가장 낮다.
      취약계층의 AI 서비스 경험률은 평균 31.9%로 일반 국민(59.4%)의 절반 수준이다.
      → 기기가 없어서가 아니라 쓰는 능력(역량)에서 막힌다는 배경이며, 범용 AI 챗봇에 스스로 묻는 방식이 이들에게 맞지 않음을 뒷받침한다.
      이 서비스의 수요나 PC 웹 작업에서 막히는 빈도 자체를 증명하지는 않는다.
  - id: SRC2
    url: "https://sateconomy.co.kr/news/view/1065575198814592"
    title: "“소외되는 고령층” 은행 점포 1년간 53곳 사라져… 지속적 감소세 (2025.01, 한국은행 경제통계시스템 인용)"
    claim: |-
      은행 점포가 1년 사이 53곳 줄어 5,849곳이 되었고, 비대면 거래에 익숙하지 않은 고령층의 불편과 금융 소외가 우려된다.
      → 대면 창구가 줄어 온라인으로 혼자 처리해야 하는 일이 늘고 있다는 배경이다.
  - id: SRC3
    url: "https://eiec.kdi.re.kr/policy/materialView.do?num=278528"
    title: "2025년 디지털 정보격차 실태조사 결과 (과학기술정보통신부, 2026.03.26, KDI 경제정보센터)"
    claim: |-
      디지털 취약계층의 디지털정보화 종합 수준은 일반 국민 대비 77.9%로 5년 연속 소폭 올랐지만 격차는 여전히 남아 있다.

five_whys:
  symptom: 부모님이 PC로 웹 업무를 하다 막히면 해결까지 몇 시간씩 걸리고, 비슷한 도움 요청이 사이트만 바뀌어 계속 반복된다.
  whys:
    - 왜 해결이 오래 걸리는가? 부모님이 화면을 캡처해 자녀에게 보내고, 자녀가 확인하고 답할 때까지 기다려야 하기 때문이다.
    - 왜 자녀를 기다려야 하는가? 부모님이 혼자서는 해결 방법을 찾지 못해 자녀 외에 기댈 곳이 없기 때문이다.
    - 왜 혼자 해결하지 못하는가? 검색 결과나 설명을 보더라도, 그 내용을 지금 자기 화면의 어느 위치에 적용해야 하는지 연결하지 못하기 때문이다.
    - 왜 설명을 화면과 연결하지 못하는가? 기존의 도움(검색, 안내문, AI 챗봇, 자녀의 카톡 답변)은 모두 화면 밖에서 말이나 글로 위치를 설명하는데, 화면 구조와 용어("우측 상단", "톱니바퀴", "더보기")에 익숙하지 않으면 그 설명을 해석하는 것 자체가 어렵기 때문이다.
    - 왜 화면 밖에서 설명하는 도움밖에 없는가? 부모님의 화면을 직접 보고 그 위에서 "여기"라고 짚어줄 수 있는 존재가 지금까지는 자녀(사람)뿐이었고, 그 도움은 자녀의 시간이 있을 때만 가능했기 때문이다.

solution_paths:
  - path: AI가 지금 화면을 보고 눌러야 할 곳을 화면 위에 표시하며 한 단계씩 안내해, 부모님이 자녀에게 묻지 않고 스스로 해결하게 한다
    status: chosen
    reason: |-
      다섯 번 '왜'의 끝은 "화면 위에서 여기를 짚어 주는 도움이 자녀의 시간에만 묶여 있다"였다. 이 빈자리를 직접 채우는 방법이다.
      글이 아니라 위치를 표시하므로 용어를 해석할 필요가 없고, 본인이 직접 누르므로 다음에는 혼자 할 수 있다.
      프롬프트를 쓸 줄 몰라도 되도록 하고 싶은 일만 적으면 되게 했다(SRC1: 취약계층 AI 경험률은 일반 국민의 절반).
  - path: 사람(자녀·상담원)이 직접 안내한다
    status: rejected
    reason: 지금의 방식 그대로라 도와줄 사람의 시간이 있을 때만 가능하고, 상담원을 두면 비용이 들어 언제든 바로 도움받을 수 없다.
  - path: 원격제어로 대신 조작해 준다
    status: rejected
    reason: 도와줄 사람이 여전히 필요하고, 남이 내 컴퓨터를 조작하는 불안이 있으며, 대신 해 주면 부모님은 배우지 못해 같은 요청이 반복된다.
  - path: 사이트별 사용법 영상·설명서를 만들어 둔다
    status: rejected
    reason: 사이트가 너무 많고 화면이 자주 바뀌어 설명서가 금방 실제 화면과 달라진다. 검색 대안과 같은 한계다.
  - path: 휴대폰 앱 화면도 안내한다
    status: deferred
    reason: 휴대폰 브라우저는 다른 앱 화면을 공유할 수 없어 웹으로는 만들 수 없다. 이번에는 PC 웹으로 범위를 좁히고, 휴대폰은 전용 앱이 필요해 다음 단계로 미룬다.
  - path: 막혔을 때 보호자(자녀)에게 현재 단계를 공유한다
    status: deferred
    reason: AI 안내로 해결되지 않는 경우를 위한 보조 수단이다. 이번 범위는 혼자 해결하기에 집중하고 다음 단계로 미룬다.

insight:
  claim: |-
    부모님이 막히는 이유는 "무엇을 해야 하는지"를 몰라서가 아니라, 설명을 "지금 내 화면의 어느 위치"로 옮기지 못해서다.
    그래서 더 자세한 설명이 아니라, 화면 위에 위치를 직접 짚어 주는 도움이 필요하다.
  evidence: |-
    팀원들이 디지털에 익숙하지 않은 가족을 관찰한 결과, 부모님은 하고 싶은 일(예: 병원 예약)은 정확히 말하면서도 자녀가 글로 보낸 "오른쪽 위 메뉴" 같은 설명을 화면에서 찾지 못했다.
    가족만 보면 편향될 수 있어 통계도 확인했다. 고령층의 디지털 역량 수준은 일반 국민 대비 56.2%로 가장 낮고(SRC1), 대면 창구는 줄고 있다(SRC2).
    기기 접근보다 '쓰는 능력'의 격차가 크다는 점이 관찰과 일치한다.
  design_decision: |-
    사용자가 화면을 공유하면 AI가 지금 화면을 보고, 하고 싶은 일을 글자(기본)나 말(선택)로 받아 눌러야 할 곳을 화면 위에 표시한다.
    부모님이 불안해하지 않도록 세 가지를 지켰다.
    - 한 번에 한 곳만 표시하고, 아이콘(▶/■/답변 중)과 화면 가장자리 표시로 "지금 보고 있는지"를 항상 보여 준다.
    - 결제·송금·삭제 단계에서는 누르기 전에 경고한다. AI가 위치를 잘못 짚을 수 있기 때문이다.
    - 공유 화면 이미지는 저장하지 않고 분석 후 버린다. 화면에 개인정보가 담길 수 있기 때문이다.
    사람이 직접 안내하거나 원격제어로 대신 조작하는 방식은 도와줄 사람이 필요하고 배우지 못해 만들지 않았다.
    한계: 화면 공유는 PC 크롬·엣지에서만 되고, 다른 프로그램 위에 직접 그릴 수 없어 표시는 공유 화면 위에 보여 준다.

# F1~F8은 흐름 S1~S8과 하나씩 짝을 이룸. done은 해당 흐름의 expected와 spec의 expect 확인 내용 그대로.
# F9·F10은 짝이 되는 흐름이 없는 기능(자동 테스트 대신 시연 영상으로 확인). 흐름에 넣거나 뺄지 팀 확인 필요.
features:
  - id: F1
    name: 회원가입
    input: 첫 화면에서 '가입하기'를 누르고 이메일과 비밀번호 입력 후 '가입'
    output: 계정이 만들어지고 설정 창이 열린다
    done: "'가입' 버튼을 누르면 설정 창이 열리고 '도움 시작하기' 버튼이 보인다 (S1)"
  - id: F2
    name: 로그인하고 도움 시작하기
    input: 이메일·비밀번호로 '로그인' 후 설정 창에서 '도움 시작하기'
    output: 설정 창이 닫히고 아이콘 모드로 바뀐다
    done: "'도움 시작하기'를 누르면 설정 창이 사라지고 아이콘 모드에서 '▶' 버튼과 '설정' 버튼이 보인다 (S2)"
  - id: F3
    name: 화면 보기 시작·멈춤 (▶ / ■)
    input: 아이콘 모드에서 '▶'(화면 공유 시작)와 '■'(멈춤) 누르기
    output: 화면 보기 상태가 아이콘에 표시된다
    done: "'▶'를 누른 뒤 '■'를 누르면 '멈춤' 상태가 표시되고 다시 '▶' 버튼이 보인다 (S3)"
  - id: F4
    name: 글자로 묻고 누를 곳 안내 받기
    input: "'▶'로 화면 보기를 시작한 뒤 '질문 입력'에 하고 싶은 일(예: '친구에게 만원 보내고 싶어')을 적고 '물어보기'"
    output: "'답변 중' 아이콘, 다음에 할 일 안내 문장, 화면 위 누를 곳 표시"
    done: "'물어보기'를 누르면 '답변 중' 아이콘이 보이고, 안내 문장과 누를 곳 표시가 나타난다 (S4)"
  - id: F5
    name: 설정 바꾸고 다시 시작하기 (화면 가장자리 표시)
    input: 아이콘 아래 '설정'을 눌러 설정 창에서 '화면 가장자리 표시'를 끄고 '도움 시작하기'
    output: 바꾼 설정이 저장된 채 아이콘 모드로 돌아온다
    done: "아이콘 모드로 돌아오고('▶' 버튼이 보임), 다시 설정 창을 열면 '화면 가장자리 표시'가 꺼져 있다 (S5)"
  - id: F6
    name: 위험 동작 경고
    input: "송금·결제가 들어간 질문(예: '친구에게 만원 보내고 싶어')을 '물어보기'"
    output: 돈이 나가는 단계라는 경고 문구
    done: "'돈이 나가는 버튼이에요. 한 번 더 확인하세요' 경고가 보인다 (S6)"
  - id: F7
    name: 도움 기록
    input: "질문('병원 예약하고 싶어')을 물어본 뒤 '설정' → 설정 창의 '도움 기록'"
    output: 지난 질문 목록 (화면 이미지는 저장하지 않음)
    done: "도움 기록 목록에 '병원 예약하고 싶어'가 보인다 (S7)"
  - id: F8
    name: 음성 인식으로 묻기
    input: "설정 창에서 '음성 인식'을 켜고 '도움 시작하기' → '▶' → '마이크'를 누르고 말하기"
    output: 말한 내용이 '질문 입력'에 글자로 적히고 질문이 보내진다
    done: "'질문 입력'에 '친구에게 만원 보내고 싶어'가 적히고 '답변 중' 아이콘이 보인다 (S8)"
  - id: F9
    name: 개인정보 보호 설정
    input: 설정 창의 기록 저장 켜기·끄기, 기록 전체 삭제
    output: 화면 이미지는 저장하지 않고, 기록 저장을 끄면 안내도 남지 않는다
    done: 기록 저장을 끈 뒤 물어보면 '도움 기록' 목록에 새 항목이 생기지 않는다. 기록 전체 삭제 후 '도움 기록' 목록이 비어 있다
  - id: F10
    name: 항상 위에 떠 있는 아이콘 창
    input: 아이콘 모드에서 떠 있는 창 열기 (크롬·엣지)
    output: 다른 창 위에 아이콘 창이 떠 있고, 지원하지 않는 브라우저는 같은 페이지 안에서 아이콘 모드로 바뀐다
    done: 크롬·엣지에서 아이콘 모드로 바꾼 뒤 다른 프로그램 창을 앞으로 가져와도 아이콘 창이 맨 위에 보인다

# 한계와 남은 과제 (키트에 따로 키가 없어 주석으로 둠. insight.design_decision과 solution_paths의 deferred에도 반영)
# - 화면 공유는 PC 크롬·엣지에서만 됨. 휴대폰 앱 화면은 전용 앱이 필요해 다음 단계(deferred)
# - 웹 페이지는 다른 프로그램 위에 직접 그릴 수 없어 누를 곳 표시는 공유 화면 위에 보여 줌
# - AI가 위치를 잘못 짚을 수 있음 → 결제·송금·삭제는 경고 후 본인이 확인(F6)
# - 공유 화면에 개인정보가 담길 수 있음 → 화면 이미지는 저장하지 않고 분석 후 버림(F9)
# - 화면 공유 선택 창·실제 마이크 입력은 자동 테스트로 재현할 수 없음(S3·S4·S6·S7·S8의 '▶', S8의 말하기) → 시연 영상으로 보여 줌
