# 종이 아래쪽 「연결 점검」 답(정리본 기준, 동기는 종이에만 있음). 대시보드 키가 없어 주석으로 보존. 2-B에서 solution_paths·why_ours로 옮길 때 참고
# 계기 ①→③: 새로운 웹사이트를 이용하다 익숙하지 않은 화면에서 다음 행동을 알 수 없을 때.
# 기회의 창 ①→②: 부모님이 자녀에게 반복적으로 질문하는 것이 부담스럽고, 혼자 해결하고 싶다고 느낄 때.
# 증거 ③→⑤: 카카오톡으로 화면을 보내 질문하거나, 인터넷 검색·AI 챗봇·원격제어로 도움을 받는다.
# 빈자리 ⑤→⑥: 현재 화면과 진행 상황에 맞춰 다음 행동을 안내하고, 문제 해결까지 확인해 주는 기능의 부족.
# 영향 ③→④: 그렇다. 부모님은 혼자 문제를 해결할 수 있고, 자녀는 반복적으로 설명해야 하는 부담을 줄일 수 있다.
# 나은 점 ④→⑥: 매번 자녀에게 질문하거나 사용법을 검색하지 않아도, AI가 현재 화면을 분석하고 단계별로 안내해 스스로 문제를 해결할 수 있다.
# 동기 ②→④(종이, 끝 글자 판독 불확실): 부모님의 디지털 자립. 자녀의 반복적인 설명 부담 감소. 서비스 사용으로 이어짐
# 핵심(정리본): 자녀에게 반복적으로 의존하던 디지털 사용 문제를 AI의 단계별 안내와 확인 과정으로 줄이는 것이 서비스의 가치.
