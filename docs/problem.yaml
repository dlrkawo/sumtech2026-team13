statement: 디지털 서비스 이용에 어려움을 겪는 사용자가 자녀의 답을 기다리지 않고, 지금 화면의 다음에 누를 곳과 쉬운 안내를 보며 직접 작업을 끝까지 마치게 한다.

canvas:
  context: |-
    [확인] 진료 예약이 홈페이지·앱으로 옮겨 가고, 일부 병원은 앱 예약만 받고 전화 예약은 받지 않는다(SRC2).
    [관찰] 팀원 가족(부모 세대)은 낯선 웹 화면에서 다음에 누를 곳을 찾지 못하면 멈추고, 화면을 찍어 자녀에게 카카오톡으로 보내 답을 기다렸다. 또한 이외에도 숙소 예약, ktx예약 등 여러 디지털 서비스 이용을 위해 디지털 취약계층이 디지털에 익숙한 세대의 도움을 필요로 하거나 디지털 서비스를 사용하지 못하여 좌절하는 경우가 관찰되었다. (MZ세대 20명 인터뷰 결과 취합)
    발생 장면: 집에서 PC로 병원 홈페이지에 들어가 '진료과 선택 → 예약 날짜 선택 → 개인정보 입력 → 접수' 화면을 차례로 지나야 할 때, 처음 쓰는 사이트이거나 화면이 바뀌어 다음 버튼이 바로 보이지 않으면 멈춘다. 기차·숙소 예약처럼 여러 화면을 거치는 다른 예약에서도 같은 일이 생긴다(위 인터뷰 취합). 인터뷰는 도와준 쪽(자녀 세대)이 전한 장면이다.
  customer: |-
    주 사용자: 디지털화 된 서비스 이용에 장애를 겪는 디지털 소외계층
    이번 제품 범위의 주 사용자: 스마트폰 메신저는 쓰지만 PC 웹 예약 화면에서 다음에 누를 곳을 정하지 못하는 60~70대(P1). 하고 싶은 일은 알지만 화면 구조와 버튼 이름에 익숙하지 않다.
      [확인] 60~79세의 81%가 디지털 서비스를 쓸 때 주변 도움을 받은 적이 있고, 63%는 도움 요청이 눈치 보이거나 부담스럽다고 답했다(SRC3).
    함께 겪는 사람: 부모의 화면 사진을 받고 글로 위치를 설명하는 자녀(P2). 서비스를 직접 쓰지 않으며 반복 설명이 줄어드는 쪽이다.
    제외: 휴대폰 앱만 쓰는 사람(PC 브라우저 화면 공유 기준), 화면을 거의 볼 수 없는 사람(시각 보조는 범위 밖).
  root_problem: |-
    증상: 하고 싶은 일(예: 내과 예약, 특정 시간대 기차 예약)은 알지만, 지금 화면에서 다음에 누를 곳을 정하지 못해 멈춘다([관찰]).
    원인 가설(하나로 확정하지 않음, 확인 방법은 각 가설 끝에 적음):
    - H1 위치 번역: 도움이 "오른쪽 아래 파란 버튼"처럼 화면 밖의 말로 오고, 그 말을 자기 화면의 위치로 옮기지 못한다. 확인: 글 설명만 받았을 때와 화면 위 표시를 받았을 때 바로 누르는지 비교한다.
    - H2 용어: '선택 완료', '본인인증' 같은 버튼·메뉴 이름의 뜻을 몰라 맞는 버튼인지 판단하지 못한다. 확인: 멈춘 순간 "무엇을 찾고 있었는지" 물어 버튼 이름 때문인지 가린다.
    - H3 실수 두려움: 위치는 짐작해도 '제출'·'결제'처럼 되돌리기 어려운 버튼을 잘못 누를까 봐 누르지 않는다. 확인: 위치를 알고도 누르지 않은 경우가 있는지, 그 이유를 묻는다.
    - H4 화면을 함께 보고 짚어 줄 사람은 자녀 혹은 디지털화 세대의 사람인데, 작업할 때 곁에 없는 경우가 많다. [확인] 65세 이상 고령자 가구의 37.8%가 1인 가구다(SRC6). 함께 사는 경우는 이 근거만으로 설명되지 않고, 도움 요청 자체가 부담이라는 점(SRC3 63%)이 함께 작용한다고 본다([해석]). 확인: 막혔을 때 실제로 누구에게, 얼마 뒤에 도움을 받았는지 기록한다.
    검토한 다른 원인: 글자·그림 크기(키오스크에서 44.1%가 어려움으로 꼽음, SRC5)는 화면 확대로 일부 줄일 수 있어 이번 원인 가설에서 주원인으로 두지 않았다. 본인인증 절차 자체의 복잡함과 사이트 오류는 이 서비스로 줄지 않아 범위 밖에 둔다.
  impact:
    feeling: |-
      [관찰] 자녀에게 다시 묻는 것을 미안해하고, 자녀는 같은 설명을 반복하는 데 지친다.
      [확인] 60~79세의 63%가 도움을 요청하는 것이 눈치 보이거나 부담스럽다고 답했다(SRC3). 키오스크에서는 고령 소비자의 49%가 뒷사람 눈치를 어려움으로 꼽았다(SRC5).
      [가설] 개인정보가 엉뚱하게 제출되거나 예약이 꼬일까 하는 불안이 '누르지 않고 멈춤'으로 이어진다(H3).
    measurable: |-
      4대 정보취약계층의 디지털정보화 종합 수준은 일반 국민 대비 77.9%이고(SRC4), 그중 고령층의 역량 수준은 56.2%로 가장 낮다. 취약계층의 접근 수준은 96.6%라 기기는 있으나 다루는 능력이 부족하다(SRC1, 2025년 10~12월, 15,000명).
      AI 서비스 경험률은 일반 국민 59.4%, 취약계층 31.9%, 고령층 30.2%다(SRC1). 60~79세의 81%는 디지털 서비스를 쓸 때 주변 도움을 받은 적이 있다(SRC3, 2025년 5월, 수도권 60~79세 400명).
      비슷한 무인 화면인 키오스크에서는 65세 이상의 64.2%가 주문에 어려움을 느꼈고, 고령 소비자의 51.4%가 복잡한 작동 방법을 어려움으로 꼽았다(SRC5).
      이 서비스로 줄이려는 값: 막힌 화면에서 다음에 누를 곳을 알게 되기까지 걸린 시간(목표: 사진을 올리고 물은 뒤 1분 안), 모의 예약 4단계를 도움 없이 마친 비율, 같은 질문을 자녀에게 다시 보낸 횟수.
  alternatives:
    - how_used: 막힌 화면을 휴대폰으로 찍어 자녀에게 카카오톡으로 보내거나 전화·영상통화로 묻는다
      shortcoming: |-
        잘 되는 때: 자녀가 바로 답할 수 있고, 영상통화로 화면을 같이 보면 가장 정확하다.
        한계: 자녀가 근무·회의 중이면 답이 늦다. 사진만 보고 글로 설명하면 부모가 그 글을 다시 화면 위치로 옮겨야 한다(H1·H4). 도움 요청 자체가 부담이다(SRC3 63%).
    - how_used: 네이버·유튜브에서 "ktx 예약 방법"등을 찾아 보며 따라 한다
      shortcoming: |-
        잘 되는 때: 화면이 영상과 같으면 멈춰 가며 반복해서 볼 수 있다.
        한계: 정보의 기준이 되는 화면이 개편 전이거나 다른 병원이면 같은 버튼을 찾지 못한다. 검색어를 정하는 것부터 어렵다.
    - how_used: ChatGPT 같은 범용 AI 챗봇에 캡처를 올려 묻는다
      shortcoming: |-
        잘 되는 때: 캡처·업로드·질문 쓰기에 익숙한 사람에게는 화면을 읽고 꽤 정확히 답한다.
        한계: 고령층의 AI 서비스 경험률은 30.2%로 일반 국민(59.4%)의 절반 수준이라(SRC1) 이 과정 자체가 장벽이다. 답이 긴 글이라 위치를 다시 찾아야 한다(H1).
    - how_used: 자녀 혹은 디지털에 익숙한 사람이 대신 작업한다.
      shortcoming: |-
        잘 되는 때: 그 자리에서 확실히 끝난다.
        한계: 자녀 혹은 능력자와의 일정 조율이 필요하며 의존성이 심화된다. 대신 해 주면 본인이 직접 해 보지 못해 같은 부탁이 반복된다. 현장 도우미도 대신 눌러 주는 데 그치는 경우가 많다(SRC2).
    - how_used: 혼자 하기를 포기하고 병원에 전화하거나 오프라인 창구를 찾아간다
      shortcoming: |-
        잘 되는 때: 전화 예약을 받는 병원이면 가장 쉽다.
        한계: 앱·온라인 예약만 받는 병원이 있다(SRC2). 창구 방문은 시간과 이동이 들며 많은 영역이 디지털화가 디폴트값이 되어가는 경향이 있다.

personas:
  - id: P1
    description: |-
      60~70대 부모(주 사용자). 스마트폰 메신저는 쓰지만 PC 웹 예약 화면에서 다음에 누를 곳을 정하지 못하고 멈춘다.
      막히면 화면을 찍어 자녀에게 보내고 답을 기다린다.
    source: 팀원 가족 관찰 및 MZ세대 20명 인터뷰 취합으로 만든 대표 유형
  - id: P2
    description: 부모의 화면 사진을 받고 글로 위치를 설명하는 자녀(함께 겪는 사람). 이 서비스를 직접 쓰지 않는다.
    source: 팀원 가족 관찰 및 MZ세대 20명 인터뷰 취합으로 만든 대표 유형

experiences:
  - id: E1
    what_happened: |-
      부모가 PC로 병원 예약을 하다 메인 화면에서 로그인 방법을 몰라 멈춘다. 이후 화면을 찍어 자녀에게 카카오톡으로 보내고 답을 기다린다.2시간 경과 후 자녀가 답을 보내주어 예약을 마친다. 부모는 다음 예약(1달 후)에도 같은 화면에서 멈추고, 자녀에게 다시 카카오톡으로 물어 답을 기다린다.
    source: 20대 대학생의 경험 인터뷰
  - id: E2
    what_happened: |-
      시장을 지나가던 중 채소가계 할머니가 서울로 올라가는 기차표 예매를 도와달라 요청. 오프라인에서 도와주었지만 방법을 알려주지 못하고 일회성 도움으로 끝남
    source: 20대 대학생의 경험 인터뷰2
  - id: E3
    what_happened: |-
      할아버지가 야구티켓을 구해달라 카카오톡으로 연락함. PC로 예매하려 했으나 로그인 방법을 몰라 멈춤. 이후 화면을 찍어 자녀에게 카카오톡으로 보내고 답을 기다린다. 자녀가 답을 보내주었지만 그 답이 정확히 어느 버튼에 대응하는지 몰라 결국 예매를 못하고 현당 예매를 하러 감.하지만 현장 표 장수가 온라인에 비해 적기에 결국 원하는 좌석을 구하지 못함.
    source: 20대 중반 대학생의 경험 인터뷰3
sources:
  - id: SRC1
    url: "https://www.mt.co.kr/tech/2026/03/27/2026032710093798860"
    title: "\"아들아, 챗GPT가 뭐니?\"…취약계층 AI 경험률, 일반인 절반 그쳐 (머니투데이, 2026.03.27, 2025 디지털정보격차 실태조사)"
    claim: |-
      2025 디지털정보격차 실태조사(15,000명, 2025년 10~12월): 취약계층 접근 96.6%, 역량 65.9%, 고령층 역량 56.2%(최저).
      AI 서비스 경험률 일반 국민 59.4%, 취약계층 31.9%, 고령층 30.2%. 전국 통계라 병원 예약에서 막히는 지점을 직접 보여 주지는 않는다.
  - id: SRC2
    url: "https://kyeonggi.com/article/20231218580406"
    title: "[천자춘추] 친절한 의료서비스 접근 시스템 (경기일보, 2023.12.19, 인천고령사회대응센터 부연구위원 기고)"
    claim: |-
      일부 병원은 앱 예약만 받고 전화 예약은 받지 않아 디지털 접근성이 낮은 노인이 진료를 받지 못하거나 오래 기다릴 수 있고, 도우미도 화면을 대신 눌러 주는 데 그치는 경우가 많다.
      기고문이라 통계 수치는 없다.
  - id: SRC3
    url: "https://www.fnnews.com/news/202508210953157536"
    title: "HP코리아, '우리 함께 디지털' 캠페인 론칭.. 국내 디지털 문해력 조사 결과 발표 (파이낸셜뉴스, 2025.08.21)"
    claim: |-
      HP코리아, 2025년 5월, 수도권 1,000명(만 60~79세 400명) 온라인·현장 설문. 만 60~79세의 81%가 디지털 서비스 이용 시 주변 도움을 받은 적이 있고, 63%가 도움 요청이 눈치 보이거나 부담스럽다고 답했다.
      기업 조사이고 수도권 표본이며, 누구에게 도움을 받는지는 나오지 않는다.
  - id: SRC4
    url: "https://eiec.kdi.re.kr/policy/materialView.do?num=278528"
    title: "2025년 디지털 정보격차 실태조사 결과 (과학기술정보통신부, 2026.03.26, KDI 경제정보센터)"
    claim: 디지털 취약계층의 디지털정보화 종합 수준은 일반 국민 대비 77.9%로 5년 연속 소폭 올랐다. 계층별 세부 수치는 첨부 보고서에 있다.
  - id: SRC5
    url: "https://www.fnnews.com/news/202304051607089413"
    title: "\"고령층 키오스크 사용 불편해요\"...이용 간편화가 급선무 (파이낸셜뉴스, 2023.04.06)"
    claim: |-
      2020 노인실태조사(65세 이상 10,097명)에서 64.2%가 키오스크 주문에 어려움을 느꼈다. 한국소비자원 조사에서 고령 소비자의 51.4%가 복잡한 작동 방법, 49%가 뒷사람 눈치, 44.1%가 작은 그림·글씨를 어려움으로 꼽았다.
      키오스크 조사라 웹 예약 화면에 그대로 옮길 수는 없고, 주문 포기 비율은 나오지 않는다.
  - id: SRC6
    url: "https://www.newsis.com/view/NISX20250929_0003347644"
    title: "고령인구 비중 20% 첫 돌파…상대적 빈곤율 OECD 최고 (뉴시스, 2025.09.29, 2025 고령자 통계)"
    claim: 2025 고령자 통계에서 고령자 가구는 618만 7천 가구이고, 그중 1인 가구가 37.8%로 가장 많다.

five_whys:
  symptom: PC로 병원 예약을 하다 한 화면에서 멈추고, 화면을 찍어 자녀에게 보낸 뒤 답을 기다린다([관찰]).
  whys:
    - 왜 자녀를 기다리는가? 그 화면에서 다음에 누를 곳을 스스로 정하지 못하기 때문이다. ([관찰])
    - 왜 누를 곳을 정하지 못하는가? 가설이 여럿이다. 설명을 위치로 옮기지 못하거나(H1), 버튼 이름의 뜻을 모르거나(H2), 잘못 누를까 두려워서(H3)일 수 있다.
    - 왜 혼자 해결할 다른 수단이 없는가? 검색·영상·AI 챗봇은 화면 밖의 글로 설명하고, 화면을 함께 보고 짚어 줄 사람은 자녀 혹은 디지털화 세대의 사람인데 작업할 때 곁에 없는 경우가 많다(H4, 고령자 가구의 37.8%가 1인 가구 SRC6).
    - 왜 설명을 화면과 연결하지 못하는가? 기존의 도움(검색, 안내문, AI 챗봇, 자녀의 카톡 답변)은 모두 화면 밖에서 말이나 글로 위치를 설명하는데, 화면 구조와 용어("우측 상단", "톱니바퀴", "더보기")에 익숙하지 않으면 그 설명을 해석하는 것 자체가 어렵기 때문이다(H1·H2, [가설]).
    - 왜 화면 밖에서 설명하는 도움밖에 없는가? 팀원 가족 관찰과 인터뷰 취합에서는 부모님의 화면을 직접 보고 그 위에서 "여기"라고 짚어 준 쪽이 주로 자녀 같은 가까운 사람이었고, 그 도움은 그 사람의 시간이 있을 때만 가능했다. 현장 도우미처럼 화면을 함께 보는 도움도 있지만 대신 눌러 주는 데 그치는 경우가 많다(SRC2). 다른 방법이 전혀 없다는 뜻은 아니며, 혼자 있을 때 바로 쓸 수 있는 방법이 드물다는 가설이다(H4, [가설]).

solution_paths:
  - path: 지금 화면(공유 화면 또는 화면 사진)을 AI가 보고, 다음에 누를 곳 하나를 화면 위에 표시하며 쉬운 말 한 문장으로 안내해, 본인이 직접 눌러 끝까지 마치게 한다
    status: chosen
    reason: |-
      위치를 사진 위에 직접 표시하므로 H1(말을 위치로 옮기기)을 건너뛰고, 타인의 도움을 기다리지 않아도 되므로 H4를 줄인다.
      안내 문장은 쉬운 말로 쓰고 버튼 글자를 그대로 인용해 H2를 일부 줄이고, 결제·송금·삭제·제출처럼 되돌리기 어려운 단계에는 경고를 띄워 H3을 일부 줄인다.
      질문은 하고 싶은 일만 짧게 적으면 되도록 해, 질문 문장을 쓰기 어려운 사용자도 쓸 수 있게 했다(SRC1).
      대신 눌러 주지 않으므로 본인이 직접 해 보며 다음에 혼자 할 여지가 생긴다(SRC2의 '대신 눌러 주는 도움'과 다른 점).
      이 경로가 실제로 멈춤을 줄이는지는 사용 테스트 전이라 확인하지 않았다.
  - path: 사람(자녀·상담원)이 직접 안내한다
    status: rejected
    reason: 지금의 방식 그대로라 도와줄 사람의 시간이 있을 때만 가능하고(H4), 상담원을 두면 비용이 든다.
  - path: 원격제어로 대신 예약해 준다
    status: rejected
    reason: 도와줄 사람이 여전히 필요하고, 남이 내 컴퓨터를 움직이는 불안이 있으며, 대신 해 주면 본인이 직접 해 보지 못한다.
  - path: 병원별 예약 방법 영상·설명서를 만들어 둔다
    status: rejected
    reason: 병원이 많고 화면이 자주 바뀌어 설명서가 금방 실제 화면과 달라진다(검색·영상 대안과 같은 한계).
  - path: 인터넷뱅킹·송금처럼 돈이 오가는 일, 휴대폰 앱 화면 안내
    status: deferred
    reason: |-
      송금은 주로 휴대폰 앱에서 하고, AI가 위치를 잘못 짚었을 때 피해가 커서 첫 범위로 맞지 않다.
      휴대폰 브라우저는 다른 앱 화면을 공유할 수 없어 전용 앱이 필요하다. 이번에는 PC 웹의 신청형 업무로 범위를 좁힌다.
  - path: 말로 묻기(음성 인식)를 핵심 흐름에 넣는 것, 다른 창 위에 기본으로 항상 떠 있는 아이콘 창, 큰 흐름 '할 일 목록'
    status: deferred
    reason: |-
      말로 묻기는 설정의 '음성 인식'과 '마이크' 버튼으로 구현돼 있지만, 자동 테스트 브라우저에 마이크가 없어 흐름으로 확인할 수 없어 핵심 흐름에서 뺐다.
      다른 창 위에 떠 있는 창은 기본으로 항상 띄우지 않는다. 지원 브라우저(PC 크롬·엣지 계열)에서 사용자가 고를 때만 여는 '작은 창으로 띄우기'(F8)로만 넣었고, 지원하지 않는 브라우저에서는 원래 페이지를 그대로 쓴다.
      할 일 목록은 만들지 않았다. 핵심 흐름(글자로 묻고 한 단계씩 안내)을 먼저 완성한다.
  - path: 막혔을 때 보호자(자녀)에게 지금 단계를 공유한다
    status: deferred
    reason: AI 안내로 해결되지 않는 경우의 보조 수단이다. 이번 범위는 '자녀 없이 혼자 끝까지'에 집중한다.

insight:
  claim: |-
    [가설] 60~70대가 병원 예약에서 멈추는 큰 이유는 "무엇을 해야 하는지"를 몰라서가 아니라, 들은 설명을 "지금 내 화면의 어느 위치"로 옮기지 못해서다(H1).
    그렇다면 더 자세한 설명보다 화면 위에 다음에 누를 곳 하나를 짚어 주는 도움이 맞다. 다만 용어(H2)나 실수 두려움(H3)이 더 큰 원인이라면 위치 표시만으로는 멈춤이 줄지 않는다.
  evidence: |-
    [인터뷰, 관찰] 팀원 가족은 하고 싶은 일은 말할 수 있었지만, 자녀가 글로 보낸 위치 설명을 화면에서 찾지 못했다.
    [확인] 고령층의 디지털 역량은 일반 국민 대비 56.2%로 가장 낮고(SRC1), 60~79세의 81%가 디지털 서비스에 주변 도움을 받으며 63%가 그 요청을 부담스러워한다(SRC3). 병원 예약이 앱·온라인으로 옮겨 가며 현장 도우미도 대신 눌러 주는 데 그친다(SRC2).
    한계: 관찰 대상이 팀원 가족과 인터뷰 응답자(MZ세대 20명)로 한정되어 일반화에는 한계가 있다. 통계는 배경 자료이고 H1을 직접 입증하지 않는다.
      목표와 지금 검증한 범위는 다르다. 목표는 막힌 사용자가 도움 없이 '혼자 끝까지' 마치는 것이다.
      지금 검증한 범위는 모의 예약 화면 사진(e2e/fixtures/)을 올렸을 때 누를 곳 표시·다음 단계 안내·'다 됐어요'·위험 경고가 화면에 나오는지까지다(S2~S4 E2E).
      화면 사진 위 표시를 보고 실제 사이트의 같은 버튼을 찾아 누르는 과정이 쉬운지, 그래서 도움 없이 끝까지 마치는 비율이 오르는지는 아직 검증 대상이다.
    확인 계획: 가족 2~3명이 모의 예약 화면(e2e/fixtures/와 같은 4단계)으로 예약하는 것을 보고, ① 멈춘 화면과 이유(H1~H3) ② 누를 곳 표시를 본 뒤 바로 눌렀는지를 적는다.
  design_decision: |-
    사용 순서(사용자 행동 기준):
    1. 가입·로그인하면 설정 창이 열리고 '도움 시작하기'를 누른다.
    2. 막힌 화면을 보여 준다. 집 PC에서는 '▶'로 화면을 공유하고, 공유가 어렵거나 휴대폰으로 찍어 둔 사진이 있으면 '사진 올리기'로 올린다.
    3. '질문 입력'에 하고 싶은 일만 적고 '물어보기'를 누른다.
    4. '누를 곳을 찾았어요'와 안내 한 문장, 화면 사진 위의 빨간 테두리(누를 곳)가 보인다. 본인이 실제 사이트에서 그곳을 직접 누른다. (H1·H4)
    5. 다음 화면이 나오면 새 화면을 보여 주고(공유 중이면 그대로, 사진이면 '사진 바꾸기') '눌렀어요, 다음 알려 주세요'를 누른다. 바로 전 안내를 함께 보내 다음 단계를 받는다.
      접수 완료 화면이면 '다 됐어요'가 보이고 더 누를 곳을 표시하지 않는다.
    표시 위치: 웹 페이지는 다른 프로그램 위에 직접 그릴 수 없어, 누를 곳은 도우미 말풍선 안의 '물어볼 때 본 화면' 사진 위에 표시한다.
      사진과 실제 화면은 배치가 같아 "오른쪽 아래" 같은 말을 해석하지 않고 같은 모양의 버튼을 찾으면 된다. 이 방식이 실제로 덜 헷갈리는지는 확인하지 않았다.
    불안을 줄이는 세 가지:
    - 한 번에 한 곳만 표시하고, '답변 중'·'보고 있어요'·'멈춤' 상태를 항상 보여 준다.
    - 결제·송금·삭제·제출처럼 되돌리기 어려운 버튼을 가리키면 누르기 전에 경고한다. AI가 위치를 잘못 짚을 수 있기 때문이다(H3). AI가 위험을 놓쳐도 안내 문장에 '송금·결제·삭제' 같은 낱말이 있으면 서버가 경고를 붙인다.
    - 화면 이미지는 저장하지 않는다. 예약 화면에는 이름·연락처가 담기기 때문이다. 질문과 안내 문장은 '기록 저장'이 켜져 있을 때만 남긴다.
    구현 상태: S1~S7 흐름마다 E2E 테스트가 있다(S7은 작은 창으로 띄웠다가 원래 화면으로 돌아오기). 결제·송금·삭제 경고, 기록 저장 끄기(서버), 설정 창의 '기록 저장' 스위치(#44)가 들어가 있다.
      상태 막대('답변 중'·'보고 있어요'·'멈춤')는 말풍선을 접어도 항상 보이고(#71), 화면 공유를 취소하거나 공유가 끊겨도 '▶'로 다시 시작할 수 있다(#72). 각 흐름의 통과 여부는 docker로 띄운 E2E 결과로 판단한다.
    한계: AI 답은 매번 문장이 조금씩 다를 수 있다. 누를 곳을 찾지 못하면 표시 없이 안내 문장만 보인다. 화면 공유('▶')는 PC 크롬·엣지에서만 된다.
      화면 사진 위 표시를 실제 사이트로 옮겨 찾는 과정이 쉬운지는 아직 검증 대상이다(insight.evidence 한계 참고).

features:
  - id: F1
    name: 가입하고 도움 시작하기
    input: 첫 화면에서 '가입하기' → 이메일·비밀번호(8자 이상) → '가입'
    output: 계정이 만들어지고 설정 창과 '도움 시작하기' 버튼이 보인다. 같은 이메일로 다시 가입하거나 비밀번호가 짧으면 이유가 화면에 보인다
    done: "'가입'을 누르면 설정 창이 열리고 '도움 시작하기' 버튼이 보인다 (S1)"
  - id: F2
    name: 화면 사진을 올려 묻고 누를 곳 안내 받기
    input: "'도움 시작하기' → '눌러보슈 도우미 열기' → 도우미 안에 보이는 '사진 올리기' 버튼으로 막힌 화면 사진(진료과 선택 화면)을 고름 → '질문 입력'에 '병원 예약하고 싶어' → '물어보기'"
    output: |-
      '답변 중' 뒤에 안내 한 문장과 함께, 응답의 status·target 조합(API_CONVENTION.md 10-2)에 따라 아래 중 하나가 보인다. 어느 경우든 '누르는 건 직접 해 주세요.'가 함께 보인다.
      - 누를 곳을 찾음(IN_PROGRESS, target 있음): '누를 곳을 찾았어요'와 'N단계', 올린 사진 위 누를 곳 하나를 감싼 빨간 테두리, '눌렀어요, 다음 알려 주세요'
      - 다음 할 일은 있으나 위치를 짚지 못함(IN_PROGRESS, target 없음): 'N단계', 안내 문장, '눌렀어요, 다음 알려 주세요'만 보인다. '누를 곳을 찾았어요'와 빨간 테두리는 보이지 않는다
      - 화면만으로 판단하기 어려움(NEED_INFO, target 대부분 없음): '화면만으로는 알기 어려워요'와 무엇을 확인할지 알려 주는 안내 문장. '눌렀어요, 다음 알려 주세요'는 없고, 다른 화면 사진으로 바꿔 다시 묻는다
      - 이미 끝난 화면(DONE, target 항상 없음): '다 됐어요'와 안내 문장. 빨간 테두리와 '눌렀어요, 다음 알려 주세요'는 없다
      되돌리기 어려운 버튼 경고(F4)는 결과와 상관없이 함께 붙을 수 있다.
      '사진 올리기'는 화면에 보이는 버튼이며, 화면 공유('▶')가 안 될 때 사용자가 쓰는 대체 경로다(사진을 고르면 '사진 바꾸기'로 바뀐다).
    done: "진료과 선택 화면 사진(정상 고정 이미지)으로 물으면 '누를 곳을 찾았어요'와 안내 문장이 보이고, 올린 사진 위에 누를 곳 표시가 보인다 (S2)"
  - id: F3
    name: 다음 화면으로 이어서 끝까지 안내 받기
    input: "F2의 첫 안내('누를 곳을 찾았어요')를 받은 상태에서 '사진 바꾸기'로 다음 화면 사진(예약 날짜 선택)을 고르고 '눌렀어요, 다음 알려 주세요' → 마지막에 '사진 바꾸기'로 접수 결과 화면 사진을 고르고 다시 '눌렀어요, 다음 알려 주세요'"
    output: |-
      '눌렀어요, 다음 알려 주세요'를 누르거나 바로 전과 같은 질문으로 다시 '물어보기'하면, 새 화면일 때만 이번 일에서 받은 안내를 모두(오래된 순) 함께 보내 다음 단계의 안내를 받고 'N단계'가 하나 올라간다.
      새 화면은 공유 중이면 매번 새로 찍은 장면, 사진이면 지난번과 다른 사진이다. 바로 전 안내가 IN_PROGRESS일 때만 이어지며, 같은 사진·같은 질문으로 '물어보기'하면 새로 묻기(1단계)가 된다.
      사진으로 묻는 중에 지난번과 같은 사진으로 '눌렀어요, 다음 알려 주세요'를 누르면 요청을 보내지 않고 "바뀐 화면을 '사진 바꾸기'로 올린 뒤 다시 눌러 주세요."가 보인다.
      물어볼 화면은 가장 최근에 고른 쪽이다(공유 중에 사진을 고르면 사진, '▶'를 다시 누르면 공유 화면). 말풍선 맨 위에 '화면 공유로 보고 있어요' 또는 '올린 사진으로 물어봐요'가 보인다.
      결과 구분(누를 곳 찾음·target 없음·NEED_INFO·DONE)과 표시는 F2와 같다. NEED_INFO가 나오면 '눌렀어요, 다음 알려 주세요'가 없으므로 다른 화면 사진으로 바꿔 다시 묻는다.
      사진에서 접수 완료 화면을 읽으면 표시 없이 '다 됐어요'가 보인다. '다 됐어요'는 올린 사진의 완료 화면을 읽은 결과이며, 서비스가 실제 예약 접수 여부를 확인하거나 대신 처리하지 않는다.
    done: "같은 사진으로 '다음'을 누르면 요청 없이 '사진 바꾸기' 안내가 보이고, 예약 날짜 선택 화면 사진에는 '누를 곳을 찾았어요'·'2단계'와 누를 곳 표시가, 접수 결과 화면 사진에는 '다 됐어요'가 보인다. 말풍선에는 '올린 사진으로 물어봐요'가 보인다 (S3, 로그인부터 혼자 실행)"
  - id: F4
    name: 되돌리기 어려운 버튼 경고
    input: "'도움 시작하기' → '눌러보슈 도우미 열기' → '사진 올리기'로 개인정보 입력 화면('제출' 버튼) 사진을 고름 → '질문 입력'에 '예약 마무리하고 싶어' → '물어보기'"
    output: "누를 곳 표시와 함께 '되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고 (서버 설정 riskWarning 기본 켜짐. 설정 창에 끄는 스위치는 아직 없음)"
    done: "'되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고가 보인다 (S4)"
  - id: F5
    name: 도움 기록
    input: "새로 가입한 계정에서 '도움 시작하기' → '눌러보슈 도우미 열기' → '사진 올리기'로 사진을 고름 → '병원 예약하고 싶어'를 물어봄 → 아이콘 아래 '설정' → 설정 창의 '도움 기록'"
    output: |-
      이번에 물어본 질문과 받은 안내 문장이 목록 맨 위에 새 항목으로 생긴다 (최신순 최대 50개, 화면 이미지는 저장하지 않음). '기록 모두 지우기'로 전부 지울 수 있다.
      기록 저장이 실패해도 이미 받은 안내는 그대로 보이며, 이때는 새 항목이 생기지 않는다.
    done: "기록이 없던 새 계정의 '도움 기록' 맨 위 항목에 이번에 물어본 '병원 예약하고 싶어'와 받은 안내 문장이 보인다 (S5)"
  - id: F6
    name: 기록 남기지 않기 (개인정보 보호)
    input: "새로 가입한 계정의 설정 창에서 '기록 저장'을 끄고 저장이 끝난 것(스위치가 꺼진 채 유지, 오류 문구 없음)을 확인 → '도움 시작하기' → '눌러보슈 도우미 열기' → '사진 올리기'로 사진을 고름 → '병원 예약하고 싶어'를 물어봄 → '설정' → '도움 기록'"
    output: |-
      화면 이미지는 언제나 저장하지 않는다. '기록 저장' 끄기가 서버에 저장된 뒤 보낸 새 질문부터 질문과 안내가 남지 않는다(서버는 기록을 남길 때마다 최신 설정을 읽는다).
      저장하는 동안에는 '설정을 저장하고 있어요…'가 보이고 '도움 시작하기'를 누를 수 없어, 저장이 끝나기 전에 물어볼 수 없다.
      저장에 실패하면 스위치가 켜진 상태로 돌아가고 설정 창에 오류 문구가 보인다. 끄기 전에 남은 기록은 지워지지 않으며, '도움 기록'의 '기록 모두 지우기'로 따로 지운다.
    done: "'기록 저장' 끄기가 저장된 뒤(스위치가 꺼진 채로 남고 오류 문구 없음) 물어보면 '도움 기록'에 '아직 도움 기록이 없어요'가 보인다. 저장이 끝난 뒤의 질문부터 기록을 남기지 않는다 (S6)"
  - id: F7
    name: 화면 공유로 바로 보여 주기
    input: 아이콘 모드에서 '▶'를 누르고 브라우저의 공유 선택 창에서 화면을 고름, '■'로 멈춤
    output: 사진을 따로 찍지 않아도 물어볼 때 지금 장면을 찍어 F2·F3과 같은 안내를 받는다. 공유가 안 되면 말풍선에 '사진 올리기'로 올리라는 안내가 보인다
    done: "'▶'를 누르고 화면을 고르면 '보고 있어요'가 보이고, '■'를 누르면 '멈춤'이 보인다 (PC 크롬·엣지에서 손으로 확인. 공유 선택 창은 자동 테스트로 고를 수 없어 흐름 없음)"
  - id: F8
    name: 작은 창으로 띄우기 (지원 브라우저에서만 쓰는 선택 기능)
    input: "아이콘 모드에서 '작은 창으로 띄우기' → (작은 창에서) 평소처럼 '눌러보슈 도우미 열기'·▶·'사진 올리기'·'물어보기' → 원래 페이지의 '이 화면으로 돌아오기' 또는 작은 창 닫기"
    output: |-
      지원 조건: 작은 창 기능(Document Picture-in-Picture)을 지원하는 PC 크롬·엣지 계열 브라우저에서만 '작은 창으로 띄우기' 버튼이 보인다. 지원하지 않는 브라우저에서는 버튼이 없고 원래 페이지를 그대로 쓴다. 작은 창을 열지 못하면 '작은 창을 열지 못했어요'가 보인다.
      열기: 눌러보슈 화면(아이콘 모드·설정·도움 기록)이 다른 창 위에 떠 있는 작은 창으로 옮겨 가고, 원래 페이지에는 '작은 창에서 도와드리고 있어요'와 '이 화면으로 돌아오기' 버튼이 보인다. 작은 창으로 옮겨도 화면 공유·안내는 이어진다.
      닫기·돌아오기: '이 화면으로 돌아오기'를 누르거나 작은 창을 닫으면 작은 창이 닫히고 원래 페이지에 눌러보슈 화면이 다시 보인다. 로그아웃해도 작은 창이 닫힌다.
      핵심 흐름(F1~F7)은 작은 창 없이 원래 페이지에서 모두 된다.
    done: "'작은 창으로 띄우기'를 누르면 작은 창에 눌러보슈 도우미(▶·'설정')가 보이고 원래 페이지에 '작은 창에서 도와드리고 있어요'가 보이며, '이 화면으로 돌아오기'를 누르면 작은 창이 닫히고 원래 페이지로 돌아온다 (S7). 다른 프로그램 위에 떠 있는지와 작은 창 안에서 ▶·물어보기·사진 올리기는 PC 크롬·엣지에서 손으로 확인한다(자동 테스트 브라우저에는 다른 프로그램이 없어 확인 불가)"
