      60~70대 부모(주 사용자). 스마트폰 메신저는 쓰지만 PC 웹 예약 화면에서 다음에 누를 곳을 정하지 못하고 멈춘다.
      막히면 화면을 찍어 자녀에게 보내고 답을 기다린다.
    source: 팀원 가족 관찰 및 MZ세대 20명 인터뷰 취합으로 만든 대표 유형
  - id: P2
    description: 부모의 화면 사진을 받고 글로 위치를 설명하는 자녀(함께 겪는 사람). 이 서비스를 직접 쓰지 않는다.
    source: 팀원 가족 관찰 및 MZ세대 20명 인터뷰 취합으로 만든 대표 유형

