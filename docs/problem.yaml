# 제공 원문을 키트 형식으로 정리. 통계·기관별 정책은 독립 검증 전이며 원문 표시를 유지함.
# WHY 4·5, 개별 경험 기록, 출처 URL은 원문에 없어 추가하지 않음.
statement: 디지털 서비스 이용에 어려움을 겪는 사용자가 자녀의 답을 기다리지 않고, 지금 화면의 다음에 누를 곳과 쉬운 안내를 보며 직접 작업을 끝까지 마치게 한다.
canvas:
  context: '[확인] 진료 예약이 홈페이지·앱으로 옮겨 가고, 일부 병원은 앱 예약만 받고 전화 예약은 받지 않는다

    [관찰] 팀원 가족(부모 세대)은 낯선 웹 화면에서 다음에 누를 곳을 찾지 못하면 멈추고, 화면을 찍어 자녀에게 카카오톡으로 보내 답을 기다렸다. 또한 이외에도 숙소 예약, ktx예약 등 여러
    디지털 서비스 이용을 위해 디지털 취약계층이 디지털에 익숙한 세대의 도움을 필요로 하거나 디지털 서비스를 사용하지 못하여 좌절하는 경우가 관찰되었다. (MZ세대 20명 인터뷰 결과 취합)'
  customer: '주 사용자: 디지털화 된 서비스 이용에 장애를 겪는 디지털 소외계층'
  root_problem: '증상: 하고 싶은 일(예: 내과 예약, 특정 시간대 기차 예약)은 알지만, 지금 화면에서 다음에 누를 곳을 정하지 못해 멈춘다([관찰]).

    원인 가설(하나로 확정하지 않음, 확인 방법은 five_whys와 insight에 둠):

    - H1 위치 번역: 도움이 "오른쪽 아래 파란 버튼"처럼 화면 밖의 말로 오고, 그 말을 자기 화면의 위치로 옮기지 못한다.

    - H2 용어: ''선택 완료'', ''본인인증'' 같은 버튼·메뉴 이름의 뜻을 몰라 맞는 버튼인지 판단하지 못한다.

    - H3 실수 두려움: 위치는 짐작해도 ''제출''·''결제''처럼 되돌리기 어려운 버튼을 잘못 누를까 봐 누르지 않는다.

    - H4 화면을 함께 보고 짚어 줄 사람은 자녀 혹은 디지털화 세대의 사람인데,고령화 사회와 독거노인 경향을 보았을 때 작업을 진행할 때 주변에 있을 가능성이 매우 낮다.'
  impact:
    feeling: '[관찰] 자녀에게 다시 묻는 것을 미안해하고, 자녀는 같은 설명을 반복하는 데 지친다.

      [가설] 개인정보가 엉뚱하게 제출되거나 예약이 꼬일까 하는 불안이 ''누르지 않고 멈춤''으로 이어진다(H3).'
    measurable: "[제공 원문 기준·출처 확인 필요] 아래 수치와 기관명은 제공받은 자료를 옮긴 것이며, 조사 연도·원문 URL·대상 집단은 별도 확인이 필요하다. 서로 다른 조사 수치를\
      \ 같은 기준으로 비교하지 않는다.\n\n일반 국민의 디지털 정보화 수준을 100%로 보았을 때, 4대 정보취약계층(고령층·장애인·저소득층·농어민)의 종합 수준은 77.9%에 머물러 있습니다.\
      \ 특히 고령층은 71.8%로 전 계층 중 가장 낮으며, 기본 기기 보유(접근 95.4%)에 비해 이를 일상에 다루는 능력(역량 56.2%)이 턱없이 부족하여 삶의 전반에서 실질적인 불이익을\
      \ 받고 있습니다.\n\n\n분류\t주요 불이익 내용\t통계 지표 및 실태 (출처)\n1. 경제적·금융적\n불이익\t금융·소비 소외 및 사기 노출\n· 오프라인 점포 축소로 이동 고충 발생\n\
      · 모바일 우대금리 및 할인 혜택 배제\n· 스미싱 등 금융사기 식별 능력 부족\t· 취약계층 역량 수준 56.2%: 기기는 있으나 다룰 줄 모름 (과학기술정보통신부·NIA, 디지털정보격차\
      \ 실태조사)\n· 위험 판단력 취약: 정보화 수준 중 '디지털 금융사기 식별' 항목 최하위 기록 (금융감독원 보이스피싱 피해 통계)\n2. 일상생활 및\n이동의 불이익\t생활 장벽 및 이동\
      \ 제약\n· 무인 키오스크 조작 실패로 주문 포기\n· 모바일 앱 전용 예매로 인한 이동 제한\n· 현장 예매 축소로 문화·교통 소외\t· 키오스크 이용 불편: 고령층의 대다수가 뒷사람 눈치\
      \ 및 조작 복잡함으로 '주문 포기' 경험 (한국소비자원 키오스크 실태조사)\n· 교통·매표 소외: 명절 기차표 등의 모바일 선점으로 오프라인 예매 실패율 증가 (한국철도공사 코레일톡 이용\
      \ 현황)\n3. 첨단 기술(AI)\n도입 불평등\tAI 활용 격차로 인한 양극화\n· 인공지능 기반 서비스 접근 기회 격차\n· 정보 습득 및 생산성 격차 심화\n· 기술 난이도로 인한 2차\
      \ 소외\t· AI 서비스 경험률 격차: 일반 국민 51%~59.4% vs 취약계층 30%~31.9%\n· 미이용 원인 1위: 이용자 42.9%가 \"이용 방법이 너무 어려워서\" 응답 (과학기술정보통신부·NIA,\
      \ 디지털정보격차 실태조사)"
  alternatives:
  - how_used: 막힌 화면을 휴대폰으로 찍어 자녀에게 카카오톡으로 보내거나 전화·영상통화로 묻는다
    shortcoming: '잘 되는 때: 자녀가 바로 답할 수 있고, 영상통화로 화면을 같이 보면 가장 정확하다.

      한계: 자녀가 근무·회의 중이면 답이 늦다. 사진만 보고 글로 설명하면 부모가 그 글을 다시 화면 위치로 옮겨야 한다(H1·H4).'
  - how_used: 네이버·유튜브에서 "ktx 예약 방법"등을 찾아 보며 따라 한다
    shortcoming: '잘 되는 때: 화면이 영상과 같으면 멈춰 가며 반복해서 볼 수 있다.

      한계: 정보의 기준이 되는 화면이 개편 전이거나 다른 병원이면 같은 버튼을 찾지 못한다. 검색어를 정하는 것부터 어렵다.'
  - how_used: ChatGPT 같은 범용 AI 챗봇에 캡처를 올려 묻는다
    shortcoming: '잘 되는 때: 캡처·업로드·질문 쓰기에 익숙한 사람에게는 화면을 읽고 꽤 정확히 답한다.

      한계: 고령층의 AI 서비스 경험률은 일반 국민의 절반 수준이라 이 과정 자체가 장벽이다. 답이 긴 글이라 위치를 다시 찾아야 한다(H1).'
  - how_used: 자녀 혹은 디지털에 익숙한 사람이 대신 작업한다.
    shortcoming: '잘 되는 때: 그 자리에서 확실히 끝난다.

      한계: 자녀 혹은 능력자와의 일정 조율이 필요하며 의존성이 심화된다.'
  - how_used: 혼자 하기를 포기하고 병원에 전화하거나 오프라인 창구를 찾아간다
    shortcoming: '잘 되는 때: 전화 예약을 받는 병원이면 가장 쉽다.

      한계: 앱·온라인 예약만 받는 병원이 있다. 창구 방문은 시간과 이동이 들며 많은 영역이 디지털화가 디폴트값이 되어가는 경향이 있다.'
personas:
- id: P1
  description: '60~70대 부모(주 사용자). 스마트폰 메신저는 쓰지만 PC 웹 예약 화면에서 다음에 누를 곳을 정하지 못하고 멈춘다.

    막히면 화면을 찍어 자녀에게 보내고 답을 기다린다.'
  source: '제공 원문: 팀원 가족 관찰 및 MZ세대 20명 인터뷰 취합. 개인별 원기록 미첨부.'
- id: P2
  description: 부모의 화면 사진을 받고 글로 위치를 설명하는 자녀(함께 겪는 사람). 이 서비스를 직접 쓰지 않는다.
  source: '제공 원문: 팀원 가족 관찰 및 MZ세대 20명 인터뷰 취합. 개인별 원기록 미첨부.'
experiences: []
sources: []
five_whys:
  symptom: PC로 병원 예약을 하다 한 화면에서 멈추고, 화면을 찍어 자녀에게 보낸 뒤 답을 기다린다([관찰]).
  whys:
  - 왜 자녀를 기다리는가? 그 화면에서 다음에 누를 곳을 스스로 정하지 못하기 때문이다. ([관찰])
  - 왜 누를 곳을 정하지 못하는가? 가설이 여럿이다. 설명을 위치로 옮기지 못하거나,버튼 이름의 뜻을 모르거나, 잘못 누를까 두려워서일 수 있다.
  - 왜 혼자 해결할 다른 수단이 없는가? 검색·영상·AI 챗봇은 화면 밖의 글로 설명하고, 화면을 함께 보고 짚어 줄 사람은 자녀 혹은 디지털화 세대의 사람인데,고령화 사회와 독거노인 경향을 보았을
    때 작업을 진행할 때 주변에 있을 가능성이 매우 낮다.
solution_paths:
- path: 지금 화면(공유 화면 또는 화면 사진)을 AI가 보고, 다음에 누를 곳 하나를 화면 위에 표시하며 쉬운 말 한 문장으로 안내해, 본인이 직접 눌러 끝까지 마치게 한다
  status: chosen
  reason: '위치를 사진 위에 직접 표시하므로 H1(말을 위치로 옮기기)을 건너뛰고, 타인의 도움을 기다리지 않아도 되므로 H4를 줄인다.

    안내 문장은 쉬운 말로 쓰고 버튼 글자를 그대로 인용해 H2를 일부 줄이고, 결제·송금·삭제 단계에는 경고를 띄워 H3을 일부 줄인다.

    질문은 하고 싶은 일만 짧게 적으면 되도록 해, 질문 문장을 쓰기 어려운 사용자도 쓸 수 있게 했다

    이 경로가 실제로 멈춤을 줄이는지는 사용 테스트 전이라 확인하지 않았다.'
- path: 사람(자녀·상담원)이 직접 안내한다
  status: rejected
  reason: 지금의 방식 그대로라 도와줄 사람의 시간이 있을 때만 가능하고(H4), 상담원을 두면 비용이 든다.
- path: 원격제어로 대신 예약해 준다
  status: rejected
  reason: 도와줄 사람이 여전히 필요하고, 남이 내 컴퓨터를 움직이는 불안이 있으며, 대신 해 주면 본인이 직접 해 보지 못한다.
- path: 병원별 예약 방법 영상·설명서를 만들어 둔다
  status: rejected
  reason: 병원이 많고 화면이 자주 바뀌어 설명서가 금방 실제 화면과 달라진다(검색·영상 대안과 같은 한계).
- path: 막혔을 때 보호자(자녀)에게 지금 단계를 공유한다
  status: deferred
  reason: AI 안내로 해결되지 않는 경우의 보조 수단이다. 이번 범위는 '자녀 없이 혼자 끝까지'에 집중한다.
insight:
  claim: '[가설] 60~70대가 병원 예약에서 멈추는 큰 이유는 "무엇을 해야 하는지"를 몰라서가 아니라, 들은 설명을 "지금 내 화면의 어느 위치"로 옮기지 못해서다(H1).

    그렇다면 더 자세한 설명보다 화면 위에 다음에 누를 곳 하나를 짚어 주는 도움이 맞다. 다만 용어(H2)나 실수 두려움(H3)이 더 큰 원인이라면 위치 표시만으로는 멈춤이 줄지 않는다.'
  evidence: '[인터뷰, 관찰] 팀원 가족은 하고 싶은 일은 말할 수 있었지만, 자녀가 글로 보낸 위치 설명을 화면에서 찾지 못했다.

    [확인] 고령층의 디지털 역량은 일반 국민 대비 56.2%로 가장 낮고(전자누리), 병원 예약이 앱·온라인으로 옮겨 가며 현장 도우미도 대신 눌러 주는 데 그친다.

    한계: 관찰은 팀원 가족뿐이고 기록이 없다. 통계는 배경일 뿐 H1을 입증하지 않는다.

    확인 계획(미수행): 가족 2~3명이 모의 예약 화면(e2e/fixtures/와 같은 4단계)으로 예약하는 것을 보고, ① 멈춘 화면과 이유(H1~H3) ② 누를 곳 표시를 본 뒤 바로 눌렀는지를
    적는다.

    자료 상태: 인터뷰 20명 취합이라는 서술은 제공 원문 기준이며 원기록은 첨부되지 않았다. 통계 및 병원 예약 정책의 출처 URL도 별도 확인이 필요하다.'
  design_decision: "사용 순서(사용자 행동 기준):\n1. 가입·로그인하면 설정 창이 열리고 '도움 시작하기'를 누른다.\n2. 막힌 화면을 보여 준다. 집 PC에서는 '▶'로 화면을\
    \ 공유하고, 공유가 어렵거나 휴대폰으로 찍어 둔 사진이 있으면 '사진 올리기'로 올린다.\n3. '질문 입력'에 하고 싶은 일만 적고 '물어보기'를 누른다.\n4. '누를 곳을 찾았어요'와 안내\
    \ 한 문장, 화면 사진 위의 빨간 테두리(누를 곳)가 보인다. 본인이 실제 사이트에서 그곳을 직접 누른다. (H1·H4)\n5. 다음 화면이 나오면 새 화면을 보여 주고(공유 중이면 그대로,\
    \ 사진이면 '사진 바꾸기') '눌렀어요, 다음 알려 주세요'를 누른다. 바로 전 안내를 함께 보내 다음 단계를 받는다.\n   접수 완료 화면이면 '다 됐어요'가 보이고 더 누를 곳을 표시하지\
    \ 않는다.\n표시 위치: 웹 페이지는 다른 프로그램 위에 직접 그릴 수 없어, 누를 곳은 도우미 말풍선 안의 '물어볼 때 본 화면' 사진 위에 표시한다.\n  사진과 실제 화면은 배치가 같아\
    \ \"오른쪽 아래\" 같은 말을 해석하지 않고 같은 모양의 버튼을 찾으면 된다. 이 방식이 실제로 덜 헷갈리는지는 확인하지 않았다.\n불안을 줄이는 세 가지:\n- 한 번에 한 곳만 표시하고,\
    \ '답변 중'·'보고 있어요'·'멈춤' 상태를 항상 보여 준다.\n- 결제·송금·삭제처럼 되돌리기 어려운 버튼을 가리키면 누르기 전에 경고한다. AI가 위치를 잘못 짚을 수 있기 때문이다(H3).\
    \ AI가 위험을 놓쳐도 안내 문장에 '송금·결제·삭제' 같은 낱말이 있으면 서버가 경고를 붙인다.\n- 화면 이미지는 저장하지 않는다. 예약 화면에는 이름·연락처가 담기기 때문이다. 질문과 안내\
    \ 문장은 '기록 저장'이 켜져 있을 때만 남긴다.\n한계: AI 답은 매번 문장이 조금씩 다를 수 있다. 누를 곳을 찾지 못하면 표시 없이 안내 문장만 보인다. 화면 공유('▶')는 PC 크롬·엣지에서만\
    \ 된다."
features:
