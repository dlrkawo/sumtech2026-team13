# 13팀(배포했당께) 문제정의. 종이 캔버스(10.29 작성)와 학생이 채팅으로 보낸 정리본을 합쳐 옮김.
# 종이와 정리본이 다른 곳은 아래 주석에 출처를 남김. 학생이 말하지 않은 내용은 null 또는 []로 둠.

statement: null # 종이의 한 문장 칸이 비어 있음. 학생 답 대기

canvas:
  # ① 상황. 종이: "부모님"을 지우고 "디지털소외계층분들"로 씀. 예시(병원 예약 등)와 "카카오톡으로 화면을 보내"는 정리본·종이 공통
  context: |-
    디지털 소외계층(부모님)이 병원 예약, 모바일 결제, 공공서비스 신청 등 익숙하지 않은 앱이나 웹사이트를 이용할 때 발생한다.
    원하는 기능을 찾지 못하거나 낯선 화면이 나타나면 사용을 중단하고 자녀에게 카카오톡으로 화면을 보내 도움을 요청한다.
    이러한 어려움은 새로운 서비스를 이용하거나 앱 화면이 변경될 때마다 반복된다.
  # ② 고객. 종이와 정리본 동일
  customer: |-
    익숙하지 않은 앱·웹 → 50, 70대, 반복적 사용법(귀찮음) 알려줘야 → 자식
    부모님은 새로운 기능을 사용할 때마다 자녀에게 도움을 요청하고, 자녀는 같은 설명을 반복하는 데 번거로움과 피로감을 느낀다.
    결국 부모님은 계속 물어보는 것이 부담스럽고, 자녀는 매번 알려주는 것이 귀찮아지는 상황이 발생한다.
  # ③ 근본 문제. 종이 앞면 문장 + 정리본의 5 Whys 결론
  root_problem: |-
    디지털화로 일상생활의 많은 서비스가 온라인으로 전환되었지만, 앱마다 사용법이 다르고 화면도 자주 변경된다.
    기존 검색이나 사용법 안내는 실제 화면과 맞지 않을 수 있어 부모님은 자녀에게 반복적으로 도움을 요청하게 된다.
    결국 현재 화면에 맞춰 문제 해결까지 도와주는 지원이 부족하다.
    "지금 이 화면에서 어디를 눌러야 하는지" 직접 짚어주는 도움이 자녀 한 사람의 시간에만 묶여 있어서, 부모님은 그 자리에서 스스로 해결할 수단이 없다.
  impact:
    feeling: |-
      부모님은 "또 물어봐야 하나?"라는 미안함과 답답함을 느낀다.
      자녀는 "저번에도 알려줬는데 또?"라는 반복적인 설명에 번거로움과 피로감을 느낀다.
    measurable: |-
      부모님은 원하는 서비스를 이용하지 못하거나 포기하게 되고, 자녀는 반복적인 설명으로 시간을 빼앗긴다.
      결국 부모님의 디지털 자립 기회가 줄어든다.
  # ⑤·⑥ 종이에는 A1 자녀에게 묻기, A2 검색, A3 AI·원격제어 / 정리본에는 A1 카카오톡, A2 AI 챗봇, A3 원격제어.
  # 두 기록을 합쳐 네 가지로 나눔. why_ours는 2-B에서 학생 답으로 채움
  alternatives:
    - how_used: 자녀에게 카카오톡 화면공유 통화를 하거나, 화면을 캡처해 문제점과 함께 보내거나, 전화로 물어본다
      shortcoming: |-
        도움 제공자(자녀)가 그 시간에 여유가 있어야 가능하다. 자녀가 바쁘면 즉시 해결하기 어렵다.
        반복적인 설명으로 서로 부담을 느낀다.
      why_ours: 매번 자녀에게 질문하지 않아도, AI가 현재 화면을 분석하고 단계별로 안내해 스스로 문제를 해결할 수 있다.
    - how_used: 네이버·유튜브에서 사용법을 검색한다
      shortcoming: |-
        검색 결과와 실제 화면이 다를 수 있다.
        여러 단계의 설명을 직접 따라 해야 한다.
      why_ours: 사용법을 검색하지 않아도, AI가 현재 화면을 분석하고 단계별로 안내해 스스로 문제를 해결할 수 있다.
    - how_used: ChatGPT·Gemini 등 범용 AI 챗봇에 질문한다
      shortcoming: |-
        AI로 화면을 분석할 수 있지만, 사용자가 질문과 진행 사항을 계속 전달해야 한다.
        캡처 → 업로드 → 프롬프트 입력의 단계가 복잡하고, 답변이 텍스트라 위치를 직접 찾아야 한다.
      why_ours: null
    - how_used: 원격제어로 연결해 도움을 받는다
      shortcoming: |-
        다른 사람의 도움이 필요하다.
        설치·권한·접속 코드 전달이 어렵고, 원격 접속에 대한 불안함이 있다.
      why_ours: null

