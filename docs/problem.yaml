# ════════════════════════════════════════
#  1. 서비스 한눈에 보기
# ════════════════════════════════════════
title: "옆자리 도우미 — 화면을 같이 보며 '여기를 누르세요'를 알려주는 AI"

one_liner: >
  어르신이 PC 화면을 공유하고 "송금하고 싶어"처럼 글자로 적으면,
  AI가 지금 화면에서 눌러야 할 영역을 표시하고 쉬운 말로 한 단계씩 안내합니다.
  화면 위에는 동영상 플레이어처럼 생긴 작은 아이콘(▶/■)만 떠 있어, 지금 화면을 보고 있는지 바로 알 수 있습니다.

target_users:
  primary: "스마트기기·PC 앱 사용이 어려운 만 55세 이상 고령층 (디지털 소외계층)"
  secondary: "멀리 사는 자녀·보호자, 주민센터·복지관 디지털 교육 강사"

# ════════════════════════════════════════
#  2. 문제 정의
# ════════════════════════════════════════
problem:
  situation: >
    은행·병원 예약·민원·쇼핑 서비스가 앱과 웹으로 옮겨 가면서,
    어르신은 '무엇을 하고 싶은지'는 알지만 '화면에서 어디를 눌러야 하는지'를 몰라 멈춥니다.
  pain_points:
    - "생활 필수 서비스(은행·병원·민원·예매)가 앱·키오스크로 옮겨 가고 대면 창구는 줄어든다"
    - "버튼·메뉴 이름이 영어·아이콘·줄임말이라 무엇을 눌러야 할지 모른다"
    - "자녀에게 전화로 물으면 화면을 볼 수 없어 설명이 안 통하고, 매번 묻기 미안해 포기한다"
    - "잘못 눌러 결제·삭제가 될까 두려워 아예 시도하지 않거나, 가짜 링크를 구별하지 못한다"
    - "교육은 일회성이라 집에 돌아오면 다시 막힌다"
  evidence:
    - source: "과학기술정보통신부·NIA, 2025 디지털정보격차 실태조사 (2026.03 발표)"
      facts:
        - "디지털 취약계층의 디지털정보화 수준: 일반 국민 대비 77.9%"
        - "고령층 디지털 역량 수준: 일반 국민 대비 56.2%"
        - "고령층 AI 서비스 경험률 30.2% (일반 국민 59.4%)"
        - "고령층 키오스크 활동률: 일반 국민 대비 54.2%"
    # TODO: 팀이 직접 한 인터뷰·설문이 있으면 추가 (예: 복지관 어르신 N명 인터뷰)

# ════════════════════════════════════════
#  3. 해결 방식
# ════════════════════════════════════════
solution:
  how_it_works:
    - "사이트에 들어가 설정 창 형태의 화면에서 가입·로그인한다"
    - "로그인하면 설정 창이 열리고, '도움 시작하기'를 누르면 아이콘 모드로 바뀐다"
    - "아이콘 모드에서 '▶'를 눌러 PC 화면을 공유하면 화면 보기가 시작되고, '■'로 언제든 멈춘다"
    - "입력창에 하고 싶은 일을 글자로 적는다 (예: '친구에게 만원 보내고 싶어'). 설정에서 마이크를 켜면 말로도 물을 수 있다"
    - "AI가 답하는 동안 아이콘이 '답변 중'으로 바뀌고, 눌러야 할 영역을 표시하며 쉬운 말로 한 단계씩 안내한다"
    - "아이콘 아래 '설정' 버튼을 누르면 설정 창으로 돌아가고, 다시 '도움 시작하기'로 아이콘 모드가 된다"
  differentiation:
    - "기존 원격지원: 다른 사람이 대신 조작 → 어르신은 배우지 못함. 우리는 본인이 직접 누르게 안내"
    - "기존 교육 영상·설명서: 내 화면과 다름. 우리는 지금 내 화면 기준으로 안내"
    - "기존 AI 챗봇: 글로만 설명. 우리는 누를 영역을 직접 표시"
    - "익숙한 동영상 플레이어 버튼(▶/■)으로 '보고 있는지'를 항상 보여 줘 안심시키고, 한 번에 한 영역만 보여 줘 인지 부담을 줄임"

# ════════════════════════════════════════
#  4. 화면 구성과 상태
# ════════════════════════════════════════
screens:
  flow: "사이트 접속 → 가입/로그인(설정 창 형태) → 설정 창 → [도움 시작하기] → 아이콘 모드 → [설정] → 설정 창"
  settings_window: "가입·로그인과 모든 설정을 하는 창. 이 창이 열려 있는 동안 아이콘은 사라지고 화면 보기는 멈춘다. '도움 시작하기' 버튼으로 아이콘 모드로 간다"
  icon_mode: "화면 위에 떠 있는 작은 아이콘. 플레이/정지 버튼(또는 답변 중 아이콘), 글자 입력창, 아래에 '설정' 버튼이 항상 보인다. 마이크를 켜면 마이크 버튼이 추가된다"
  icon_states:
    - state: "정지"
      meaning: "화면을 보지 않음"
      shows: "'▶' 버튼"
    - state: "플레이"
      meaning: "화면을 보고 있음, 질문 대기"
      shows: "'■' 버튼, 화면 가장자리 표시(켜진 경우)"
    - state: "답변 중"
      meaning: "AI가 안내하는 중"
      shows: "'답변 중' 아이콘, 누를 영역 표시"

# ════════════════════════════════════════
#  5. 기능 명세
# ════════════════════════════════════════
features:
  - id: F1
    name: "회원가입·로그인"
    description: "설정 창 형태의 화면에서 이메일·비밀번호로 가입/로그인. 로그인하면 설정 창으로 이어짐"
    status: implemented

  - id: F2
    name: "설정 창과 도움 시작하기"
    description: "모든 설정을 하는 창. 열려 있는 동안 아이콘이 사라지고 화면 보기가 멈춤. '도움 시작하기'를 누르면 아이콘 모드로 전환"
    status: implemented

  - id: F3
    name: "아이콘 모드 (플레이 / 정지 / 답변 중)"
    description: "동영상 플레이어처럼 '▶'(정지 상태)와 '■'(플레이 상태) 버튼이 항상 보이고, AI가 답하는 동안에는 '답변 중' 아이콘이 보임. 아래에 '설정' 버튼이 항상 있어 누르면 설정 창으로 이동"
    status: implemented

  - id: F4
    name: "화면 같이 보기 (PC 화면공유)"
    description: "'▶'를 누르면 브라우저 화면공유로 현재 화면을 AI에게 보여 주고, '■'로 멈춤"
    status: implemented

  - id: F5
    name: "화면 가장자리 표시"
    description: "화면을 보고 있는 동안 화면 테두리 전체에 색 띠를 둘러 '보고 있음'을 알림. 설정에서 켜기/끄기"
    status: implemented

  - id: F6
    name: "글자로 묻기 (기본)"
    description: "아이콘 모드의 입력창에 하고 싶은 일을 글자로 적고 '물어보기'를 누름"
    status: implemented

  - id: F7
    name: "말로 묻기 (선택)"
    description: "설정에서 마이크 입력을 켜면 아이콘 모드에 마이크 버튼이 추가되어 말로 물을 수 있음. 기본은 꺼짐"
    status: implemented

  - id: F8
    name: "클릭 영역 표시"
    description: "AI가 화면을 분석해 눌러야 할 영역에 테두리·화살표·주변 어둡게 중 선택한 모양으로 표시. 색·굵기·깜빡임 설정 가능"
    status: implemented

  - id: F9
    name: "위험 동작 경고"
    description: "결제·송금·삭제 단계에서 '돈이 나가는 버튼이에요. 한 번 더 확인하세요' 경고 표시 (기본 켜짐)"
    status: implemented

  - id: F10
    name: "개인정보 보호 설정"
    description: "공유 화면 이미지는 저장하지 않고 분석 후 폐기. 안내 기록 저장 여부 선택, 기록 전체 삭제"
    status: implemented

  - id: F11
    name: "도움 기록"
    description: "받은 안내를 설정 창에서 다시 볼 수 있음 (화면 이미지는 저장하지 않고 안내 문장만 저장)"
    status: implemented

  - id: F12
    name: "항상 위에 떠 있는 아이콘 창"
    description: "Document Picture-in-Picture로 다른 창 위에 아이콘을 띄움. 지원하지 않는 브라우저는 같은 페이지 안에서 모드만 전환"
    status: partial

  - id: F13
    name: "보호자 연결"
    description: "막혔을 때 자녀에게 현재 단계를 공유"
    status: planned

# ════════════════════════════════════════
#  6. 한계
# ════════════════════════════════════════
limitations:
  - "화면공유는 PC 브라우저에서만 가능 (휴대폰 브라우저는 다른 앱 화면 공유 불가)"
  - "웹 페이지는 다른 앱 화면 위에 직접 그릴 수 없어, 클릭 영역은 공유 화면 미리보기 위에 표시함"
  - "AI가 영역을 잘못 짚을 수 있음 → 결제·송금은 항상 경고 후 본인 확인"
  - "공유 화면에 개인정보가 담길 수 있음 → 화면 이미지는 저장하지 않고 분석 후 폐기"
  - "Picture-in-Picture 창은 Chrome·Edge 등 일부 브라우저에서만 지원"
  - "AI 키가 없거나 응답이 실패하면 '다시 시도' 안내로 대체"
