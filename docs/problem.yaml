title: "옆자리 도우미 — 낯선 PC 웹 작업을 한 단계씩 안내하는 서비스"
one_liner: >
  PC 웹사이트에서 다음에 무엇을 눌러야 할지 막힌 사용자가 브라우저 탭을 직접 공유하면,
  AI가 현재 화면에서 다음 위치와 쉬운 설명을 제시하고 사용자가 직접 선택하도록 돕는다.
target_users:
  primary: "최근 PC 크롬·엣지에서 예약·신청 등 웹 절차를 수행했고, 진행 중 다음 행동을 찾기 어려워 도움을 찾거나 망설인 경험이 있는 사용자. 이는 조사 참여자 모집 기준이며, 대표 타깃 확정은 조사 후 결정한다."
  secondary: "사용자의 도움 요청을 받는 가족·지인 및 디지털 교육 지원자 (MVP 직접 사용자 여부 결정 필요)"
problem:
  situation: >
    사용자가 PC 웹사이트에서 예약·신청 등 익숙하지 않은 절차를 수행하다가,
    현재 페이지의 메뉴나 버튼 중 다음 행동을 정하지 못해 멈추는 순간을 문제 상황으로 본다.
  trigger: "페이지가 바뀌었거나 안내 문구가 낯설어 다음에 누를 위치를 판단해야 하는 순간 (가설, 관찰 필요)"
  pain_points:
    - "화면의 용어·메뉴 구조를 이해하지 못해 다음 행동을 결정하기 어렵다 (가설, 인터뷰 필요)"
    - "전화로 도움을 요청해도 상대가 같은 화면을 보지 못해 설명이 어긋날 수 있다 (가설, 검증 필요)"
    - "잘못 선택할 우려가 생기면 진행을 멈추거나 다른 사람의 도움을 기다릴 수 있다 (가설, 검증 필요)"
  current_alternatives:
    - option: "가족·지인에게 전화로 질문"
      strength: "신뢰하는 사람에게 상황에 맞는 설명을 받을 수 있다"
      limitation: "화면을 함께 보지 않으면 버튼 위치와 현재 단계를 말로 맞춰야 한다"
    - option: "검색·사용법 안내·교육 영상"
      strength: "반복해서 참고할 수 있고 익숙한 자료가 있을 수 있다"
      limitation: "사용자의 현재 화면과 버전·단계가 다를 수 있다"
    - option: "범용 AI에 화면 캡처를 전달"
      strength: "화면 맥락을 포함한 질문이 가능하다"
      limitation: "캡처·질문 작성이 필요하고, 화면 공유와 반복적인 단계 진행은 제품별 확인 필요"
    - option: "화면 공유 통화·원격 지원"
      strength: "상대가 같은 화면을 확인하며 즉시 설명할 수 있다"
      limitation: "상대의 시간과 연결이 필요하며, 서비스 방식에 따라 사용자가 직접 익히는 정도가 다를 수 있다"
  root_cause:
    summary: "사용자가 현재 페이지의 구조·용어를 다음 행동과 연결하기 어렵고, 일반적인 도움 자료는 그 시점의 실제 화면을 반영하지 못할 수 있다는 가설"
    five_whys:
      - why: "왜 작업이 멈추는가?"
        answer: "다음에 선택할 위치와 결과를 확신하기 어렵기 때문이라는 가설"
      - why: "왜 위치와 결과를 확신하기 어려운가?"
        answer: "페이지의 용어·메뉴 구조가 사용자의 목표와 바로 연결되지 않을 수 있기 때문이라는 가설"
      - why: "왜 기존 안내가 충분하지 않을 수 있는가?"
        answer: "일반 설명이나 교육 자료가 현재 화면·진행 단계와 다를 수 있기 때문이라는 가설"
      - why: "왜 주변 사람에게 물어도 어려움이 남을 수 있는가?"
        answer: "서로 같은 화면을 보지 못하면 버튼 위치를 말로 설명하기 어렵기 때문이라는 가설"
      - why: "근본 원인은 무엇인가?"
        answer: "목표·현재 화면·다음 행동 사이의 연결이 부족하다는 해석이며, 사용자 조사로 확인해야 한다"
  impact:
    user: "작업 지연, 중단, 반복 질문 또는 실수에 대한 우려가 생길 수 있음 (영향의 빈도·크기는 조사 필요)"
    others: "도움을 주는 사람에게 즉시 응답 부담이 생길 수 있음 (가설, 조사 필요)"
  team_observations:
    status: "팀 관찰·인터뷰 내용 미제공"
    items: []
    next_step: "아래 research_plan으로 참여자를 모집하고, 실제 또는 안전한 모의 PC 웹 작업을 관찰한 뒤 동의받은 내용만 기록한다."
    evidence_template:
      - participant_id: "익명 ID"
        date: "YYYY-MM-DD"
        task: "관찰한 PC 웹 작업"
        observed_blocker: "실제 화면·행동 중심 기록"
        participant_quote: "정확히 기록한 경우에만 인용; 아니면 비워 둠"
        current_workaround: "사용자가 실제 사용한 대안"
        interpretation: "팀 해석 — 관찰 사실과 분리"
        counter_evidence: "가설에 맞지 않았던 내용"
        limitation: "참여자·상황·표본 한계"
  research_plan:
    status: "계획 — 미실행; 결과를 사실로 인용하지 말 것"
    objective: "대상 사용자가 PC 웹 작업에서 실제로 막히는 순간, 사용하는 대안, 안내를 받아들이는 조건을 관찰해 타깃과 MVP 문제를 좁힌다."
    recruitment: "연령만으로 대상자를 간주하지 않는다. 최근 PC 웹사이트에서 예약·신청 등 절차를 수행한 경험이 있고, 작업 중 도움을 찾거나 망설인 경험이 있는 사람을 우선 모집한다. 실제 모집 기준·인원은 팀 결정 및 기록 필요."
    method: "짧은 반구조화 인터뷰 후 참여자가 본인에게 익숙한 저위험 PC 웹 작업을 수행하는 모습을 관찰한다. 실제 결제·송금·민감정보 입력은 시키지 않는다."
    prompts:
      - "최근 PC 웹사이트에서 다음에 무엇을 눌러야 할지 몰랐던 일을 처음부터 설명해 주세요."
      - "어느 화면에서 멈췄고, 무엇이 헷갈렸나요? 당시 화면이나 기억나는 문구가 있나요?"
      - "그때 어떻게 해결했나요? 해결까지 얼마나 걸렸는지는 기억나는 경우에만 말씀해 주세요."
      - "도움을 받지 못했거나 잘못 선택할까 봐 걱정한 적이 있나요? 있다면 어떤 상황이었나요?"
      - "화면을 공유해 안내받는 방식에서 편할 점과 불편하거나 걱정되는 점은 무엇인가요?"
    observe: "작업 목표, 실제 막힌 화면·문구, 망설임 또는 우회 행동, 사용한 대안, 도움 요청 계기, 참여자가 직접 말한 해결 기준. 관찰 사실과 해석을 분리한다."
    record: "참여자 동의, 익명 식별자, 날짜, 수행 작업, 관찰 사실, 직접 인용(정확한 경우만), 해석, 반례, 후속 질문. 민감 화면 캡처는 기본 수집하지 않는다."
    decision_rule: "반복되는 구체적 막힘이 관찰되면 해당 사용자·작업으로 타깃을 좁힌다. 서로 다른 작업/원인이 섞이면 하나의 문제로 합치지 않고 추가 조사한다. 한두 사례를 빈도·시장 규모로 일반화하지 않는다."
    output: "조사 후 evidence와 team_observations에 요약을 추가하되, 표본·상황·한계를 함께 기록한다. 미실행 상태에서는 가설 표기를 유지한다."
    review_gate: "조사 전에는 문제를 검증 완료로 표시하지 않는다. 결과에는 모집 경로·표본·작업 맥락·반례·한계를 함께 남긴다."
  evidence:
    - type: "외부 통계 — 사회적 배경"
      source: "한국지능정보사회진흥원(NIA), 2025 디지털정보격차 실태조사 보고서, 2026-03-27 게시"
      link: "https://www.nia.or.kr/site/nia_kor/ex/bbs/View.do?bcIdx=29168&cbIdx=81623"
      facts:
        - "2025년 디지털 취약계층의 디지털정보화 수준은 일반 국민을 100으로 볼 때 77.9%로 보고됐다."
        - "보고서 요약에서 고령층의 디지털정보화 역량 수준은 일반 국민 대비 56.2%로 제시됐다."
      supports: "디지털 역량 격차가 사회적 배경으로 존재한다는 설명"
      does_not_support: "이 서비스의 수요, PC 웹사이트에서 막히는 빈도, 타깃 연령대의 대표성 또는 제품 효과를 입증하지 않는다. 원문 표·정의와 정확한 수치는 제출 전 재확인 필요."
    - type: "팀 조사"
      source: "미수행 / 팀 확인 필요"
      supports: "미확인"
      does_not_support: "현재 사용자 문제의 발생률·심각도·해결 의향을 주장할 근거 없음"
statement: >
  낯선 PC 웹사이트에서 절차를 수행하는 사용자는 현재 화면의 용어와 구조를
  다음 행동으로 연결하기 어려워 작업을 멈출 수 있다. 같은 화면을 기준으로
  한 단계씩 안내받고 직접 선택할 수 있는 지원이 필요한지 사용자 조사로 확인한다.
solution:
  how_it_works:
    - "사용자가 도움받을 작업을 입력한다."
    - "사용자가 PC 크롬·엣지에서 대상 브라우저 탭 공유를 직접 시작하고 종료한다."
    - "서비스가 공유된 현재 화면을 분석해 다음에 살펴볼 위치를 표시하고 쉬운 말로 한 단계 안내한다."
    - "사용자가 직접 선택한 뒤 화면이 바뀌면 다시 안내를 요청한다."
    - "목표 완료 여부는 화면에서 확인 가능한 근거가 있을 때만 완료로 안내한다."
  solution_paths:
    - option: "검색·도움말·교육 자료"
      decision: "대안으로 유지. 현재 화면과 절차 단계가 맞지 않을 수 있다."
    - option: "가족·지원자와 화면 공유 통화"
      decision: "대안으로 유지. 실시간 설명이 가능하지만 상대의 참여가 필요하다."
    - option: "범용 AI에 캡처를 질문과 함께 전달"
      decision: "대안으로 유지. 화면 맥락을 제공할 수 있으나 반복 단계 안내의 편의성은 비교 검증 필요."
    - option: "현재 탭 기반 AI 단계 안내"
      decision: "검증할 후보. 화면과 안내를 연결해 사용자가 직접 다음 행동을 수행할 수 있다는 가설. 사용성 확인 전 우월성은 단정하지 않는다."
  why_ours: "현재 화면에서 다음 위치를 표시하고 사용자가 직접 선택한 후 재분석하는 흐름을 제공할 수 있다는 점을 검증하려는 선택이다. 유일성·효과·경쟁 우위는 주장하지 않는다."
screens:
  flow: "목표 입력 → PC 크롬·엣지 대상 탭 공유 → 현재 화면 분석·위치 안내 → 사용자 직접 선택 → 화면 재분석 → 확인 가능한 완료 안내 또는 계속 안내"
  supported_environment: "PC 크롬·엣지 최신 버전 (팀 FE 컨벤션 기준, 저장소 기준 재확인 필요)"
  sharing: "사용자가 브라우저에서 공유를 시작·종료하고 공유할 탭을 직접 선택한다."
  guidance: "AI는 안내 위치와 문장을 제시하며 클릭·결제·신청·제출을 대신하지 않는다."
features:
  - id: F1
    name: "작업 목표 입력"
    priority: Must
    status: implemented
    status_basis: "첨부 원본은 관련 기능을 implemented로 표시했으나, 재정의한 MVP 동작과의 일치 여부는 팀 확인 필요"
    description: "사용자가 하려는 일을 텍스트로 입력하고 안내를 요청한다. 문제 연결: 목표와 현재 화면을 연결한다. 사용자 결과: 요청한 작업이 안내 요청으로 접수되고 입력한 목표가 보인다. 입력: 작업 목표. 출력: 분석 요청 상태. 의존성: 입력 UI·AI API 결정 필요. 성공 화면: 목표 요약과 분석 중 표시. 실패 상태: 입력 오류 또는 재시도 안내."
  - id: F2
    name: "대상 탭 직접 공유·종료"
    priority: Must
    status: implemented
    status_basis: "첨부 원본은 화면 공유를 implemented로 표시했으나, 탭 선택·공유 상태·종료 흐름이 현재 시나리오와 일치하는지 팀 확인 필요"
    description: "사용자가 PC 크롬·엣지에서 탭 공유를 시작하고 종료한다. 문제 연결: 안내가 현재 작업 화면을 기준으로 하게 한다. 입력: 사용자가 선택한 공유 탭. 출력: 공유 상태와 캡처 이미지(최대 1280px 폭, JPEG 품질 약 0.7은 팀 규칙으로 재확인). 의존성: 브라우저 공유 API·지원 범위 확인 필요. 성공 화면: 공유 중 상태. 실패 상태: 권한 거부·공유 취소 안내."
  - id: F3
    name: "현재 화면 분석 및 다음 위치·한 단계 안내"
    priority: Must
    status: implemented
    status_basis: "첨부 원본은 클릭 영역 및 단계별 안내를 implemented로 표시했으나, 좌표 표시가 미리보기 기준인지 팀 확인 필요"
    description: "현재 화면에서 다음 행동 후보를 쉬운 문장과 0~1 비율 좌표 {x,y,w,h}로 제시한다. 문제 연결: 화면 요소와 목표 사이의 연결을 제공한다. 사용자 결과: 표시된 위치와 안내 문장을 보고 직접 선택할 수 있다. 입력: 캡처·목표. 출력: 안내 문장·위치 좌표. 의존성: 모델·공급자·API 결정 필요, API 키는 서버 관리. 성공 화면: 안내와 표시 영역. 실패 상태: 분석 실패·불확실 안내 및 재시도."
  - id: F4
    name: "사용자 선택 후 재분석 및 완료 확인"
    priority: Must
    status: partial
    status_basis: "첨부 원본에는 단계별 안내 기능이 implemented로 기재됐으나, 사용자가 직접 다음 화면을 재분석하고 완료 근거를 판정하는 흐름은 확인되지 않음"
    description: "사용자가 직접 선택한 뒤 새 화면을 다시 분석하고, 화면상 근거가 있을 때만 완료를 안내한다. 문제 연결: 페이지 변화로 끊기는 단계 안내를 이어준다. 입력: 새 화면과 기존 목표. 출력: 다음 단계 또는 완료 확인/확인 불가 안내. 의존성: 캡처 갱신·AI 응답 결정 필요. 성공 화면: 다음 단계 안내 또는 근거가 드러난 완료 문구. 실패 상태: 상태 변화 미확인·재시도 안내."
  - id: F5
    name: "안내 실패 복구"
    priority: Must
    status: partial
    status_basis: "첨부 원본에는 AI 실패 시 재시도 안내가 기재됐으나, 공유 취소·분석 실패별 복구를 모두 제공하는지는 확인되지 않음"
    description: "공유 취소·분석 오류·응답 지연을 구분해 사용자가 다시 시도하거나 공유를 종료할 수 있게 한다. 문제 연결: 중단 상황에서도 다음 선택을 알 수 있게 한다. 입력: 오류·취소 상태. 출력: 상태별 설명과 가능한 버튼. 의존성: 공유·AI 오류 처리 결정 필요. 성공 화면: 구체 오류 문구와 '다시 시도' 또는 '공유 종료'."
  - id: F6
    name: "음성 입력·읽기, 꾸미기, 안내 기록, 보호자 연결"
    priority: Could
    status: planned
    status_basis: "첨부 원본에서는 세부 기능별 구현 상태가 섞여 있으므로, 이 통합 항목은 신규 MVP 분류상 계획 기능으로 둠. 기존 구현은 기능별로 재확인 필요"
    description: "핵심 안내 흐름 검증 후 필요성과 구현 가능성을 확인한다. 개인정보 저장, 위험 경고, 보호자 공유 등은 별도 안전·정책 결정 전 확정 기능처럼 제시하지 않는다."
scope:
  Must: "F1~F5 — 목표 입력, 탭 공유/종료, 현재 화면 분석과 한 단계 안내, 사용자가 직접 선택한 뒤 재분석, 오류 복구. 각 항목은 기술 구현 가능성 및 팀의 해커톤 일정 확인 후 최종 확정."
  Should: "팀에서 별도 채택한 항목 없음. 핵심 흐름과 사용자 확인이 끝난 뒤 음성 지원 필요성을 검토한다."
  Could: "F6의 음성 입력·읽기, 개인화, 안내 기록, 보호자 연결은 조사와 일정 여유가 있을 때 검토한다."
  "Won't": "이번 MVP에서 AI가 대신 클릭·제출·결제·신청하거나, 모바일·네이티브 앱을 지원한다고 약속하지 않는다. 외부 서비스에 계정 연동하거나 민감 화면을 저장하는 기능도 정책 결정 전 범위에 넣지 않는다."
  product_decisions:
    status: "팀 합의 필요"
    recommended_mvp:
      status: "팀 검토용 제안 — 미합의"
      proposal: "로그인·음성·기록 없이 목표 입력, 사용자가 시작하는 탭 공유, 사용자가 요청하는 현재 화면 분석, 미리보기 위 위치 표시, 사용자 직접 선택, 수동 재분석, 공유 종료와 분석 재시도로 한정한다. 실제 기존 구현·일정과 대조 후 수락 또는 수정한다."
      rationale: "핵심 문제 가설을 검증하는 흐름만 남기기 위한 범위 제안이다. 구현 시간과 기술 실현 가능성이 확인된 사실은 아니다."
    recommended_interaction:
      status: "팀 검토용 제안 — 미합의"
      steps:
        - "목표 입력 화면에서 '하고 싶은 일을 적어 주세요' 입력란과 '다음' 버튼을 제공한다."
        - "'화면 공유'를 누르면 브라우저 탭 선택 창이 열리고 사용자가 대상 탭을 고른다."
        - "안내 화면에서 '현재 화면 분석'을 눌렀을 때만 분석 요청을 보낸다."
        - "결과를 안내 문장과 대상 화면 미리보기의 좌표 표시로 보여준다. 실제 공유 탭에서 클릭은 사용자가 직접 한다."
        - "사용자가 안내 화면으로 돌아와 '다음 화면 분석'을 눌러 새 화면 분석을 요청한다. 이번 제안에서는 자동 분석을 제외한다."
        - "'공유 중지'로 언제든 공유를 종료할 수 있게 한다."
      rationale: "사용자 동작과 요청 시점을 명확히 해 자동 조작으로 오해되지 않도록 한다. 브라우저 탭 사이를 사용자가 전환하는 흐름은 시연으로 검증해야 한다."
    recommended_completion_rule:
      status: "팀 검토용 제안 — 미합의"
      rule: "화면에서 목표 사이트의 명시적 완료 문구를 확인할 수 있을 때만 그 문구를 근거로 완료 안내를 표시한다. 문구가 없거나 판독이 불확실하면 완료로 판정하지 않고 사용자가 직접 확인하도록 안내한다."
      test_fixture: "시나리오 검증용 저위험 모의 페이지에 '신청이 완료되었습니다' 문구가 있는 화면과 없는 화면을 준비한다. 외부 사이트 완료를 보장하는 기능으로 표현하지 않는다."
      rationale: "완료 기준을 반복 재현 가능한 화면 신호로 제한한다. 모의 페이지 준비 여부는 팀 확인이 필요하다."
    authentication: "원본 기획에는 로그인·회원가입이 있으나 현재 MVP 필요성은 미결정이다. 권고: 핵심 문제 검증에 필요하다는 근거가 없으면 MVP 흐름에서 제외하되, 기존 구현과 제출 조건을 대조한 뒤 팀이 결정한다."
    status_reconciliation: "status 허용값은 implemented | partial | planned로 맞췄다. 현재 값은 첨부 원본의 상태 주장과 새 기능 정의를 대조한 잠정 매핑이며, 팀은 실제 동작을 확인한 뒤 수정해야 한다. 문서 작성만으로 실제 구현 상태를 검증한 것은 아니다."
    questions:
      - "권고한 미리보기 좌표 표시와 수동 재분석을 수락할지, 별도 창이나 자동 제안을 선택할지?"
      - "모의 페이지 완료 문구 판독을 MVP에 구현할 수 있는지, 어렵다면 완료 확인을 MVP에서 제외할지?"
      - "캡처 전송 대상·전송 구간·저장 여부·보존 기간·삭제 책임은 무엇인지?"
      - "모델/API 공급자, 키 관리, 비용·지연 제한 및 분석 실패 시 동작은 무엇인지?"
      - "로그인·회원가입은 MVP 진입에 필요한가? 필요하다면 핵심 문제 검증에 왜 필요한가?"
    completion_gate: "위 결정은 팀 합의 및 시연 가능한 화면 확인 후에만 확정 표기로 바꾼다. 미결정 상태에서는 해당 기능을 약속하거나 구현 완료라고 쓰지 않는다."
limitations:
  - "지원 범위는 팀 컨벤션 확인 전까지 PC 크롬·엣지 최신 버전으로 한정한다."
  - "웹 페이지 위에 직접 표시할 수 없는 환경에서는 안내 좌표를 화면 미리보기와 연결하는 방식 및 정확도를 검증해야 한다."
  - "AI의 위치·문장 판단은 틀릴 수 있다. 금전·삭제·제출 등 결과가 큰 행동은 사용자가 화면 내용을 직접 확인하고 수행해야 한다. 위험 행동 감지는 보장되지 않는다."
  - "화면에 개인정보가 포함될 수 있다. 전송·저장·보존·삭제 방식은 팀과 기술 설계 확인 전 미확정이며, '분석 후 폐기'라고 단정하지 않는다."
  - "모델·공급자·API, 지연시간, 비용 및 실패 한계는 결정 필요."
