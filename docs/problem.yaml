    claim: |-
      2020 노인실태조사(65세 이상 10,097명)에서 64.2%가 키오스크 주문에 어려움을 느꼈다. 한국소비자원 조사에서 고령 소비자의 51.4%가 복잡한 작동 방법, 49%가 뒷사람 눈치, 44.1%가 작은 그림·글씨를 어려움으로 꼽았다.
      키오스크 조사라 웹 예약 화면에 그대로 옮길 수는 없고, 주문 포기 비율은 나오지 않는다.
