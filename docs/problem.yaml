  output: 누를 곳 표시와 함께 '되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고 (서버 설정 riskWarning 기본 켜짐. 설정 창에 끄는 스위치는 아직 없음)
  done: '''되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요'' 경고가 보인다 (S4)'
