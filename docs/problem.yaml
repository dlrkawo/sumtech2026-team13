    claim: |-
      2025 디지털정보격차 실태조사(15,000명, 2025년 10~12월): 취약계층 접근 96.6%, 역량 65.9%, 고령층 역량 56.2%(최저).
      AI 서비스 경험률 일반 국민 59.4%, 취약계층 31.9%, 고령층 30.2%. 전국 통계라 병원 예약에서 막히는 지점을 직접 보여 주지는 않는다.
