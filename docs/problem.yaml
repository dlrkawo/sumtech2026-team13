# 13팀(배포했당께) 문제정의. 종이 캔버스(10.29 작성)와 학생이 채팅으로 보낸 정리본을 합쳐 옮김.
# 종이와 정리본이 다른 곳은 아래 주석에 출처를 남김. 학생이 말하지 않은 내용은 null 또는 []로 둠.

statement: null # 종이의 한 문장 칸이 비어 있음. 학생 답 대기

canvas:
  # ① 상황. 종이: "부모님"을 지우고 "디지털소외계층분들"로 씀. 예시(병원 예약 등)와 "카카오톡으로 화면을 보내"는 정리본·종이 공통
  context: |-
    디지털 소외계층(부모님)이 병원 예약, 모바일 결제, 공공서비스 신청 등 익숙하지 않은 웹사이트를 이용할 때 발생한다.
    원하는 기능을 찾지 못하거나 낯선 화면이 나타나면 사용을 중단하고 자녀에게 카카오톡으로 화면을 보내 도움을 요청한다.
    이러한 어려움은 새로운 서비스를 이용하거나 웹사이트 화면이 변경될 때마다 반복된다.
  # ② 고객. 종이와 정리본 동일
  customer: |-
    익숙하지 않은 웹사이트 → 50, 70대, 반복적 사용법(귀찮음) 알려줘야 → 자식
    부모님은 새로운 기능을 사용할 때마다 자녀에게 도움을 요청하고, 자녀는 같은 설명을 반복하는 데 번거로움과 피로감을 느낀다.
    결국 부모님은 계속 물어보는 것이 부담스럽고, 자녀는 매번 알려주는 것이 귀찮아지는 상황이 발생한다.
  # ③ 근본 문제. 종이 앞면 문장 + 정리본의 5 Whys 결론
  root_problem: |-
    디지털화로 일상생활의 많은 서비스가 온라인으로 전환되었지만, 웹사이트마다 사용법이 다르고 화면도 자주 변경된다.
    기존 검색이나 사용법 안내는 실제 화면과 맞지 않을 수 있어 부모님은 자녀에게 반복적으로 도움을 요청하게 된다.
    결국 현재 화면에 맞춰 문제 해결까지 도와주는 지원이 부족하다.
    "지금 이 화면에서 어디를 눌러야 하는지" 직접 짚어주는 도움이 자녀 한 사람의 시간에만 묶여 있어서, 부모님은 그 자리에서 스스로 해결할 수단이 없다.
  impact:
    feeling: |-
      부모님은 "또 물어봐야 하나?"라는 미안함과 답답함을 느낀다.
      자녀는 "저번에도 알려줬는데 또?"라는 반복적인 설명에 번거로움과 피로감을 느낀다.
    measurable: |-
      부모님은 원하는 서비스를 이용하지 못하거나 포기하게 되고, 자녀는 반복적인 설명으로 시간을 빼앗긴다.
      결국 부모님의 디지털 자립 기회가 줄어든다.
  # ⑤·⑥ 종이에는 A1 자녀에게 묻기, A2 검색, A3 AI·원격제어 / 정리본에는 A1 카카오톡, A2 AI 챗봇, A3 원격제어.
  # 두 기록을 합쳐 네 가지로 나눔. why_ours는 2-B에서 학생 답으로 채움
  alternatives:
    - how_used: 자녀에게 카카오톡 화면공유 통화를 하거나, 화면을 캡처해 문제점과 함께 보내거나, 전화로 물어본다
      shortcoming: |-
        도움 제공자(자녀)가 그 시간에 여유가 있어야 가능하다. 자녀가 바쁘면 즉시 해결하기 어렵다.
        반복적인 설명으로 서로 부담을 느낀다.
      why_ours: 매번 자녀에게 질문하지 않아도, AI가 현재 화면을 분석하고 단계별로 안내해 스스로 문제를 해결할 수 있다.
    - how_used: 네이버·유튜브에서 사용법을 검색한다
      shortcoming: |-
        검색 결과와 실제 화면이 다를 수 있다.
        여러 단계의 설명을 직접 따라 해야 한다.
      why_ours: 사용법을 검색하지 않아도, AI가 현재 화면을 분석하고 단계별로 안내해 스스로 문제를 해결할 수 있다.
    - how_used: ChatGPT·Gemini 등 범용 AI 챗봇에 질문한다
      shortcoming: |-
        AI로 화면을 분석할 수 있지만, 사용자가 질문과 진행 사항을 계속 전달해야 한다.
        캡처 → 업로드 → 프롬프트 입력의 단계가 복잡하고, 답변이 텍스트라 위치를 직접 찾아야 한다.
      why_ours: 캡처·업로드·질문 입력을 매번 하지 않아도, 화면을 보내면 바로 분석해 화면 위에 위치까지 표시해 준다.
    - how_used: 원격제어로 연결해 도움을 받는다
      shortcoming: |-
        다른 사람의 도움이 필요하다.
        설치·권한·접속 코드 전달이 어렵고, 원격 접속에 대한 불안함이 있다.
      why_ours: 다른 사람의 원격 접속 없이도, AI가 화면을 분석해 다음 행동을 짚어준다.

personas: []
experiences: [] # 팀원이 실제로 겪은 장면(언제·무슨 일·어떻게 대처)은 아직 없음. 학생 답 대기
# WebFetch·WebSearch로 직접 확인(2026-10-29). 과기정통부·NIA '2025 디지털정보격차 실태조사' 인용 기사.
# 고령층의 '역량'(사용 숙련도) 수치만 씀 — '접근'(기기 보유)은 이 문제와 직접 관련 없어 제외.
sources:
  - id: SRC1
    url: "https://www.mt.co.kr/tech/2026/03/27/2026032710093798860"
    title: "\"아들아, 챗GPT가 뭐니?\"…취약계층 AI 경험률, 일반인 절반 그쳐 (2025 디지털정보격차 실태조사, 과기정통부·NIA)"
    claim: |-
      2025년 디지털 취약계층의 디지털정보화 역량 수준은 일반 국민 대비 65.9%이며, 그 중 고령층의 역량 수준이 56.2%로 가장 낮았다.
      디지털 역량 격차가 사회적으로 존재한다는 배경 설명일 뿐, 이 서비스의 수요나 PC 웹 작업에서 막히는 빈도 자체를 증명하지는 않는다.

five_whys:
  symptom: 부모님이 업무나 브라우저 사용 중 막히면 해결까지 몇 시간씩 걸리고, 비슷한 도움 요청이 계속 반복된다.
  whys:
    - 왜 해결이 오래 걸리는가? 부모님이 화면을 캡처해 자녀에게 보내고, 자녀가 확인하고 답할 때까지 기다려야 하기 때문이다.
    - 왜 자녀를 기다려야 하는가? 부모님이 혼자서는 해결 방법을 찾지 못해 자녀 외에 기댈 곳이 없기 때문이다.
    - 왜 혼자 해결하지 못하는가? 검색 결과나 설명을 보더라도, 그 내용을 지금 자기 화면의 어느 위치에 적용해야 하는지 연결하지 못하기 때문이다.
    - 왜 설명을 화면과 연결하지 못하는가? 기존의 도움(검색, 안내문, AI 챗봇, 자녀의 카톡 답변)은 모두 화면 밖에서 말이나 글로 위치를 설명하는데, 화면 구조와 용어("우측 상단", "톱니바퀴", "더보기")에 익숙하지 않으면 그 설명을 해석하는 것 자체가 어렵기 때문이다.
    - 왜 화면 밖에서 설명하는 도움밖에 없는가? 부모님의 화면을 직접 보고 그 위에서 "여기"라고 짚어줄 수 있는 존재가 지금까지는 자녀(사람)뿐이었고, 그 도움은 자녀의 시간이 있을 때만 가능했기 때문이다.

# 학생이 채팅으로 보낸 「해법 경로」(10.29) 기준. 제외 경로는 insight.design_decision의 학생 문장에서 옮김
solution_paths:
  - path: AI가 현재 화면을 분석하고 단계별로 안내해, 부모님이 자녀에게 묻지 않고 스스로 문제를 해결하도록 돕는다
    status: chosen
    reason: |-
      대안들에는 현재 화면과 진행 상황에 맞춰 다음 행동을 안내하고, 문제 해결까지 확인해 주는 기능이 부족하다.
      이 빈자리가 채워지면 부모님은 혼자 문제를 해결할 수 있고, 자녀는 반복적으로 설명해야 하는 부담을 줄일 수 있다.
      자녀에게 반복적으로 의존하던 디지털 사용 문제를 AI의 단계별 안내와 확인 과정으로 줄이는 것이 서비스의 가치다.
  - path: 사람이 직접 안내한다
    status: rejected
    reason: 사람이 직접 안내하는 경우는 시공간·비용의 한계가 있다.

insight:
  claim: |-
    디지털에 익숙하지 않은 가족을 관찰하였다. 디지털 소외 계층에 관한 뉴스 기사 등을 읽으며 통계와 전체적인 사회 흐름도 관찰했다.
  evidence: |-
    가장 가까우며 문제에 대한 반응을 알기 쉬운 대상이 가족이다. 또한 주변인만을 데이터로 사용한다면 편향된 분석일 수 있으니 뉴스 기사, 통계 등을 찾아보며 전체적인 흐름을 인식하였다.
  design_decision: |-
    사용자의 화면을 공유하며 AI가 실시간으로 화면을 조회하고, 사용자 요구를 자연어로 인식하여 사용 방법을 안내한다.
    사람이 직접 안내하는 경우는 시공간·비용의 한계가 있어 만들지 않고, AI를 이용하여 안내하는 것을 만들기로 하였다.

# 팀장 기획(PR #8의 F1~F13)과 현재 docs/scenarios.yaml S1~S8 기준으로 정리 (10.29).
# id·이름·설명은 기획 그대로, done은 시나리오 expected와 구현된 동작에서 옮김. 팀장 확인 필요한 칸은 주석으로 표시.
# F13 보호자 연결은 기획에서 "계획(planned)" 상태라 이번 MVP 범위에서 뺌 (팀장 확인 필요)
features:
  - id: F1
    name: 회원가입·로그인
    input: 이메일과 비밀번호 (비밀번호 8자 이상)
    output: 계정이 만들어지거나 로그인되고, 설정 창으로 이어진다
    done: |-
      이메일·비밀번호로 가입하면 설정 창과 '도움 시작하기' 버튼이 보인다 (S1).
      가입한 계정으로 로그인하면 같은 설정 창이 열린다. 같은 이메일로 다시 가입하거나 비밀번호가 틀리면 이유가 화면에 보인다.
  - id: F2
    name: 설정 창과 도움 시작하기
    input: 설정 창에서 '도움 시작하기' 누르기
    output: 설정 창이 닫히고 아이콘 모드로 바뀐다
    done: "'도움 시작하기'를 누르면 설정 창이 사라지고 아이콘 모드에서 '▶' 버튼과 '설정' 버튼이 보인다 (S2)"
  - id: F3
    name: 아이콘 모드 (플레이 / 정지 / 답변 중)
    input: "'▶', '■', '설정' 버튼 누르기"
    output: 화면 보기 시작·멈춤 상태와 '답변 중' 표시, 설정 창 이동
    done: "'▶'를 누른 뒤 '■'를 누르면 '멈춤' 상태가 표시되고 다시 '▶' 버튼이 보인다 (S3). '설정'을 누르면 설정 창이 열린다"
  - id: F4
    name: 화면 같이 보기 (PC 화면 공유)
    input: "'▶'를 누르고 브라우저 화면 공유 창에서 공유할 화면 고르기"
    output: 공유한 화면을 AI가 분석할 수 있는 상태가 된다
    done: null # 화면 공유 선택 창은 자동 테스트로 조작할 수 없어 E2E 흐름에서는 확인 불가. 관찰 가능한 완료 조건 팀장 확인 필요
  - id: F5
    name: 화면 가장자리 표시
    input: 설정 창의 '화면 가장자리 표시' 켜기·끄기
    output: 화면을 보는 동안 화면 테두리에 색 띠가 보이거나 사라진다
    done: "'화면 가장자리 표시'를 끄고 '도움 시작하기'를 누른 뒤 다시 설정 창을 열면 꺼진 상태 그대로다 (S5)"
  - id: F6
    name: 글자로 묻기
    input: 입력창에 하고 싶은 일을 적고 '물어보기' 누르기
    output: 지금 화면에서 다음에 할 한 단계 안내 문장
    done: "'물어보기'를 누르면 '답변 중' 아이콘이 보이고 안내 문장과 누를 곳 표시가 나타난다 (S4). 입력이 비어 있으면 보내지지 않고 이유가 보인다"
  - id: F7
    name: 말로 묻기
    input: 설정에서 '음성 인식'을 켠 뒤 '마이크' 버튼을 누르고 말하기
    output: 말한 내용이 입력창에 글자로 적히고 질문이 보내진다
    done: "'음성 인식'을 켜면 아이콘 모드에 '마이크' 버튼이 보이고, 말한 내용이 입력창에 적힌 뒤 '답변 중' 아이콘이 보인다 (S8, 기본은 꺼짐)"
  - id: F8
    name: 클릭 영역 표시
    input: 질문과 현재 화면
    output: 눌러야 할 곳이 테두리·화살표·주변 어둡게 중 설정한 모양으로 표시된다
    done: 안내 문장과 함께 화면 위에 누를 곳 표시가 나타난다 (S4). 누를 곳을 찾지 못하면 표시 없이 문장으로만 안내한다
  - id: F9
    name: 위험 동작 경고
    input: 결제·송금·삭제 단계의 화면과 질문
    output: "'돈이 나가는 버튼이에요. 한 번 더 확인하세요' 같은 경고 (설정에서 끌 수 있음, 기본 켜짐)"
    done: "송금하려는 질문에 '돈이 나가는 버튼이에요. 한 번 더 확인하세요' 경고가 보인다 (S6). 설정에서 위험 경고를 끄면 경고가 보이지 않는다"
  - id: F10
    name: 개인정보 보호 설정
    input: 설정 창의 기록 저장 켜기·끄기, 기록 전체 삭제
    output: 화면 이미지는 저장하지 않고, 기록 저장을 끄면 안내도 남지 않는다
    done: 기록 저장을 끈 뒤 물어보면 도움 기록 목록에 새 항목이 생기지 않는다. 기록 전체 삭제 후 도움 기록 목록이 비어 있다
  - id: F11
    name: 도움 기록
    input: 설정 창의 '도움 기록' 누르기
