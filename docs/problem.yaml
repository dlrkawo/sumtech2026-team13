title: "옆자리 도우미 — 낯선 PC 웹 작업을 한 단계씩 안내하는 서비스"
one_liner: >
  PC 웹사이트에서 다음에 무엇을 눌러야 할지 막힌 사용자가 현재 화면을 보여주면,
  AI가 화면을 분석해 다음 위치와 쉬운 설명을 제시하고 사용자가 직접 선택해 진행한다.

target_users:
  primary: "최근 PC 크롬·엣지에서 예약·신청 등 웹 절차를 수행하다가 다음 행동을 찾기 어려워 도움을 찾거나 망설인 경험이 있는 사람"
  secondary: "그 사람의 도움 요청을 받아온 가족·지인 (서비스를 직접 쓰지는 않지만, 반복 설명 부담이 줄어드는 대상)"

# 아래 problem 섹션은 팀원 관찰(가족)과 뉴스·통계로 세운 가설이다. 실제 사용자 조사는 research_plan대로 아직 진행 전이다.
problem:
  situation: >
    디지털 소외계층(부모님 세대)이 병원 예약, 모바일 결제, 공공서비스 신청 등 낯선 앱·웹사이트를 쓰다가
    다음 화면이나 메뉴가 바뀌어 다음 행동을 못 찾으면 사용을 멈추고, 자녀에게 카카오톡으로 화면을 캡처해
    보내거나 전화로 물어본다. 새 서비스를 쓰거나 화면이 바뀔 때마다 이 과정이 반복된다.
  pain_points:
    - "화면의 용어·메뉴 구조(우측 상단, 톱니바퀴, 더보기 등)에 익숙하지 않아 다음 행동을 스스로 정하기 어렵다"
    - "검색이나 사용법 안내는 실제 지금 화면과 다를 수 있어 그대로 따라 하기 어렵다"
    - "전화로 물어도 같은 화면을 보지 못하면 위치를 말로 설명하기 어렵고, 자녀가 바쁘면 기다려야 한다"
  current_alternatives:
    - option: "자녀에게 화면을 캡처해 카카오톡·전화로 질문"
      limitation: "자녀의 시간이 있어야 하고, 같은 설명을 반복하는 데 서로 부담을 느낀다"
    - option: "네이버·유튜브에서 사용법 검색"
      limitation: "검색 결과와 실제 화면이 다를 수 있고, 여러 단계를 직접 연결해 따라 해야 한다"
    - option: "ChatGPT·Gemini 등 범용 AI 챗봇에 질문"
      limitation: "캡처 → 업로드 → 질문 작성 단계가 복잡하고, 답이 텍스트라 위치를 직접 찾아야 한다"
    - option: "원격제어 연결"
      limitation: "다른 사람의 도움이 필요하고, 설치·권한·접속 코드 전달이 번거롭고 불안하다"
  root_cause: >
    기존 도움(검색, 안내문, AI 챗봇, 자녀의 답변)은 모두 화면 밖에서 말이나 글로 위치를 설명한다.
    화면을 직접 보고 "여기"라고 짚어줄 수 있는 존재가 지금까지 자녀뿐이었고, 그 도움은 자녀의 시간이
    있을 때만 가능했다. 그 결과 디지털 소외계층은 현재 화면과 진행 상황에 맞춘 도움을 혼자서는 받을 수 없다.
  impact:
    primary_user: "원하는 서비스를 이용하지 못하거나 포기하게 되고, \"또 물어봐야 하나\"라는 미안함·답답함을 느낀다"
    secondary_user: "같은 설명을 반복하는 데 시간과 피로감을 쓴다"
  evidence:
    - source: "한국지능정보사회진흥원(NIA), 2025 디지털정보격차 실태조사 보고서"
      link: "https://www.nia.or.kr/site/nia_kor/ex/bbs/View.do?bcIdx=29168&cbIdx=81623"
      fact: "2025년 디지털 취약계층의 디지털정보화 수준은 일반 국민 대비 77.9%, 고령층은 56.2%로 보고됐다."
      supports: "디지털 역량 격차가 사회적으로 존재한다는 배경 설명"
      does_not_support: "이 서비스에 대한 수요나 PC 웹 작업에서 막히는 빈도 자체를 입증하지는 않는다"

research_plan:
  status: "계획 — 아직 실행 전. 위 problem 섹션은 가설이며, 아래 조사로 검증한다"
  objective: "대상 사용자가 PC 웹 작업에서 실제로 막히는 순간과 그때 쓰는 대안을 관찰해 문제와 MVP 범위를 좁힌다"
  recruitment: "최근 PC 웹사이트에서 예약·신청 등 절차를 수행하다 도움을 찾거나 망설인 경험이 있는 사람을 모집한다. 나이만으로 대상자를 정하지 않는다. 모집 인원·경로는 팀 확정 필요"
  method: "짧은 인터뷰 후 참여자가 익숙한 저위험 PC 웹 작업을 직접 해보는 모습을 관찰한다. 실제 결제·송금·민감정보 입력은 시키지 않는다"
  prompts:
    - "최근 PC 웹사이트에서 다음에 뭘 눌러야 할지 몰랐던 일을 설명해 주세요"
    - "어느 화면에서 멈췄고, 무엇이 헷갈렸나요?"
    - "그때 어떻게 해결했나요?"
    - "화면을 공유해 안내받는 방식에서 편할 점과 걱정되는 점은 무엇인가요?"

statement: >
  낯선 PC 웹사이트에서 절차를 수행하는 사용자는 현재 화면의 용어와 구조를 다음 행동으로
  연결하기 어려워 작업을 멈춘다. 같은 화면을 기준으로 한 단계씩 안내받고 직접 선택할 수 있는
  지원이 필요한지를 사용자 조사로 확인한다.

solution:
  how_it_works:
    - "사용자가 도움받을 작업을 입력한다"
    - "사용자가 현재 화면을 서비스에 전달한다 — 실제 사용은 브라우저 탭 공유(getDisplayMedia), E2E 검증은 화면 사진 올리기로 하되, 둘 다 캔버스로 다시 그려 같은 base64 JSON 형식(docs/API_CONVENTION.md)으로 서버에 보낸다"
    - "서버가 화면을 분석해 다음에 누를 위치(0~1 비율 좌표 {x,y,width,height})와 쉬운 말 한 단계 안내를 돌려준다"
    - "사용자가 화면 미리보기에 표시된 위치를 보고 실제 화면에서 직접 선택한다 — AI가 대신 클릭·제출·결제하지 않는다"
    - "사용자가 다음 화면을 다시 보내면 재분석하고, 화면에 완료 문구가 보일 때만 완료로 안내한다. 문구가 없으면 완료를 단정하지 않는다"
  why_ours: >
    검색·챗봇·원격제어 대안은 모두 사용자가 상황을 말이나 캡처로 옮겨 설명해야 한다.
    이 서비스는 지금 보고 있는 화면을 그대로 분석해 위치를 짚어주고, 사용자가 선택한 뒤
    바로 다음 화면을 다시 봐주는 것이 다르다는 가설이며, 사용성은 검증이 필요하다.
  rejected_paths:
    - path: "사람이 실시간으로 직접 안내한다"
      reason: "시공간·비용의 한계로 상시 제공이 어렵다"

screens:
  platform: "desktop (PC 크롬·엣지 최신, docs/scenarios.yaml 기준)"
  flow: "목표 입력 → 화면 전달(공유 또는 사진) → 분석·위치 안내 → 사용자 직접 선택 → 재분석 → 완료 안내 또는 다음 단계"
  guidance: "AI는 안내 위치와 문장만 제시하고, 클릭·제출·결제·신청은 사용자가 직접 한다"

# 상태는 저장소 API_CONVENTION.md 10번 표와 같은 기준(명세/구현/배포)을 쓴다. 지금은 Next.js 뼈대와 /__health만 있고
# 아래 기능은 모두 아직 명세 단계다 (app/(pages)/page.tsx는 정적 첫 화면만 구현됨).
features:
  - id: F1
    name: "작업 목표 입력"
    priority: Must
    status: 명세
    description: "사용자가 하려는 일을 텍스트로 입력하면 분석 요청으로 접수된다. 입력: 작업 목표 텍스트. 출력: 목표 요약과 분석 대기 상태. 성공: 목표 요약이 보임. 실패: 입력 오류 안내."
  - id: F2
    name: "현재 화면 전달"
    priority: Must
    status: 명세
    description: "사용자가 브라우저 탭 공유를 시작·종료하거나(실사용), 화면 사진을 올려(E2E) 현재 화면을 서버에 보낸다. 입력: 공유 탭 또는 이미지 파일. 출력: base64 이미지 전송, 공유 중 상태 표시. 실패: 권한 거부·공유 취소 안내."
  - id: F3
    name: "화면 분석 및 다음 위치·안내"
    priority: Must
    status: 명세
    description: "현재 화면 이미지와 목표를 AI에 보내 다음 행동 위치(0~1 비율 좌표)와 쉬운 안내 문장을 받아 화면 미리보기에 표시한다. 입력: 이미지, 목표. 출력: 안내 문장, 좌표. 실패: 분석 실패 시 오류 안내와 다시 시도."
  - id: F4
    name: "사용자 선택 후 재분석·완료 확인"
    priority: Must
    status: 명세
    description: "사용자가 다음 화면을 다시 전달하면 재분석하고, 화면에서 완료 문구를 확인할 수 있을 때만 완료로 안내한다. 문구가 없으면 \"완료 여부를 확인할 수 없어요\"로 안내한다. 입력: 새 화면. 출력: 다음 단계 안내 또는 완료/확인불가 안내."
  - id: F5
    name: "오류·실패 복구"
    priority: Must
    status: 명세
    description: "공유 취소, 분석 실패, 응답 지연을 구분해 사용자가 다시 시도하거나 공유를 종료할 수 있게 한다."
  - id: F6
    name: "음성 입력·읽어주기, 안내 기록, 보호자 연결"
    priority: Could
    status: 명세
    description: "핵심 흐름 검증 후 필요성과 구현 가능성을 확인한다. 개인정보 저장·보호자 공유는 별도 정책 결정 전까지 확정 기능으로 다루지 않는다."

scope:
  Must: "F1~F5 — 목표 입력, 화면 전달, 분석·안내, 사용자 선택 후 재분석, 오류 복구"
  Should: "핵심 흐름 검증 후 필요성 재검토"
  Could: "F6 — 음성 입력·읽어주기, 안내 기록, 보호자 연결"
  "Won't": "AI가 사용자 대신 클릭·제출·결제·신청하는 것, 모바일 네이티브 앱, 외부 서비스 계정 연동·민감 화면 저장"

open_questions:
  - "로그인·회원가입을 MVP에 포함할지 (docs/scenarios.yaml은 로그인 없는 흐름을 가정 중)"
  - "AI 모델·공급자 선택과 분석 실패·지연 시 재시도 한도"
  - "화면 이미지의 서버 보관 여부·보존 기간 (현재 방향: 분석 후 저장하지 않음, 팀 확정 필요)"

limitations:
  - "지원 환경은 PC 크롬·엣지 최신 버전으로 한정한다 (docs/scenarios.yaml platform)"
  - "AI의 위치·문장 판단은 틀릴 수 있다. 금전·삭제·제출 등 결과가 큰 행동은 사용자가 화면을 직접 확인하고 수행해야 하며, 위험 행동 감지는 보장하지 않는다"
  - "화면에 개인정보가 포함될 수 있어 전송·보관 방식을 팀이 확정해야 한다"
