five_whys:
  symptom: PC로 병원 예약을 하다 한 화면에서 멈추고, 화면을 찍어 자녀에게 보낸 뒤 답을 기다린다([관찰]).
  whys:
    - 왜 자녀를 기다리는가? 그 화면에서 다음에 누를 곳을 스스로 정하지 못하기 때문이다. ([관찰])
    - 왜 누를 곳을 정하지 못하는가? 가설이 여럿이다. 설명을 위치로 옮기지 못하거나(H1), 버튼 이름의 뜻을 모르거나(H2), 잘못 누를까 두려워서(H3)일 수 있다.
    - 왜 혼자 해결할 다른 수단이 없는가? 관찰한 검색·영상·AI 챗봇의 글 중심 이용에서는 설명을 실제 화면으로 옮겨야 했고, 화면을 함께 보고 짚어 줄 사람은 자녀 혹은 디지털화 세대의 사람인데 작업할 때 곁에 없는 경우가 많다(H4, 고령자 가구의 37.8%가 1인 가구 SRC6).
    - 왜 설명을 화면과 연결하지 못하는가? 관찰한 도움 중 검색·안내문·AI 챗봇의 글 답변·자녀의 카톡 설명은 화면 밖에서 말이나 글로 위치를 설명하는 경우가 있어, 화면 구조와 용어("우측 상단", "톱니바퀴", "더보기")에 익숙하지 않으면 그 설명을 해석하는 것 자체가 어렵기 때문이다(H1·H2, [가설]).
    - 왜 화면 밖에서 설명하는 도움밖에 없는가? 팀원 가족 관찰과 인터뷰 취합에서는 부모님의 화면을 직접 보고 그 위에서 "여기"라고 짚어 준 쪽이 주로 자녀 같은 가까운 사람이었고, 그 도움은 그 사람의 시간이 있을 때만 가능했다. 현장 도우미처럼 화면을 함께 보는 도움도 있지만 대신 눌러 주는 데 그치는 경우가 많다(SRC2). 다른 방법이 전혀 없다는 뜻은 아니며, 혼자 있을 때 바로 쓸 수 있는 방법이 드물다는 가설이다(H4, [가설]).

solution_paths:
  - path: 지금 화면(공유 화면 또는 화면 사진)을 AI가 보고, 다음에 누를 곳 하나를 화면 위에 표시하며 쉬운 말 한 문장으로 안내해, 본인이 직접 눌러 끝까지 마치게 한다
    status: chosen
    reason: |-
      위치를 사진 위에 직접 표시하므로 H1(말을 위치로 옮기기)을 건너뛰고, 타인의 도움을 기다리지 않아도 되므로 H4를 줄인다.
      안내 문장은 쉬운 말로 쓰고 버튼 글자를 그대로 인용해 H2를 일부 줄이고, 결제·송금·삭제·제출처럼 되돌리기 어려운 단계에는 경고를 띄워 H3을 일부 줄인다.
      질문은 하고 싶은 일만 짧게 적으면 되도록 해, 질문 문장을 쓰기 어려운 사용자도 쓸 수 있게 했다(SRC1).
      대신 눌러 주지 않으므로 본인이 직접 해 보며 다음에 도움 없이도 서비스를 사용할 여지가 생긴다(SRC2의 '대신 눌러 주는 도움'과 다른 점).
      팀 기록에 따르면 60대 2명에게 MVP를 시험해 덜 헷갈린다는 정성 응답을 얻었다(2026.10.30). 소규모 주관적 응답이며, 실제 멈춤·소요 시간 감소와 도움 없이 마친 비율 개선은 아직 검증하지 않았다.
  - path: 사람(자녀·상담원)이 직접 안내한다
    status: rejected
    reason: 지금의 방식 그대로라 도와줄 사람의 시간이 있을 때만 가능하고(H4), 상담원을 두면 비용이 든다.
  - path: 원격제어로 대신 예약해 준다
    status: rejected
    reason: 도와줄 사람이 여전히 필요하고, 남이 내 컴퓨터를 움직이는 불안이 있으며, 대신 해 주면 본인이 직접 해 보지 못한다.
  - path: 병원별 예약 방법 영상·설명서를 만들어 둔다
    status: rejected
    reason: 병원이 많고 화면이 자주 바뀌어 설명서가 금방 실제 화면과 달라진다(검색·영상 대안과 같은 한계).
  - path: 인터넷뱅킹·송금처럼 돈이 오가는 일, 휴대폰 앱 화면 안내
    status: deferred
    reason: |-
      송금은 주로 휴대폰 앱에서 하고, AI가 위치를 잘못 짚었을 때 피해가 커서 첫 범위로 맞지 않다.
      휴대폰 브라우저는 다른 앱 화면을 공유할 수 없어 전용 앱이 필요하다. 이번에는 PC 웹의 신청형 업무로 범위를 좁힌다.
  - path: 말로 묻기(구현된 선택 기능)를 핵심 자동 검증 흐름에 편입하는 것, 다른 창 위에 기본으로 항상 떠 있는 아이콘 창, 큰 흐름 '할 일 목록'
    status: deferred
    reason: |-
      말로 묻기는 설정의 '음성 인식'과 '마이크' 버튼으로 구현된 선택 기능이다. 구현 자체가 아니라 핵심 자동 검증 흐름으로의 편입을 보류했다. 현재 S1~S7은 글 입력 중심이며 실제 마이크·브라우저 음성 서비스·권한을 포함한 음성 경로는 별도 수동 확인 대상이다. 앱 상태 모의 검사는 가능하지만 실제 음성 인식의 검증과 같지 않다.
      다른 창 위에 떠 있는 창은 기본으로 항상 띄우지 않는다. 지원 브라우저(PC 크롬·엣지 계열)에서 사용자가 고를 때만 여는 '작은 창으로 띄우기'(F8)로만 넣었고, 지원하지 않는 브라우저에서는 원래 페이지를 그대로 쓴다.
      할 일 목록은 만들지 않았다. 핵심 흐름(글자로 묻고 한 단계씩 안내)을 먼저 완성한다.
  - path: 막혔을 때 보호자(자녀)에게 지금 단계를 공유한다
    status: deferred
    reason: AI 안내로 해결되지 않는 경우의 보조 수단이다. 이번 범위는 '자녀 없이 혼자 끝까지'에 집중한다.

insight:
  claim: |-
    [가설] 60~70대가 병원 예약에서 멈추는 큰 이유는 "무엇을 해야 하는지"를 몰라서가 아니라, 들은 설명을 "지금 내 화면의 어느 위치"로 옮기지 못해서다(H1).
    그렇다면 더 자세한 설명보다 화면 위에 다음에 누를 곳 하나를 짚어 주는 도움이 맞다. 다만 용어(H2)나 실수 두려움(H3)이 더 큰 원인이라면 위치 표시만으로는 멈춤이 줄지 않는다.
  evidence: |-
    [인터뷰, 관찰] 팀원 가족은 하고 싶은 일은 말할 수 있었지만, 자녀가 글로 보낸 위치 설명을 화면에서 찾지 못했다.
    [확인] 고령층의 디지털 역량은 일반 국민 대비 56.2%로 가장 낮고(SRC1), 60~79세의 81%가 디지털 서비스에 주변 도움을 받으며 63%가 그 요청을 부담스러워한다(SRC3). 병원 예약이 앱·온라인으로 옮겨 가며 현장 도우미도 대신 눌러 주는 데 그친다(SRC2).
    [팀 보고·정성 피드백] 화면 사진 위 표시를 실제 사이트로 옮겨 찾는 과정이 사용하지 않았을 때보다 쉽다는 응답을 얻었다고 보고했다(MVP 테스트 기록: 2026.10.30, 60대 2명). 소규모 주관적 응답으로, 완료율·시간 개선을 입증한 결과는 아니다.
    [팀 보고·외부 반응, 기존 E4] 팀원1의 인터뷰 기록(2026.10.30)에 따르면 서울 지역 디지털 배움터에 프로젝트를 소개하고 긍정적인 반응을 받았다고 한다. 문제를 겪은 경험이나 확정된 협력·사용성 효과의 근거는 아니다.

  design_decision: |-
    사용 순서(사용자 행동 기준):
    1. 가입·로그인하면 설정 창이 열리고 '도움 시작하기'를 누른다.
    2. 막힌 화면을 보여 준다. 집 PC에서는 '▶'로 화면을 공유하고, 공유가 어렵거나 휴대폰으로 찍어 둔 사진이 있으면 '사진 올리기'로 올린다.
      둘 다 있으면 가장 최근에 고른 쪽으로 묻고, 말풍선 맨 위에 '화면 공유로 보고 있어요' 또는 '올린 사진으로 물어봐요'가 보인다.
    3. '질문 입력'에 하고 싶은 일만 적고 '물어보기'를 누른다.
      선택 기능(핵심 글 입력 흐름과 별도): 글로 적기 어려우면 설정에서 '음성 인식'을 켜고(기본 꺼짐) '마이크'를 눌러 말한다. 브라우저 음성 인식(한국어)으로 들은 문장이 '질문 입력'에 적히고 바로 물어본다.
      듣는 중에는 '듣고 있어요. 하고 싶은 일을 말해 주세요.'가 보이고, 지원하지 않는 브라우저이거나 잘 듣지 못하면 글로 적으라고 안내한다.
    4. 누를 위치를 찾은 경우 '누를 곳을 찾았어요'와 안내 한 문장, 화면 사진 위의 빨간 테두리(누를 곳)가 보인다. 위치를 찾지 못한 경우 등은 F2의 결과별 표시를 따른다. 본인이 실제 사이트에서 그곳을 직접 누른다. (H1·H4)
    5. 다음 화면이 나오면 새 화면을 보여 주고(공유 중이면 그대로, 사진이면 '사진 바꾸기') '눌렀어요, 다음 알려 주세요'를 누른다.
      이전과 이미지 데이터가 다른 새 화면일 때만 이번 일에서 받은 안내를 모두 함께 보내 다음 단계를 받고 'N단계'가 하나 올라간다.
      사진을 바꾸지 않고 누르면 다시 묻지 않고 "바뀐 화면을 '사진 바꾸기'로 올린 뒤 다시 눌러 주세요."가 보인다.
      접수 완료 화면이면 '다 됐어요'가 보이고 더 누를 곳을 표시하지 않는다.
    표시 위치: 웹 페이지는 다른 프로그램 위에 직접 그릴 수 없어, 누를 곳은 도우미 말풍선 안의 '물어볼 때 본 화면' 사진 위에 표시한다.
      사진과 실제 화면은 배치가 같아 "오른쪽 아래" 같은 말을 해석하지 않고 같은 모양의 버튼을 찾으면 된다. 팀 기록에 따르면 60대 2명의 MVP 테스트에서 이 방식이 덜 헷갈린다는 응답을 얻었다(2026.10.30).
    불안을 줄이는 세 가지:
    - 한 번에 한 곳만 표시하고, '답변 중'·'보고 있어요'·'멈춤' 상태를 항상 보여 준다.
    - 결제·송금·삭제·제출처럼 되돌리기 어려운 버튼을 가리키면 누르기 전에 경고한다. AI가 위치를 잘못 짚을 수 있기 때문이다(H3). AI가 위험을 놓쳐도 안내 문장에 '송금·결제·삭제' 같은 낱말이 있으면 서버가 경고를 붙인다.
    - 화면 이미지는 앱 DB에 저장하지 않지만, 분석을 위해 외부 AI Gateway·모델 제공자에게 전송한다. 제공자의 보관·학습 이용 정책은 확인 필요하며 어디에도 저장되지 않는다고 보장하지 않는다. 질문·안내에도 이름·연락처 등 개인정보가 포함될 수 있다. '기록 저장'이 켜져 있으면 질문·안내를 앱 DB에 남기며, 끄기는 새 기록에 적용되고 기존 기록은 따로 삭제해야 한다.
    구현 상태: S1~S7 흐름마다 E2E 테스트가 있다(S7은 작은 창으로 띄웠다가 원래 화면으로 돌아오기). 결제·송금·삭제 경고, 기록 저장 끄기(서버), 설정 창의 '기록 저장' 스위치(#44)가 들어가 있다.
      상태 막대('답변 중'·'보고 있어요'·'멈춤')는 말풍선을 접어도 항상 보이고(#71), 화면 공유를 취소하거나 공유가 끊겨도 '▶'로 다시 시작할 수 있다(#72).
      새 화면일 때만 이어 묻기, 같은 사진으로 '다음' 막기, 입력 출처 표시가 들어가 있다(#78, S3에서 확인). 각 흐름의 통과 여부는 docker로 띄운 E2E 결과로 판단한다.
      말로 묻기(설정의 '음성 인식'·'마이크')도 선택 기능으로 들어가 있으나 현재 S1~S7에 음성 E2E 흐름은 없다. 실제 마이크·권한·음성 서비스 경로는 PC 크롬·엣지에서 별도 수동 확인 대상으로 둔다(수동 확인 완료를 뜻하지 않음).
    한계: AI 답은 매번 문장이 조금씩 다를 수 있다. 누를 곳을 찾지 못하면 표시 없이 안내 문장만 보인다. 화면 공유('▶')는 PC 크롬·엣지에서만 된다.
      음성 인식은 브라우저 기능이라 파이어폭스 등에서는 되지 않고, 크롬에서는 말한 소리가 브라우저 회사 서버에서 글자로 바뀔 수 있다.
    검증: 팀 기록의 60대 2명 MVP 정성 피드백(2026.10.30)은 insight.evidence와 같다.
      소규모 주관적 응답이라 일반화하기는 이르며, 완료율·소요 시간 개선은 미검증이다. 기능 동작 확인과 실제 사용성 효과 검증을 구분한다.

features:
  - id: F1
    name: 가입하고 도움 시작하기
    input: 첫 화면에서 '가입하기' → 이메일·비밀번호(8자 이상) → '가입'
    output: 계정이 만들어지고 설정 창과 '도움 시작하기' 버튼이 보인다. 같은 이메일로 다시 가입하거나 비밀번호가 짧으면 이유가 화면에 보인다
    done: "'가입'을 누르면 설정 창이 열리고 '도움 시작하기' 버튼이 보인다 (S1)"
  - id: F2
    name: 화면 사진을 올려 묻고 누를 곳 안내 받기
    input: "'도움 시작하기' → '눌러보슈 도우미 열기' → 도우미 안에 보이는 '사진 올리기' 버튼으로 막힌 화면 사진(진료과 선택 화면)을 고름 → '질문 입력'에 '병원 예약하고 싶어' → '물어보기'"
    output: |-
      '답변 중' 뒤에 안내 한 문장과 함께, 응답의 status·target 조합(API_CONVENTION.md 10-2)에 따라 아래 중 하나가 보인다. 어느 경우든 '누르는 건 직접 해 주세요.'가 함께 보인다.
      - 누를 곳을 찾음(IN_PROGRESS, target 있음): '누를 곳을 찾았어요'와 'N단계', 올린 사진 위 누를 곳 하나를 감싼 빨간 테두리, '눌렀어요, 다음 알려 주세요'
      - 다음 할 일은 있으나 위치를 짚지 못함(IN_PROGRESS, target 없음): 'N단계', 안내 문장, '눌렀어요, 다음 알려 주세요'만 보인다. '누를 곳을 찾았어요'와 빨간 테두리는 보이지 않는다
      - 화면만으로 판단하기 어려움(NEED_INFO, target 대부분 없음): '화면만으로는 알기 어려워요'와 무엇을 확인할지 알려 주는 안내 문장. '눌렀어요, 다음 알려 주세요'는 없고, 다른 화면 사진으로 바꿔 다시 묻는다
      - 이미 끝난 화면(DONE, target 항상 없음): '다 됐어요'와 안내 문장. 빨간 테두리와 '눌렀어요, 다음 알려 주세요'는 없다
      되돌리기 어려운 버튼 경고(F4)는 결과와 상관없이 함께 붙을 수 있다.
      '사진 올리기'는 화면에 보이는 버튼이며, 화면 공유('▶')가 안 될 때 사용자가 쓰는 대체 경로다(사진을 고르면 '사진 바꾸기'로 바뀐다).
      누를 곳이 있으면 '누를 곳 크게 보기'에 그 둘레를 확대해 함께 보여 준다(누를 곳이 사진 대부분을 차지하면 생략). 사진을 누르면 화면 가득 크게 보고 '닫기'·Esc·바깥 누르기로 닫는다.
      AI 요청이 실패하면 오류 문구가 보이고, 다시 보내도 되는 오류면 '방금 실패한 요청을 다시 보내요.'와 '다시 시도'가 보인다. 사진을 새로 고르거나 물어볼 화면을 바꾸면(▶로 공유 시작·공유 끊김) 이전 오류와 '다시 시도'는 사라진다.
    done: "진료과 선택 화면 사진(정상 고정 이미지)으로 물으면 '누를 곳을 찾았어요'와 안내 문장이 보이고, 올린 사진 위에 누를 곳 표시가 보인다 (S2)"
  - id: F3
    name: 다음 화면으로 이어서 끝까지 안내 받기
    input: "F2의 첫 안내('누를 곳을 찾았어요')를 받은 상태에서 '사진 바꾸기'로 다음 화면 사진(예약 날짜 선택)을 고르고 '눌렀어요, 다음 알려 주세요' → 마지막에 '사진 바꾸기'로 접수 결과 화면 사진을 고르고 다시 '눌렀어요, 다음 알려 주세요'"
    output: |-
      '눌렀어요, 다음 알려 주세요'를 누르거나 바로 전과 같은 질문으로 다시 '물어보기'하면, 새 화면일 때만 이번 일에서 받은 안내를 모두(오래된 순) 함께 보내 다음 단계의 안내를 받고 'N단계'가 하나 올라간다.
      새 화면 여부는 공유 캡처·사진 모두 직전 요청의 이미지 data URL과 다른지로 판단한다. 공유 화면을 새로 캡처해도 데이터가 같으면 이어 묻기로 보지 않는다. 바로 전 안내가 IN_PROGRESS일 때만 이어지며, 같은 사진·같은 질문으로 '물어보기'하면 새로 묻기(1단계)가 된다.
      사진으로 묻는 중에 지난번과 같은 사진으로 '눌렀어요, 다음 알려 주세요'를 누르면 요청을 보내지 않고 "바뀐 화면을 '사진 바꾸기'로 올린 뒤 다시 눌러 주세요."가 보인다.
      물어볼 화면은 가장 최근에 고른 쪽이다(공유 중에 사진을 고르면 사진, '▶'를 다시 누르면 공유 화면). 말풍선 맨 위에 '화면 공유로 보고 있어요' 또는 '올린 사진으로 물어봐요'가 보인다.
      결과 구분(누를 곳 찾음·target 없음·NEED_INFO·DONE)과 표시는 F2와 같다. NEED_INFO가 나오면 '눌렀어요, 다음 알려 주세요'가 없으므로 다른 화면 사진으로 바꿔 다시 묻는다.
      사진에서 접수 완료 화면을 읽으면 표시 없이 '다 됐어요'가 보인다. '다 됐어요'는 올린 사진의 완료 화면을 읽은 결과이며, 서비스가 실제 예약 접수 여부를 확인하거나 대신 처리하지 않는다.
    done: "같은 사진으로 '다음'을 누르면 요청 없이 '사진 바꾸기' 안내가 보이고, 예약 날짜 선택 화면 사진에는 '누를 곳을 찾았어요'·'2단계'와 누를 곳 표시가, 접수 결과 화면 사진에는 '다 됐어요'가 보인다. 말풍선에는 '올린 사진으로 물어봐요'가 보인다 (S3, 로그인부터 혼자 실행)"
  - id: F4
    name: 되돌리기 어려운 버튼 경고
    input: "'도움 시작하기' → '눌러보슈 도우미 열기' → '사진 올리기'로 개인정보 입력 화면('제출' 버튼) 사진을 고름 → '질문 입력'에 '예약 마무리하고 싶어' → '물어보기'"
    output: "응답에 risk가 있으면 경고를 표시한다(제출 위험 문구: '되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요'). 누를 곳 표시는 target이 있을 때만 보이며, target이 없어도 경고는 보일 수 있다. 서버 설정 riskWarning은 기본 켜짐이며 설정 창에 끄는 스위치는 아직 없다"
    done: "'되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고가 보인다 (S4)"
  - id: F5
    name: 도움 기록
    input: "새로 가입한 계정에서 '도움 시작하기' → '눌러보슈 도우미 열기' → '사진 올리기'로 사진을 고름 → '병원 예약하고 싶어'를 물어봄 → 아이콘 아래 '설정' → 설정 창의 '도움 기록'"
    output: |-
      이번에 물어본 질문과 받은 안내 문장이 목록 맨 위에 새 항목으로 생긴다 (최신순 최대 50개, 화면 이미지는 앱 DB에 저장하지 않음). '기록 모두 지우기'로 전부 지울 수 있다.
      기록 저장이 실패해도 이미 받은 안내는 그대로 보이며, 이때는 새 항목이 생기지 않는다.
    done: "기록이 없던 새 계정의 '도움 기록' 맨 위 항목에 이번에 물어본 '병원 예약하고 싶어'와 받은 안내 문장이 보인다 (S5)"
  - id: F6
    name: 기록 남기지 않기 (개인정보 보호)
    input: "새로 가입한 계정의 설정 창에서 '기록 저장'을 끄고 저장이 끝난 것(스위치가 꺼진 채 유지, 오류 문구 없음)을 확인 → '도움 시작하기' → '눌러보슈 도우미 열기' → '사진 올리기'로 사진을 고름 → '병원 예약하고 싶어'를 물어봄 → '설정' → '도움 기록'"
    output: |-
      화면 이미지는 앱 DB에 저장하지 않지만 분석을 위해 외부 AI로 전송한다(제공자의 보관·학습 정책은 확인 필요). '기록 저장' 끄기가 서버에 저장된 뒤 보낸 새 질문부터 질문과 안내가 앱 DB에 남지 않는다(서버는 기록을 남길 때마다 최신 설정을 읽는다).
      저장하는 동안에는 '설정을 저장하고 있어요…'가 보이고 '도움 시작하기'를 누를 수 없어, 저장이 끝나기 전에 물어볼 수 없다.
      저장에 실패하면 스위치가 켜진 상태로 돌아가고 설정 창에 오류 문구가 보인다. 끄기 전에 남은 기록은 지워지지 않으며, '도움 기록'의 '기록 모두 지우기'로 따로 지운다.
    done: "'기록 저장' 끄기가 저장된 뒤(스위치가 꺼진 채로 남고 오류 문구 없음) 물어보면 '도움 기록'에 '아직 도움 기록이 없어요'가 보인다. 저장이 끝난 뒤의 질문부터 기록을 남기지 않는다 (S6)"
  - id: F7
    name: 화면 공유로 바로 보여 주기
    input: 아이콘 모드에서 '▶'를 누르고 브라우저의 공유 선택 창에서 화면을 고름, '■'로 멈춤
    output: |-
      사진을 따로 찍지 않아도 물어볼 때 지금 장면을 찍어 F2·F3과 같은 안내를 받는다. 공유가 안 되면 말풍선에 '사진 올리기'로 올리라는 안내가 보인다.
      공유 선택 창에서 취소했거나 브라우저의 '공유 중지'로 끝나도 '▶'로 다시 시작할 수 있다. '공유 중지'로 끝나고 올린 사진이 없으면 말풍선에 '화면 보기가 끝났어요. 다시 보려면 ▶를 눌러 주세요.'가 보인다.
      탭·창 공유 시 CaptureController를 지원하면 눌러보슈 탭에 머물도록 요청한다(best-effort). 미지원·요청 실패·전체 화면 공유에서는 탭 유지를 보장하지 않는다. 공유 직후 첫 장면이 아직 준비되지 않았으면 최대 2초 기다리며, 그 뒤에도 준비되지 않으면 캡처 오류 안내가 나올 수 있다.
    done: "'▶'를 누르고 화면을 고르면 '보고 있어요'가 보이고, '■'를 누르면 '멈춤'이 보인다 (PC 크롬·엣지에서 손으로 확인. 현재 S1~S7에는 실제 OS·브라우저 공유 선택 창과 권한 경로의 검증이 없어 별도 수동 확인 대상)"
  - id: F8
    name: 작은 창으로 띄우기 (지원 브라우저에서만 쓰는 선택 기능)
    input: "아이콘 모드에서 '작은 창으로 띄우기' → (작은 창에서) 평소처럼 '눌러보슈 도우미 열기'·▶·'사진 올리기'·'물어보기' → 원래 페이지의 '이 화면으로 돌아오기' 또는 작은 창 닫기"
    output: |-
      지원 조건: 작은 창 기능(Document Picture-in-Picture)을 지원하는 PC 크롬·엣지 계열 브라우저에서만 '작은 창으로 띄우기' 버튼이 보인다. 지원하지 않는 브라우저에서는 버튼이 없고 원래 페이지를 그대로 쓴다. 작은 창을 열지 못하면 '작은 창을 열지 못했어요'가 보인다.
      열기: 눌러보슈 화면(아이콘 모드·설정·도움 기록)이 다른 창 위에 떠 있는 작은 창으로 옮겨 가고, 원래 페이지에는 '작은 창에서 도와드리고 있어요'와 '이 화면으로 돌아오기' 버튼이 보인다. 작은 창으로 옮겨도 화면 공유·안내는 이어진다.
      닫기·돌아오기: '이 화면으로 돌아오기'를 누르거나 작은 창을 닫으면 작은 창이 닫히고 원래 페이지에 눌러보슈 화면이 다시 보인다. 로그아웃해도 작은 창이 닫힌다.
      핵심 흐름(F1~F7)은 작은 창 없이 원래 페이지에서 모두 된다.
    done: "'작은 창으로 띄우기'를 누르면 작은 창에 눌러보슈 도우미(▶·'설정')가 보이고 원래 페이지에 '작은 창에서 도와드리고 있어요'가 보이며, '이 화면으로 돌아오기'를 누르면 작은 창이 닫히고 원래 페이지로 돌아온다 (S7). 다른 프로그램 위에 떠 있는지와 작은 창 안에서 ▶·물어보기·사진 올리기는 PC 크롬·엣지에서 손으로 확인한다(자동 테스트 브라우저에는 다른 프로그램이 없어 확인 불가)"
