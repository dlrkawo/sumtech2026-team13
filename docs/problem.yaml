    claim: |-
      일부 병원은 앱 예약만 받고 전화 예약은 받지 않아 디지털 접근성이 낮은 노인이 진료를 받지 못하거나 오래 기다릴 수 있고, 도우미도 화면을 대신 눌러 주는 데 그치는 경우가 많다.
      기고문이라 통계 수치는 없다.
  - id: SRC3
    url: "https://www.fnnews.com/news/202508210953157536"
    title: "HP코리아, '우리 함께 디지털' 캠페인 론칭.. 국내 디지털 문해력 조사 결과 발표 (파이낸셜뉴스, 2025.08.21)"
    claim: |-
      HP코리아, 2025년 5월, 수도권 1,000명(만 60~79세 400명) 온라인·현장 설문. 만 60~79세의 81%가 디지털 서비스 이용 시 주변 도움을 받은 적이 있고, 63%가 도움 요청이 눈치 보이거나 부담스럽다고 답했다.
      기업 조사이고 수도권 표본이며, 누구에게 도움을 받는지는 나오지 않는다.
