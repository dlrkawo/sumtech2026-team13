# 13팀 사용자 핵심 흐름. 대시보드와 주최 측 실행이 기본 브랜치의 이 파일을 직접 읽는다.
# 흐름마다 e2e/scenarios/<id>.spec.ts를 하나씩 둔다(S1.spec.ts …).
#
# [검토용 메모 — 키트 양식에 없는 키라서 주석으로 옮김]
# - 인증: 로그인·회원가입은 원본 기획에 있지만 MVP 포함 여부 미결정. 아래 흐름은 로그인 없는 진입을 가정(account 생략).
# - 상호작용: 분석은 사용자가 버튼으로 요청하고, 위치는 화면 사진(미리보기) 위에 표시. 실제 화면에서의 선택은 사용자가 직접 한다.
# - E2E 제약: 주최 측 E2E는 팀 설정 없이 돌아서 브라우저의 화면 공유 선택 창을 조작할 수 없고, 다른 탭 이동(추가 page.goto)·
#   가짜 응답(page.route 등)도 금지다. 그래서 흐름의 입력은 '화면 사진 올리기'(e2e/fixtures/의 캡처 이미지)로 쓴다.
#   화면 공유(getDisplayMedia)는 실제 사용·발표용으로 그대로 두고, 같은 분석 흐름으로 처리한다.
# - E2E에서 재현할 수 없어 흐름에서 뺀 것(기능으로는 유지): 화면 공유 시작·중지, 공유 선택 취소, 분석 실패 후 다시 시도.
# - 필요한 입력 자료(e2e/fixtures/, 직접 만든 모의 페이지 캡처, 개인정보 없음, 파일당 10MB 이하):
#   mock-step1.png(예약 시작 화면), mock-step2.png(다음 단계 화면), mock-done.png('신청이 완료되었습니다' 문구), mock-unclear.png(완료 문구 없음)
platform: desktop
platformReason: |
  MVP 지원 환경을 PC 크롬·엣지 최신 버전으로 제한한다. 부모님이 PC 브라우저에서 낯선 웹 서비스를 이용하다 막혔을 때,
  같은 PC에서 이 서비스를 열어 현재 화면을 보여 주고 한 단계씩 안내를 받는 장면을 대상으로 한다.
scenarios:
  - id: S1
    title: 도움받을 작업을 입력한다
    steps:
      - 첫 화면에서 하고 싶은 작업을 입력한다
      - "'다음' 버튼을 누른다"
    expected: 입력한 작업 요약과 '화면을 공유해 주세요' 안내가 보인다
  - id: S2
    title: 현재 화면 사진으로 첫 안내를 받는다
    steps:
      - 첫 화면에서 하고 싶은 작업을 입력하고 '다음'을 누른다
      - "'화면 사진 올리기'를 눌러 예약 시작 화면 사진을 고른다"
      - "'현재 화면 분석' 버튼을 누른다"
    expected: "'화면을 분석하고 있어요' 상태 뒤에 한 단계 안내 문장이 보이고, 올린 화면 사진 위에 눌러야 할 위치가 빨간 테두리로 표시된다"
  - id: S3
    title: 다음 화면 사진으로 다음 단계 안내를 받는다
    steps:
      - 첫 화면에서 하고 싶은 작업을 입력하고 '다음'을 누른다
      - "'화면 사진 올리기'로 예약 시작 화면 사진을 올리고 '현재 화면 분석'을 누른다"
      - 첫 안내 문장과 표시 위치를 확인한다
      - "'화면 사진 올리기'를 눌러 다음 단계 화면 사진을 고른다"
      - "'다음 화면 분석' 버튼을 누른다"
    expected: 첫 안내와 다른 2단계 안내 문장이 보이고, 새로 올린 화면 사진 위에 빨간 테두리가 표시된다
  - id: S4
    title: 완료 문구가 있는 화면에서 완료를 확인한다
    steps:
      - 첫 화면에서 하고 싶은 작업을 입력하고 '다음'을 누른다
      - "'화면 사진 올리기'를 눌러 '신청이 완료되었습니다' 문구가 있는 화면 사진을 고른다"
      - "'현재 화면 분석' 버튼을 누른다"
    expected: "'화면에서 완료 상태를 확인했어요'가 보인다"
  - id: S5
    title: 완료 문구가 없는 화면에서는 완료를 단정하지 않는다
    steps:
      - 첫 화면에서 하고 싶은 작업을 입력하고 '다음'을 누른다
      - "'화면 사진 올리기'를 눌러 완료 문구가 없는 화면 사진을 고른다"
      - "'현재 화면 분석' 버튼을 누른다"
    expected: "'완료 여부를 확인할 수 없어요. 화면을 직접 확인해 주세요'가 보인다"
