platform: desktop
platformReason: "주 사용자(60~70대)가 병원 홈페이지 예약을 집 PC에서 하고, 막힌 화면을 PC 브라우저로 공유하거나 사진으로 올려 큰 화면에서 안내를 보는 것이 이 서비스의 사용 장면이라서. 다른 앱 화면 공유(getDisplayMedia)도 PC 브라우저에서만 된다"

scenarios:

  - id: S1
    title: "가입하고 설정 창에 들어간다"
    steps:
      - "사이트에 접속한다"
      - "'가입하기'를 누른다"
      - "이메일과 비밀번호를 입력한다"
      - "'가입' 버튼을 누른다"
    expected: "설정 창이 열리고 '도움 시작하기' 버튼이 보인다"

  - id: S2
    title: "병원 예약 화면 사진을 올려 묻고 누를 곳 안내를 받는다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'눌러보슈 도우미 열기'를 누른다"
      - "도우미 안에 보이는 '사진 올리기' 버튼을 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
    expected: "'누를 곳을 찾았어요'와 안내 문장이 보이고, 올린 사진 위에 누를 곳 표시(빨간 테두리)가 보인다"

  - id: S3
    title: "다음 화면으로 이어서 예약 완료까지 안내를 받는다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'눌러보슈 도우미 열기'를 누른다"
      - "도우미 안에 보이는 '사진 올리기' 버튼을 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누르고 '누를 곳을 찾았어요'가 보일 때까지 기다린다"
      - "'사진 바꾸기' 버튼을 눌러 예약 날짜 선택 화면 사진을 고른다"
      - "'눌렀어요, 다음 알려 주세요'를 누른다"
      - "'사진 바꾸기' 버튼을 눌러 접수 결과 화면 사진을 고른다"
      - "'눌렀어요, 다음 알려 주세요'를 누른다"
    expected: "예약 날짜 선택 화면 사진에는 '누를 곳을 찾았어요'와 누를 곳 표시가 보이고, 접수 결과 화면 사진에는 '다 됐어요'가 보인다"

  - id: S4
    title: "개인정보 제출 버튼 앞에서 경고를 본다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'눌러보슈 도우미 열기'를 누른다"
      - "도우미 안에 보이는 '사진 올리기' 버튼을 눌러 개인정보 입력 화면 사진을 고른다"
      - "'질문 입력'에 '예약 마무리하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
    expected: "'되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고가 보인다"

  - id: S5
    title: "새로 가입해 물어본 뒤 도움 기록에서 이번 질문과 안내를 다시 본다"
    steps:
      - "사이트에 접속한다"
      - "'가입하기'를 누른다"
      - "이메일과 비밀번호를 입력하고 '가입' 버튼을 누른다"
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'눌러보슈 도우미 열기'를 누른다"
      - "도우미 안에 보이는 '사진 올리기' 버튼을 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누르고 안내 문장이 보일 때까지 기다린다"
      - "아이콘 아래 '설정' 버튼을 누른다"
      - "설정 창에서 '도움 기록'을 누른다"
    expected: "기록이 없던 새 계정의 '도움 기록' 맨 위 항목에 이번에 물어본 '병원 예약하고 싶어'와 방금 받은 안내 문장이 보인다"

  - id: S6
    title: "새로 가입해 기록 저장을 끄고 물어보면 기록이 남지 않는다"
    steps:
      - "사이트에 접속한다"
      - "'가입하기'를 누른다"
      - "이메일과 비밀번호를 입력하고 '가입' 버튼을 누른다"
      - "설정 창에서 '기록 저장'을 끄고, 저장이 끝나 스위치가 꺼진 채로 남고 오류 문구가 없는 것을 확인한다"
      - "'도움 시작하기'를 누른다"
      - "'눌러보슈 도우미 열기'를 누른다"
      - "도우미 안에 보이는 '사진 올리기' 버튼을 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누르고 안내 문장이 보일 때까지 기다린다"
      - "아이콘 아래 '설정' 버튼을 누른다"
      - "설정 창에서 '도움 기록'을 누른다"
    expected: "'도움 기록'에 '아직 도움 기록이 없어요'가 보인다"

  - id: S7
    title: "도우미를 작은 창으로 띄웠다가 원래 화면으로 돌아온다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'작은 창으로 띄우기'를 누른다"
      - "작은 창에서 '눌러보슈 도우미 열기'를 누른다"
      - "원래 화면에서 '이 화면으로 돌아오기'를 누른다"
    expected: "작은 창이 열려 그 안에 ▶와 '설정' 버튼이 보이고 원래 화면에는 '작은 창에서 도와드리고 있어요'가 보인다. '이 화면으로 돌아오기'를 누르면 작은 창이 닫히고 원래 화면에 '작은 창으로 띄우기' 버튼이 다시 보인다"
