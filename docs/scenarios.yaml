# ════════════════════════════════════════
#  핵심 사용 흐름 (scenarios.yaml)
# ════════════════════════════════════════
# 작성 규칙
#  - 흐름은 3~8개. id는 S1부터 차례대로.
#  - steps는 1~12단계. 사용자가 화면에서 하는 행동만 한 줄씩 적는다.
#  - expected는 마지막에 화면에서 눈으로 확인할 결과. 화면에 실제로 나오는 글자로 적는다.
#  - 흐름 하나는 처음부터 끝까지 혼자 돌아가야 한다. (다른 흐름의 결과에 기대지 않기)
#  - 로그인은 단계로 쓰지 않고 account: 사용자 로 적는다 (시드 계정으로 로그인한 상태에서 시작).
#
# 10.29 23:50 개정: 대표 과업을 '병원 홈페이지 진료 예약' 하나로 좁히고, 모든 흐름을 자동 테스트로 끝까지 돌 수 있게 함.
#  - 화면은 '화면 사진 올리기'로 보여 준다 (e2e/fixtures/의 모의 병원 예약 화면 사진)
#      mock-step1.png 진료과 선택 / mock-step2.png 예약 날짜 선택 / mock-unclear.png 개인정보 입력('제출') / mock-done.png 접수 결과
#  - '▶' 화면 공유와 마이크는 자동 테스트 브라우저가 다룰 수 없어 흐름에서 뺌 (problem.yaml F7, solution_paths deferred)
#  - 안내 문장은 AI 답이라 매번 다를 수 있어, expected는 항상 같은 화면 글자('1단계', '여기를 누르세요', 경고 문구 등)로 확인한다
#  - 화면 이름은 앞 패치(S4·S6·S7 화면 사진 올리기)와 같다: '화면 사진 올리기'(파일 선택), '질문 입력', '물어보기', 아이콘 아래 '설정', '도움 기록'
#    새로 필요한 화면 글자: '다음 화면 보기'(파일 선택), '1단계'·'2단계', 누를 곳 표시의 '여기를 누르세요', '다 끝났어요', '기록 저장'(스위치), '아직 도움 기록이 없어요'

platform: desktop
platformReason: "주 사용자(60~70대)가 병원 홈페이지 예약을 집 PC에서 하고, 막힌 화면을 PC 브라우저로 공유하거나 사진으로 올려 큰 화면에서 안내를 보는 것이 이 서비스의 사용 장면이라서. 다른 앱 화면 공유(getDisplayMedia)도 PC 브라우저에서만 된다"

scenarios:

  - id: S1
    title: "가입하고 설정 창에 들어간다"
    steps:
      - "사이트에 접속한다"
      - "'가입하기'를 누른다"
      - "이메일과 비밀번호를 입력한다"
      - "'가입' 버튼을 누른다"
    expected: "설정 창이 열리고 '도움 시작하기' 버튼이 보인다"

  - id: S2
    title: "병원 예약 화면 사진을 올려 묻고 누를 곳 안내를 받는다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
    expected: "'1단계' 안내 문장이 보이고, 올린 사진 위에 '여기를 누르세요' 표시가 보인다"

  - id: S3
    title: "다음 화면으로 이어서 예약 완료까지 안내를 받는다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
      - "'다음 화면 보기'를 눌러 예약 날짜 선택 화면 사진을 고른다"
      - "'다음 화면 보기'를 눌러 접수 결과 화면 사진을 고른다"
    expected: "예약 날짜 선택 화면 사진에는 '2단계' 안내가 보이고, 접수 결과 화면 사진을 올리면 '다 끝났어요' 안내가 보인다"

  - id: S4
    title: "개인정보 제출 버튼 앞에서 경고를 본다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 개인정보 입력 화면 사진을 고른다"
      - "'질문 입력'에 '예약 마무리하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
    expected: "'되돌리기 어려운 버튼이에요. 누르기 전에 한 번 더 확인하세요' 경고가 보인다"

  - id: S5
    title: "지난 도움 기록을 다시 본다"
    account: 사용자
    steps:
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
      - "아이콘 아래 '설정' 버튼을 누른다"
      - "설정 창에서 '도움 기록'을 누른다"
    expected: "'도움 기록' 목록에 '병원 예약하고 싶어'가 보인다"

  - id: S6
    title: "새로 가입해 기록 저장을 끄고 물어보면 기록이 남지 않는다"
    steps:
      - "사이트에 접속한다"
      - "'가입하기'를 누른다"
      - "이메일과 비밀번호를 입력하고 '가입' 버튼을 누른다"
      - "설정 창에서 '기록 저장'을 끈다"
      - "'도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 진료과 선택 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
      - "아이콘 아래 '설정' 버튼을 누른다"
      - "설정 창에서 '도움 기록'을 누른다"
    expected: "'도움 기록'에 '아직 도움 기록이 없어요'가 보인다"
