platform: desktop
platform_reason: "MVP 지원 환경을 PC 크롬·엣지 최신 버전으로 제한하고, 사용자가 대상 브라우저 탭 공유를 직접 시작·종료하는 핵심 흐름을 검증한다. 탭 공유와 안내 표시 방식은 브라우저별 구현 가능성을 팀이 확인해야 한다."
assumptions:
  authentication: "로그인·회원가입은 원본 기획에 있지만 MVP 포함 여부가 미결정이다. 아래 시나리오는 권고안(로그인 없는 진입)을 가정한 검토용 초안이며 팀 합의 후 수정한다."
  interaction: "분석은 사용자가 버튼으로 요청하고, 위치는 안내 화면의 대상 탭 미리보기에 표시하며, 대상 탭에서의 선택과 제출은 사용자가 직접 한다. 이 흐름은 팀 검토용 제안이다."
  test_pages: "완료/미완료 문구를 검증할 저위험 모의 웹 페이지가 필요하다. 현재 존재 여부는 팀 확인 필요."
scenarios:
  - id: S1
    title: "도움받을 작업을 입력한다"
    steps:
      - "서비스를 연다"
      - "하고 싶은 작업을 입력한다"
      - "'다음' 버튼을 누른다"
    expected: "입력한 작업 요약과 '화면을 공유해 주세요' 안내가 보인다"
  - id: S2
    title: "대상 웹 탭을 공유한다"
    steps:
      - "서비스를 연다"
      - "작업 목표를 입력한다"
      - "'다음' 버튼을 누른다"
      - "'화면 공유' 버튼을 누른다"
      - "브라우저 공유 선택 창에서 대상 웹 탭을 선택한다"
      - "'공유'를 눌러 공유를 시작한다"
    expected: "서비스 화면에 '화면 공유 중' 상태, 선택한 탭 제목, '공유 중지' 버튼이 보인다. 탭 제목 표시가 현재 UI에서 지원되는지는 팀 확인 필요"
  - id: S3
    title: "현재 화면에서 첫 안내를 확인한다"
    steps:
      - "서비스를 열고 작업 목표를 입력한 뒤 '다음'을 누른다"
      - "'화면 공유'를 누르고 대상 웹 탭을 선택해 공유한다"
      - "공유 중인 대상 탭에서 안내받을 페이지를 연다"
      - "서비스 화면으로 돌아온다"
      - "'현재 화면 분석' 버튼을 누른다"
    expected: "'화면을 분석하고 있어요' 상태 뒤에 한 단계 안내 문장과 대상 탭 화면 미리보기 위 위치 표시가 보인다"
  - id: S4
    title: "직접 선택한 뒤 다음 안내를 받는다"
    steps:
      - "서비스를 열고 작업 목표를 입력한 뒤 '다음'을 누른다"
      - "'화면 공유'를 누르고 안내받을 웹 탭을 선택해 공유한다"
      - "'현재 화면 분석'을 눌러 첫 안내를 받는다"
      - "안내 문장과 표시 위치를 확인한다"
      - "브라우저에서 공유 중인 대상 웹 탭으로 전환한다"
      - "안내된 위치를 직접 선택한다"
      - "서비스 탭으로 돌아와 '다음 화면 분석' 버튼을 누른다"
    expected: "새 화면을 분석한 뒤 다음 단계 안내 또는 확인 가능한 완료 문구가 보인다"
  - id: S5
    title: "완료 문구가 있는 모의 화면에서 완료 여부를 확인한다"
    steps:
      - "서비스를 열고 작업 목표를 입력한 뒤 '다음'을 누른다"
      - "'화면 공유'를 누르고 시나리오용 모의 웹 탭을 선택한다"
      - "모의 웹 탭에 '신청이 완료되었습니다' 문구가 표시된 상태를 연다"
      - "서비스 탭으로 돌아와 '현재 화면 분석'을 누른다"
    expected: "모의 화면의 '신청이 완료되었습니다' 문구를 확인할 수 있으면 '화면에서 완료 상태를 확인했어요'가 보인다. 이 문구 기준의 판독은 팀이 구현·검증해야 한다"
  - id: S6
    title: "탭 공유 선택을 취소한다"
    steps:
      - "서비스를 열고 작업 목표를 입력한 뒤 '다음'을 누른다"
      - "'화면 공유'를 누른다"
      - "브라우저 공유 선택 창에서 '취소'를 누른다"
    expected: "'화면 공유가 시작되지 않았습니다' 안내와 '다시 공유' 버튼이 보인다"
  - id: S7
    title: "화면 분석 실패 후 다시 시도한다"
    steps:
      - "서비스를 열고 작업 목표를 입력한 뒤 '다음'을 누른다"
      - "'화면 공유'를 누르고 대상 웹 탭을 선택해 공유한다"
      - "'현재 화면 분석'을 누른다"
      - "'다시 시도' 버튼을 누른다"
    expected: "분석 실패가 발생하면 오류 안내와 '다시 시도' 버튼이 보인다. 버튼을 누른 뒤에는 '분석 중' 상태가 보인다. 반복 검증을 위해 오류 응답과 재시도 성공 응답을 테스트 환경에서 준비해야 한다"
  - id: S8
    title: "완료 문구가 없는 화면에서는 완료를 단정하지 않는다"
    steps:
      - "서비스를 열고 작업 목표를 입력한 뒤 '다음'을 누른다"
      - "'화면 공유'를 누르고 완료 문구가 없는 모의 웹 탭을 선택한다"
      - "서비스 탭에서 '현재 화면 분석'을 누른다"
    expected: "화면에서 완료 근거를 확인할 수 없을 때 '완료 여부를 확인할 수 없어요. 화면을 직접 확인해 주세요'가 보인다. 이 판정 동작은 팀이 구현·검증해야 한다"
