# ════════════════════════════════════════
#  핵심 사용 흐름 (scenarios.yaml)
# ════════════════════════════════════════
# 작성 규칙
#  - 흐름은 3~8개. id는 S1부터 차례대로.
#  - steps는 1~12단계. 사용자가 화면에서 하는 행동만 한 줄씩 적는다.
#      좋은 예: "'▶' 버튼을 누른다"   나쁜 예: "AI가 화면을 분석한다"
#  - expected는 마지막에 화면에서 눈으로 확인할 결과. 화면에 실제로 나오는 글자로 적는다.
#  - 흐름 하나는 처음부터 끝까지 혼자 돌아가야 한다. (다른 흐름의 결과에 기대지 않기)
#  - 흐름마다 e2e/scenarios/S1.spec.ts 처럼 테스트 파일이 하나씩 짝으로 만들어진다.
#
# 화면 흐름 (기획 확정)
#  사이트 접속 → 가입/로그인(설정 창 형태) → 설정 창 → [도움 시작하기] → 아이콘 모드
#  아이콘 모드: 플레이/정지 버튼 항상 표시, 답변 중에는 '답변 중' 아이콘 표시, 아래에 설정 버튼 항상 표시
#  아이콘 모드의 [설정] → 설정 창 → [도움 시작하기] → 아이콘 모드
#  화면 얻기: 실제 사용은 '▶'(화면 공유), 자동 테스트·시연은 '화면 사진 올리기'(e2e/fixtures/의 모의 화면 사진)로 같은 안내까지 간다
#    S4·S7: mock-step1.png(병원 예약 시작 화면) / S6: mock-transfer.png(모의 은행 송금 화면, '보내기' 버튼)
#  마이크: '음성 인식'을 켜면 '마이크' 버튼이 생기고, 누르면 마이크가 켜져 말한 내용이 글자로 바뀌어 '질문 입력'에 들어간다

# ────────────────────────────────────────
#  플랫폼
# ────────────────────────────────────────
platform: desktop            # desktop | mobile | both
platformReason: "화면공유(getDisplayMedia)는 PC 브라우저에서만 다른 앱 화면을 공유할 수 있어서"

# ────────────────────────────────────────
#  흐름
# ────────────────────────────────────────
scenarios:

  - id: S1
    title: "가입하고 설정 창에 들어간다"
    steps:
      - "사이트에 접속한다"
      - "'가입하기'를 누른다"
      - "이메일과 비밀번호를 입력한다"
      - "'가입' 버튼을 누른다"
    expected: "설정 창이 열리고 '도움 시작하기' 버튼이 보인다"

  - id: S2
    title: "로그인하고 도움을 시작한다"
    steps:
      - "사이트에 접속한다"
      - "이메일과 비밀번호를 입력한다"
      - "'로그인' 버튼을 누른다"
      - "설정 창에서 '도움 시작하기'를 누른다"
    expected: "설정 창이 사라지고 아이콘 모드에서 '▶' 버튼과 '설정' 버튼이 보인다"

  - id: S3
    title: "화면 보기를 시작하고 멈춘다"
    steps:
      - "사이트에 접속해 로그인한다"
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'▶' 버튼을 누른다"
      - "'■' 버튼을 누른다"
    expected: "'멈춤' 상태가 표시되고 다시 '▶' 버튼이 보인다"
    # 확인 필요: ▶를 누른 뒤 '보고 있어요' 상태와 '■' 버튼이 보이는 것도 중간 확인할지

  - id: S4
    title: "화면 사진을 올리고 하고 싶은 일을 물어 누를 곳 안내를 받는다"
    steps:
      - "사이트에 접속해 로그인한다"
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 병원 예약 시작 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
    expected: "'답변 중' 아이콘이 보이고, 안내 문장과 올린 사진 위에 누를 곳 표시가 나타난다"

  - id: S5
    title: "설정 창으로 돌아가 설정을 바꾸고 다시 도움을 시작한다"
    steps:
      - "사이트에 접속해 로그인한다"
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "아이콘 아래 '설정' 버튼을 누른다"
      - "'화면 가장자리 표시'를 끈다"
      - "'도움 시작하기'를 누른다"
    expected: "아이콘 모드로 돌아오고, 다시 설정 창을 열면 '화면 가장자리 표시'가 꺼져 있다"

  - id: S6
    title: "송금 화면에서 위험 경고를 본다"
    steps:
      - "사이트에 접속해 로그인한다"
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 은행 송금 화면 사진을 고른다"
      - "'질문 입력'에 '친구에게 만원 보내고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
    expected: "'돈이 나가는 버튼이에요. 한 번 더 확인하세요' 경고가 보인다"

  - id: S7
    title: "지난 도움 기록을 다시 본다"
    steps:
      - "사이트에 접속해 로그인한다"
      - "설정 창에서 '도움 시작하기'를 누른다"
      - "'화면 사진 올리기'를 눌러 병원 예약 시작 화면 사진을 고른다"
      - "'질문 입력'에 '병원 예약하고 싶어'를 적는다"
      - "'물어보기' 버튼을 누른다"
      - "아이콘 아래 '설정' 버튼을 누른다"
      - "설정 창에서 '도움 기록'을 누른다"
    expected: "도움 기록 목록에 '병원 예약하고 싶어'가 보인다"

  - id: S8
    title: "마이크로 말한 내용이 글자로 바뀌어 질문 입력에 들어간다"
    steps:
      - "사이트에 접속해 로그인한다"
      - "설정 창에서 '음성 인식'을 켠다"
      - "'도움 시작하기'를 누른다"
      - "'마이크' 버튼을 누른다"
      - "'친구에게 만원 보내고 싶어'라고 말한다"
    expected: "마이크가 켜져 '듣고 있어요'가 보이고, 말한 내용이 글자로 바뀌어 '질문 입력'에 '친구에게 만원 보내고 싶어'가 적힌다"
    # 확인 필요: 채점기의 자동 테스트 브라우저에는 실제 마이크가 없어 '말한다' 단계를 재현하기 어려움. 개발 팀과 확인
